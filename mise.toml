[tools]
python = "3.13"
uv = "latest"
# Kubernetes checks; CI downloads the same versions (.github/workflows/ci.yaml)
kustomize = "5.8.1"
kubeconform = "0.8.0"
kind = "0.33.0"

[env]
VIRTUAL_ENV = "{{config_root}}/.venv"
PYTHONPATH = "{{config_root}}/files"
_.path = [".venv/bin"]

[hooks.enter]
run = "test -d .venv || uv sync --python 3.13"

[tasks.test]
description = "Run unit tests"
run = "python -m pytest tests/ -v"

[tasks.test-integration]
description = "Run integration tests (requires podman)"
run = "tests/run-integration-tests.sh"

[tasks.test-sync]
description = "Run hub-spoke sync test (3 MISP instances)"
run = "tests/run-sync-test.sh"

[tasks.test-migration]
description = "Run the migration suite (MariaDB to MariaDB and to PostgreSQL)"
run = "tests/run-migration-tests.sh"

[tasks.test-kustomize]
description = "Render the Kustomize base with each component and validate against the schemas"
run = "scripts/check-kustomize.sh"

[tasks.test-kind]
description = "Apply the Kustomize base to a kind cluster and run the smoke test (build the images first)"
run = "tests/run-kind-test.sh ${@}"

[tasks.test-all]
description = "Run unit + integration + sync + migration tests"
depends = ["test", "test-integration", "test-sync", "test-migration"]

[tasks.smoketest]
description = "Run smoke test against a live MISP instance"
run = """
#!/usr/bin/env bash
URL="${1:?Usage: mise run smoketest <url>}"
read -rsp "API key: " KEY; echo
tests/smoketest.sh "$URL" "$KEY"
"""

[tasks.logs]
description = "Follow integration test compose logs"
run = "${COMPOSE_CMD:-podman compose} -f deploy/docker-compose.yml -f tests/docker-compose.test.yml logs -f"

[tasks.logs-sync]
description = "Follow sync test compose logs"
run = "${COMPOSE_CMD:-podman compose} -f tests/docker-compose.sync-test.yml logs -f"

[tasks.settings-update]
description = "Regenerate files/misp-config/settings-upstream.yaml from a live MISP (builds and runs the test stack)"
run = "scripts/update-settings.sh ${@}"

[tasks.composer-lock]
description = "Resolve MISP's PHP dependencies for the current CORE_TAG into files/composer.lock"
run = "scripts/update-composer-lock.sh"

[tasks.release]
description = "Prepare a release: bump MISP version (optional), update image tags, create git tag"
run = "scripts/release.sh ${@}"
