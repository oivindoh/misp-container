# CI installs the same tools, checked against mise.lock. After a version change here:
#   mise lock --platform linux-x64,linux-arm64,macos-arm64,macos-x64
[tools]
python = "3.13"
uv = "0.13.0"
# The chart checks and the stack suites
helm = "4.3.0"
kubeconform = "0.8.0"
kubectl = "1.37.1"

[env]
VIRTUAL_ENV = "{{config_root}}/.venv"
PYTHONPATH = "{{config_root}}/files"
_.path = [".venv/bin"]

[hooks.enter]
run = "test -d .venv || uv sync --python 3.13"

[tasks.test]
description = "Run unit tests"
run = "python -m pytest tests/ -v --ignore=tests/e2e"

[tasks.build]
description = "Build the misp and modules images under MISP_IMAGE_TAG, else the chart's appVersion"
run = "python scripts/build.py ${@}"

[tasks.test-integration]
description = "Run the upstream guard and the integration suite (k3s in podman)"
run = "python -m pytest tests/e2e/test_upstream.py tests/e2e/test_integration.py -v ${@}"

[tasks.test-sync]
description = "Run the hub-spoke sync suite (2 MISP instances and a MISP 2.5 partner)"
run = "python -m pytest tests/e2e/test_sync.py -v ${@}"

[tasks.test-migration]
description = "Run the migration suite (a MISP 2.5 database on MariaDB into PostgreSQL)"
run = "python -m pytest tests/e2e/test_migration.py -v ${@}"

[tasks.test-lifecycle]
description = "Run the lifecycle suite: upgrade from the newest release, helm test, CronJobs, upgrade and rollback"
run = "python -m pytest tests/e2e/test_lifecycle.py -v ${@}"

[tasks.docs]
description = "Regenerate the generated regions of the docs and AGENTS.md from the code"
run = "python scripts/generate_docs.py"

[tasks.test-all]
description = "Run the unit tests, then every stack suite"
# One after the other: the suites publish the same ports on localhost. The first builds the images
run = ["mise run test", "mise run test-integration", "mise run test-sync --skip-build",
       "mise run test-migration --skip-build", "mise run test-lifecycle --skip-build"]

[tasks.smoketest]
description = "Run smoke test against a live MISP instance"
run = """
#!/usr/bin/env bash
URL="${1:?Usage: mise run smoketest <url>}"
read -rsp "API key: " KEY; echo
python -m pytest tests/e2e/test_smoke.py -v --url "$URL" --key "$KEY"
"""

[tasks.composer-lock]
description = "Resolve MISP's PHP dependencies for the current CORE_TAG into files/composer.lock"
run = "scripts/update-composer-lock.sh"

[tasks.misp-requirements]
description = "Resolve the Python packages of MISP's own scripts for the current CORE_TAG into files/requirements-misp.txt"
run = "python scripts/update_misp_requirements.py"

[tasks.release]
description = "Prepare a release: the next 3.0.0-wip.N while MISP is a work-in-progress pin, else of one kind (hotfix, normal or breaking)"
run = "python scripts/release.py ${@}"
