# Builds the two images from the layer caches the build job filled (seconds)
# and loads them into the job's docker, under the tag the suites run.
name: Load the images
description: The misp and modules images from the build job's layer caches, loaded into docker
inputs:
  misp:
    description: The misp image name
    required: true
  modules:
    description: The modules image name
    required: true
  tag:
    description: The tag to load them under
    default: ci
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build misp image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: final
        load: true
        tags: ${{ inputs.misp }}:${{ inputs.tag }}
        cache-from: type=gha,scope=misp
    - name: Build modules image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        target: modules
        load: true
        tags: ${{ inputs.modules }}:${{ inputs.tag }}
        cache-from: |
          type=gha,scope=misp
          type=gha,scope=modules
