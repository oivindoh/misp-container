version: 2
updates:
  # Keep GitHub Actions pinned SHAs up to date, all in one PR: the workflows and
  # the composite actions they use
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The base images of the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The images of the chart (the postgres and redis components, in values.yaml) and of
  # the stack suites' test services (tests/k3s), one PR per image for both directories.
  # MariaDB stays on its LTS line, 11.8.
  - package-ecosystem: docker
    directories:
      - /deploy/chart
      - /tests/k3s
    schedule:
      interval: weekly
    groups:
      images:
        group-by: dependency-name
    ignore:
      - dependency-name: library/mariadb
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The Python pins: the repository's own (uv.lock) and the images' (files/requirements-*.txt).
  # files/requirements-misp.txt follows MISP's own requirements.txt, so mise run
  # misp-requirements updates it, never a single bump
  - package-ecosystem: uv
    directory: /
    exclude-paths:
      - files/requirements-misp.txt
    schedule:
      interval: weekly
