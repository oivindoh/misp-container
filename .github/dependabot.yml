version: 2
updates:
  # Keep GitHub Actions pinned SHAs up to date, all in one PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The base images of the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The MariaDB, PostgreSQL and Redis images of the Compose stacks, one PR per image for
  # both directories. The chart pins the same images in values.yaml: tests/test_chart.py
  # fails until it follows. MariaDB stays on its LTS line, 11.8.
  - package-ecosystem: docker-compose
    directories:
      - /deploy
      - /tests
    schedule:
      interval: weekly
    groups:
      images:
        group-by: dependency-name
    ignore:
      - dependency-name: library/mariadb
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The Python pins: the repository's own (uv.lock) and the images' (files/requirements-*.txt)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
