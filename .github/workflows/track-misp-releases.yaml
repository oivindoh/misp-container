# Opens a draft pull request for each new MISP release of the major version the
# Dockerfile pins: bumps CORE_TAG, clears a CORE_COMMIT pin, and resolves
# files/composer.lock and files/requirements-misp.txt (DEVELOPING.md, New MISP
# releases). While the pin is a work-in-progress branch such as 3.0_wip, the first
# release of that major version replaces it.
name: Track MISP releases

on:
  schedule:
    # Check daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest MISP release
        id: misp
        run: |
          set -euo pipefail
          CURRENT=$(grep '^ARG CORE_TAG=' Dockerfile | cut -d= -f2)
          # 3.0_wip and v3.0.1 both pin major version 3; MISP keeps releasing older majors
          MAJOR=$(sed -E 's/^v?([0-9]+)[._].*/\1/' <<<"${CURRENT}")
          LATEST=$(gh api --paginate repos/MISP/MISP/releases \
            --jq '.[] | select(.draft or .prerelease | not) | .tag_name' | grep -E "^v${MAJOR}\." | sort -V | tail -1 || true)
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Current: ${CURRENT}, Latest of major ${MAJOR}: ${LATEST:-none}"
          if [ -n "${LATEST}" ] && [ "${LATEST}" != "${CURRENT}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CORE_TAG
        if: steps.misp.outputs.changed == 'true'
        run: |
          NEW="${{ steps.misp.outputs.latest }}"
          BRANCH="misp-update/${NEW}"
          # Skip if a PR already exists for this version
          EXISTING=$(gh pr list --head "${BRANCH}" --state open --json number --jq 'length')
          if [ "${EXISTING}" -gt 0 ]; then
            echo "PR already exists for ${BRANCH}, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s/^ARG CORE_TAG=.*/ARG CORE_TAG=${NEW}/; s/^ARG CORE_COMMIT=.*/ARG CORE_COMMIT=/" Dockerfile
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the new version's dependencies first: the image build installs
      # exactly files/composer.lock and fails while it lags upstream. docker's
      # own builder keeps the composer-lock image in docker for its run.
      - name: Resolve the dependencies
        if: steps.misp.outputs.changed == 'true' && steps.bump.outputs.skip != 'true'
        env:
          CONTAINER_CMD: docker
        run: |
          pip install --quiet pyyaml uv
          scripts/update-composer-lock.sh
          python3 scripts/update_misp_requirements.py

      - name: Commit and open PR
        if: steps.misp.outputs.changed == 'true' && steps.bump.outputs.skip != 'true'
        run: |
          NEW="${{ steps.misp.outputs.latest }}"
          OLD="${{ steps.misp.outputs.current }}"
          BRANCH="misp-update/${NEW}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add Dockerfile files/composer.lock files/requirements-misp.txt
          git commit -m "bump MISP to ${NEW}"
          git push --force-with-lease origin "${BRANCH}"

          BODY="MISP released ${NEW} (was ${OLD}). files/composer.lock and files/requirements-misp.txt were regenerated from ${NEW}: review their diffs."
          BODY="${BODY}

          GitHub starts no CI for a pull request this workflow opens: mark it ready for
          review to run CI. After merging, release from master: a new MISP version is a
          normal release, which sets the image tags, raises the chart's minor version, and
          commits and tags.

              mise run release normal
              git push --atomic origin master ${NEW}"

          gh pr create --draft \
            --title "bump MISP to ${NEW}" \
            --body "${BODY}" \
            --head "${BRANCH}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
