# Opens a pull request for each new MISP release: bumps CORE_TAG, resolves
# files/composer.lock and regenerates the settings catalogue (DEVELOPING.md,
# New MISP releases).
name: Track MISP releases

on:
  schedule:
    # Check daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest MISP release
        id: misp
        run: |
          LATEST=$(gh api repos/MISP/MISP/releases/latest --jq '.tag_name')
          CURRENT=$(grep '^ARG CORE_TAG=' Dockerfile | cut -d= -f2)
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Current: ${CURRENT}, Latest: ${LATEST}"
          if [ "${LATEST}" != "${CURRENT}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CORE_TAG
        if: steps.misp.outputs.changed == 'true'
        run: |
          NEW="${{ steps.misp.outputs.latest }}"
          BRANCH="misp-update/${NEW}"
          # Skip if a PR already exists for this version
          EXISTING=$(gh pr list --head "${BRANCH}" --state open --json number --jq 'length')
          if [ "${EXISTING}" -gt 0 ]; then
            echo "PR already exists for ${BRANCH}, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s/^ARG CORE_TAG=.*/ARG CORE_TAG=${NEW}/" Dockerfile
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build the new version, start it, and regenerate the settings catalogue
      # from what this MISP defines, so the PR carries the settings diff and
      # CI's strict coverage check can pass.
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: steps.misp.outputs.changed == 'true' && steps.bump.outputs.skip != 'true'
      # Warm the layer cache the CI job fills (scope misp): the PECL stage does
      # not change between MISP releases, only the source and later stages rebuild.
      - name: Build misp image (cached)
        if: steps.misp.outputs.changed == 'true' && steps.bump.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: final
          load: true
          # The tag is irrelevant: compose builds its own; this run only fills the local layer cache
          tags: misp-container:cache-warm
          cache-from: type=gha,scope=misp
      - name: Regenerate the settings catalogue
        if: steps.misp.outputs.changed == 'true' && steps.bump.outputs.skip != 'true'
        timeout-minutes: 60
        env:
          COMPOSE_CMD: docker compose
          CONTAINER_CMD: docker
        run: |
          pip install --quiet pyyaml
          scripts/update-composer-lock.sh
          python3 scripts/update_settings.py --stack --write --summary "$RUNNER_TEMP/settings-summary.md"

      - name: Commit and open PR
        if: steps.misp.outputs.changed == 'true' && steps.bump.outputs.skip != 'true'
        run: |
          NEW="${{ steps.misp.outputs.latest }}"
          OLD="${{ steps.misp.outputs.current }}"
          BRANCH="misp-update/${NEW}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add Dockerfile files/composer.lock files/misp-config/settings-upstream.yaml
          git commit -m "bump MISP to ${NEW}"
          git push --force-with-lease origin "${BRANCH}"

          BODY="MISP released ${NEW} (was ${OLD}). files/composer.lock and the settings catalogue were regenerated from ${NEW}: review the diffs of files/composer.lock and files/misp-config/settings-upstream.yaml."
          BODY="${BODY}

          CI builds and tests automatically. After merging, release from master: a new MISP
          version is a normal release, which sets the image tags, raises the chart's minor
          version, and commits and tags.

              mise run release normal
              git push --atomic origin master ${NEW}

          $(cat "$RUNNER_TEMP/settings-summary.md" 2>/dev/null || echo "(no settings summary)")"

          gh pr create \
            --title "bump MISP to ${NEW}" \
            --body "${BODY}" \
            --head "${BRANCH}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
