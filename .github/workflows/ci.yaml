name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Drop all permissions by default. Grant per-job.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build misp image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: final
          load: true
          tags: misp:latest
          cache-from: type=gha,scope=misp
          cache-to: type=gha,mode=max,scope=misp

      - name: Build caddy image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: caddy
          load: true
          tags: misp-caddy:latest
          cache-from: |
            type=gha,scope=misp
            type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

      - name: Build sync image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: sync
          load: true
          tags: misp-sync:latest
          cache-from: type=gha,scope=sync
          cache-to: type=gha,mode=max,scope=sync

      - name: Build metrics image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: metrics
          load: true
          tags: misp-metrics:latest
          cache-from: type=gha,scope=metrics
          cache-to: type=gha,mode=max,scope=metrics

      - name: Build modules image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: modules
          load: true
          tags: misp-modules:latest
          cache-from: type=gha,scope=modules
          cache-to: type=gha,mode=max,scope=modules

      - name: Unit tests
        run: |
          pip install --quiet uv
          uv sync
          PYTHONPATH=files .venv/bin/python -m pytest tests/ -v

      - name: Integration tests
        timeout-minutes: 10
        run: tests/run-integration-tests.sh --skip-build

      - name: Hub-spoke sync tests
        timeout-minutes: 10
        run: tests/run-sync-test.sh --skip-build

  scan:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - target: final
            tag: ghcr.io/oivindoh/misp-container:scan
            scope: misp
          - target: caddy
            tag: ghcr.io/oivindoh/misp-container-caddy:scan
            scope: caddy
          - target: sync
            tag: ghcr.io/oivindoh/misp-container-sync:scan
            scope: sync
          - target: metrics
            tag: ghcr.io/oivindoh/misp-container-metrics:scan
            scope: metrics
          - target: modules
            tag: ghcr.io/oivindoh/misp-container-modules:scan
            scope: modules
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build ${{ matrix.target }} image (from cache)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ matrix.tag }}
          cache-from: |
            type=gha,scope=misp
            type=gha,scope=${{ matrix.scope }}

      - name: Trivy vulnerability scan (${{ matrix.target }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: ${{ matrix.target }}

