# Tests, scans and releases the images and the Helm chart: unit tests, the chart
# renders, the stack suites on k3s and Trivy; on a tag, pushes the images for
# amd64 and arm64 and the chart and creates the release (tests/README.md, CI).
name: CI

on:
  push:
    # Branch pushes: test + scan (no release).
    # Tag pushes: test + scan + release.
    # A release pushes master and its tag together, which starts two runs of one
    # commit: the gate stops the master run, and the tag run tests and releases.
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
    # A draft runs the unit tests only; marking it ready for review runs the rest
    types: [opened, synchronize, reopened, ready_for_review]

# Drop all permissions by default. Grant per-job.
permissions: {}

# A new push to a pull request cancels its running run; a tag or master run is never cancelled
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The images are in docker, which also runs the suites' k3s
  CONTAINER_CMD: docker
  REGISTRY: ghcr.io
  IMAGE_MISP: ghcr.io/${{ github.repository }}
  IMAGE_MODULES: ghcr.io/${{ github.repository }}-modules

jobs:
  # Decides what the run does:
  # - A master push whose commit carries a release tag does nothing: the run of
  #   the tag tests the same commit and releases it. When the lookup fails, both
  #   runs go ahead.
  # - A draft pull request runs the unit tests only, and ci-ok fails, so it
  #   cannot merge before a run of the pull request marked ready passed.
  # - A push to master that merges a pull request skips the unit tests and the
  #   stack suites: the ruleset requires them on the pull request and requires it
  #   to be up to date, so the merge commit has the tree they tested. When the
  #   lookup fails, they run.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      unit: ${{ steps.plan.outputs.unit }}
      stack: ${{ steps.plan.outputs.stack }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Plan the run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          build=true unit=true stack=true publish=
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] &&
             git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" 'v*' 2>/dev/null | grep -q "^$GITHUB_SHA"; then
            echo "A release tag points at $GITHUB_SHA: its tag run tests and releases it."
            build=false unit=false stack=false
          elif [ "$DRAFT" = true ]; then
            echo "A draft runs the unit tests only: mark the pull request ready for review to run the rest."
            build=false stack=false
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/master ]; then
            PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq "[.[] | select(.merge_commit_sha == \"$GITHUB_SHA\")][0].number // empty" 2>/dev/null || true)
            if [ -n "$PR" ]; then
              echo "$GITHUB_SHA merges pull request #$PR, whose run passed the suites on this tree."
              unit=false stack=false
            fi
          fi
          if [ "$build" = true ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            publish=release
          fi
          {
            echo "build=$build"
            echo "unit=$unit"
            echo "stack=$stack"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  # Builds each image into its own layer cache scope, in parallel, and scans it.
  # The suite jobs rebuild from those caches and run against the images they
  # loaded. The misp image's final stage never comes from the cache: its apt layer
  # takes the current Debian packages, security updates included. The suites, the
  # scan and the release then all use those layers.
  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - name: misp
            target: final
            image: ghcr.io/oivindoh/misp-container
            scope: misp
            no-cache-filters: final
          - name: modules
            target: modules
            image: ghcr.io/oivindoh/misp-container-modules
            scope: modules
            no-cache-filters: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ matrix.image }}:ci
          no-cache-filters: ${{ matrix.no-cache-filters }}
          cache-from: |
            type=gha,scope=misp
            type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

      # CRITICAL and HIGH findings with a fix, for the Security tab and for the
      # check below; one scan, so one download of Trivy's database
      - name: Trivy vulnerability scan (${{ matrix.name }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: ${{ matrix.target }}

      # The report above never fails the job; the gates do, so publish, which needs
      # this job, is gated
      - name: Check the ${{ matrix.name }} image
        uses: ./.github/actions/check-image
        with:
          image: ${{ matrix.image }}:ci

  # The arm64 images, beside the suites, which run on amd64 only: a broken arm64
  # build, an extension that fails to load or a modules image that does not start
  # shows here, before a release tags them
  arm64:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and check the arm64 images
        uses: ./.github/actions/arm64-images
        with:
          misp: ${{ env.IMAGE_MISP }}
          modules: ${{ env.IMAGE_MODULES }}

  # The unit tests, the chart renders and the doc tests (mise run test)
  unit:
    needs: gate
    if: needs.gate.outputs.unit == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The versions of mise.toml, checked against mise.lock. The chart and doc tests
      # render the chart with helm; test_chart_schema.py lints it and validates every
      # render with kubeconform
      - name: Install the tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.8.5
          install_args: helm kubeconform python uv
          cache: false
      - name: Unit tests
        run: |
          uv sync --locked
          mise run test

  # The stack suites, one job each, in parallel, each on a k3s cluster in
  # docker, against the images from build. The upload keeps the JUnit report
  # and, after a failure, the cluster's logs. name is the check name; id names
  # the report and the suite's mise task.
  suite:
    name: ${{ matrix.name }}
    needs: [gate, build]
    if: needs.gate.outputs.stack == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: integration
            id: integration
            timeout: 15
          - name: hub-spoke
            id: sync
            timeout: 15
          - name: migration
            id: migration
            timeout: 20
          - name: lifecycle
            id: lifecycle
            timeout: 25
    env:
      MISP_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load the images
        uses: ./.github/actions/load-images
        with:
          misp: ${{ env.IMAGE_MISP }}
          modules: ${{ env.IMAGE_MODULES }}

      # The versions of mise.toml, checked against mise.lock
      - name: Install the tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.8.5
          install_args: helm kubectl python uv
          cache: false

      - name: Run the suite
        timeout-minutes: ${{ matrix.timeout }}
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          uv sync --locked
          mise run "test-${{ matrix.id }}" --skip-build --durations=5 --junitxml="$RUNNER_TEMP/${{ matrix.id }}-junit.xml"

      - name: Upload the test report and the cluster logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.id }}-report
          path: |
            ${{ runner.temp }}/${{ matrix.id }}-junit.xml
            ${{ runner.temp }}/*-cluster-logs.txt
          if-no-files-found: ignore

  # The one required check: it fails on any failed or cancelled job, and on a
  # draft, whose run skips the stack suites. Every other skip is the gate's.
  ci-ok:
    needs: [gate, build, arm64, unit, suite]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the jobs
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$FAILED" = true ]; then
            echo "A job failed or was cancelled."
            exit 1
          elif [ "$DRAFT" = true ]; then
            echo "A draft runs the unit tests only: mark the pull request ready for review."
            exit 1
          fi
          echo "Every job passed, or the gate skipped it."

  # Publishes a tag after every other job: the images under the tag without its
  # v, the chart at the version of Chart.yaml, and a GitHub Release that names
  # the MISP commit. The unit tests and the suites may be skipped only where the
  # gate skipped them. The plan comes first, so a tag that cannot be published
  # fails before any image is pushed.
  publish-plan:
    needs: [gate, build, arm64, unit, suite]
    if: >-
      always() && needs.gate.outputs.publish != '' &&
      needs.build.result == 'success' && needs.arm64.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (needs.gate.outputs.unit != 'true' || needs.unit.result == 'success') &&
      (needs.gate.outputs.stack != 'true' || needs.suite.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      chart: ${{ steps.plan.outputs.chart }}
      misp_version: ${{ steps.plan.outputs.misp_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # helm at the version of mise.toml, checked against mise.lock
      - name: Install the tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.8.5
          install_args: helm
          cache: false

      # appVersion is the image tag; the chart version is its own SemVer and, like
      # an image tag, is never pushed twice. A lookup that fails for another
      # reason than "not there" (a timeout, a rate limit, a token without read
      # scope) must not pass as "not there": helm push overwrites an OCI tag.
      - name: Plan the publication
        id: plan
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAG="${GITHUB_REF#refs/tags/v}"
          APP=$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' deploy/chart/Chart.yaml)
          CHART=$(awk '$1 == "version:" {print $2}' deploy/chart/Chart.yaml)
          if [ "$APP" != "$TAG" ]; then
            echo "ERROR: deploy/chart/Chart.yaml has appVersion ${APP}, the tag is ${TAG}: mise run release sets it."
            exit 1
          fi
          if out=$(helm show chart "oci://ghcr.io/${{ github.repository_owner }}/charts/misp" --version "$CHART" 2>&1); then
            echo "ERROR: chart version ${CHART} exists in GHCR. Chart versions are immutable: mise run release raises it."
            exit 1
          elif ! grep -qiE "not found|manifest unknown|name unknown|denied" <<<"$out"; then
            echo "ERROR: cannot tell whether chart version ${CHART} exists in GHCR:"
            echo "$out"
            exit 1
          fi
          MISP=$(grep '^ARG CORE_TAG=' Dockerfile | cut -d= -f2)
          COMMIT=$(grep '^ARG CORE_COMMIT=' Dockerfile | cut -d= -f2)
          echo "misp_version=${MISP}${COMMIT:+ at ${COMMIT}}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "chart=${CHART}" >> "$GITHUB_OUTPUT"
          echo "Images: ${TAG}; chart ${CHART}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release image tag is never pushed twice: a re-pushed git tag must not
      # overwrite one, and a lookup that fails for another reason than "not
      # there" must not pass either
      - name: Check tag immutability
        run: |
          set -euo pipefail
          TAG="${{ steps.plan.outputs.tag }}"
          for image in "${{ env.IMAGE_MISP }}" "${{ env.IMAGE_MODULES }}"; do
            if out=$(docker manifest inspect "${image}:${TAG}" 2>&1); then
              echo "ERROR: ${image}:${TAG} exists in GHCR. Tags are immutable: mise run release makes the next tag."
              exit 1
            elif ! grep -qiE "not found|manifest unknown|name unknown|no such manifest|denied" <<<"$out"; then
              echo "ERROR: cannot tell whether ${image}:${TAG} exists in GHCR:"
              echo "$out"
              exit 1
            fi
          done

  # The arm64 images of a release: built, loaded and checked as the arm64 job does,
  # then pushed to GHCR by digest from the builder's cache, so a failed check
  # leaves nothing in GHCR. publish tags them with the amd64 images.
  publish-arm64:
    needs: publish-plan
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      misp: ${{ steps.misp.outputs.digest }}
      modules: ${{ steps.modules.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and check the arm64 images
        uses: ./.github/actions/arm64-images
        with:
          misp: ${{ env.IMAGE_MISP }}
          modules: ${{ env.IMAGE_MODULES }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push misp for arm64
        id: misp
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: final
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE_MISP }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.publish-plan.outputs.tag }}
            org.opencontainers.image.licenses=MIT
          provenance: true
          sbom: true
      - name: Push modules for arm64
        id: modules
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: modules
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE_MODULES }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.publish-plan.outputs.tag }}
            org.opencontainers.image.licenses=MIT
          provenance: true
          sbom: true

  # The amd64 images of a release: from the build job's layer cache, loaded and
  # checked again, since a cache miss rebuilds a stage, then pushed by digest and
  # tagged with the arm64 ones. Then the chart, an attestation of each, and the
  # GitHub Release.
  publish:
    needs: [publish-plan, publish-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # helm at the version of mise.toml, checked against mise.lock
      - name: Install the tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.8.5
          install_args: helm
          cache: false

      - name: Build misp for amd64 (from cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: final
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_MISP }}:amd64
          cache-from: type=gha,scope=misp
      - name: Build modules for amd64 (from cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: modules
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_MODULES }}:amd64
          cache-from: |
            type=gha,scope=misp
            type=gha,scope=modules
      - name: Check misp for amd64
        uses: ./.github/actions/check-image
        with:
          image: ${{ env.IMAGE_MISP }}:amd64
      - name: Check modules for amd64
        uses: ./.github/actions/check-image
        with:
          image: ${{ env.IMAGE_MODULES }}:amd64

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push misp for amd64
        id: misp
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: final
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE_MISP }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.publish-plan.outputs.tag }}
            org.opencontainers.image.licenses=MIT
          provenance: true
          sbom: true
          cache-from: type=gha,scope=misp

      - name: Push modules for amd64
        id: modules
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: modules
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE_MODULES }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.publish-plan.outputs.tag }}
            org.opencontainers.image.licenses=MIT
          provenance: true
          sbom: true
          cache-from: |
            type=gha,scope=misp
            type=gha,scope=modules

      # One tag per image over both architectures
      - name: Tag the images for amd64 and arm64
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ needs.publish-plan.outputs.tag }}"
          docker buildx imagetools create -t "${{ env.IMAGE_MISP }}:${TAG}" \
            "${{ env.IMAGE_MISP }}@${{ steps.misp.outputs.digest }}" "${{ env.IMAGE_MISP }}@${{ needs.publish-arm64.outputs.misp }}"
          docker buildx imagetools create -t "${{ env.IMAGE_MODULES }}:${TAG}" \
            "${{ env.IMAGE_MODULES }}@${{ steps.modules.outputs.digest }}" "${{ env.IMAGE_MODULES }}@${{ needs.publish-arm64.outputs.modules }}"
          for name in misp modules; do
            image="${{ env.IMAGE_MISP }}"
            [ "$name" = modules ] && image="${{ env.IMAGE_MODULES }}"
            echo "${name}=$(docker buildx imagetools inspect "${image}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
          done

      - name: Push the chart
        id: chart
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/chart --version "${{ needs.publish-plan.outputs.chart }}" \
            --app-version "${{ needs.publish-plan.outputs.tag }}" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/misp-${{ needs.publish-plan.outputs.chart }}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1 |
            tee "$RUNNER_TEMP/push.txt"
          echo "digest=$(grep -o 'sha256:[0-9a-f]*' "$RUNNER_TEMP/push.txt" | tail -1)" >> "$GITHUB_OUTPUT"

      # GitHub's attestations: gh attestation verify proves that this repository's CI
      # built each image and the chart (docs/kubernetes.md, Install)
      - name: Attest misp
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_MISP }}
          subject-digest: ${{ steps.tag.outputs.misp }}
          push-to-registry: true
      - name: Attest modules
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_MODULES }}
          subject-digest: ${{ steps.tag.outputs.modules }}
          push-to-registry: true
      - name: Attest the chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/misp
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

      # A 3.0.0-wip.N release is a pre-release, so GitHub shows no wip as the latest. The
      # notes list the merged pull requests; the releaser adds a line for each breaking
      # change (DEVELOPING.md, Releases)
      - name: Create GitHub Release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${{ needs.publish-plan.outputs.tag }}"
          PRERELEASE=()
          [[ "$TAG" == *-wip.* ]] && PRERELEASE=(--prerelease)
          gh release create "${TAG}" "${PRERELEASE[@]}" --generate-notes \
            --title "${TAG}" \
            --notes "MISP ${{ needs.publish-plan.outputs.misp_version }}

          Images:
          - \`${{ env.IMAGE_MISP }}:${VER}\`
          - \`${{ env.IMAGE_MODULES }}:${VER}\`

          Helm chart: \`oci://ghcr.io/${{ github.repository_owner }}/charts/misp\`, version \`${{ needs.publish-plan.outputs.chart }}\`

          Upgrade: docs/operations.md (Upgrade a release)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The layer caches of a pull request or a tag serve its run only, and at the
  # repository's 10 GB limit they push master's out. A re-run of a pull request's
  # suite then rebuilds the final stage. GitHub keeps a tag run's caches under
  # refs/heads/refs/tags/<tag>, so both refs go. A dependabot run's token cannot
  # delete; its caches go when the pull request closes (cache-cleanup.yaml).
  caches:
    needs: [gate, build, arm64, unit, suite, publish]
    if: >-
      always() && github.actor != 'dependabot[bot]' &&
      (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the run's caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ref in "$GITHUB_REF" "refs/heads/$GITHUB_REF"; do
            gh cache list --repo "$GITHUB_REPOSITORY" --ref "$ref" --limit 1000 --json id --jq '.[].id' |
              while read -r id; do gh cache delete --repo "$GITHUB_REPOSITORY" "$id"; done
          done
