name: CI

on:
  push:
    # Branch pushes: test + scan (no release).
    # Tag pushes: test + scan + release.
    # Push branch and tag together (git push origin master v2.5.37) triggers
    # two runs, but the branch run is cheap if the tag run also passes.
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

# Drop all permissions by default. Grant per-job.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_MISP: ghcr.io/${{ github.repository }}
  IMAGE_CADDY: ghcr.io/${{ github.repository }}-caddy
  IMAGE_SYNC: ghcr.io/${{ github.repository }}-sync
  IMAGE_METRICS: ghcr.io/${{ github.repository }}-metrics
  IMAGE_MODULES: ghcr.io/${{ github.repository }}-modules

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build misp image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          target: final
          load: true
          tags: misp:latest
          cache-from: type=gha,scope=misp
          cache-to: type=gha,mode=max,scope=misp

      - name: Build caddy image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          target: caddy
          load: true
          tags: misp-caddy:latest
          cache-from: |
            type=gha,scope=misp
            type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

      - name: Build sync image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          target: sync
          load: true
          tags: misp-sync:latest
          cache-from: type=gha,scope=sync
          cache-to: type=gha,mode=max,scope=sync

      - name: Build metrics image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          target: metrics
          load: true
          tags: misp-metrics:latest
          cache-from: type=gha,scope=metrics
          cache-to: type=gha,mode=max,scope=metrics

      - name: Build modules image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          target: modules
          load: true
          tags: misp-modules:latest
          cache-from: type=gha,scope=modules
          cache-to: type=gha,mode=max,scope=modules

      - name: Unit tests
        run: |
          pip install --quiet uv
          uv sync
          PYTHONPATH=files .venv/bin/python -m pytest tests/ -v

      - name: Integration tests
        timeout-minutes: 10
        run: tests/run-integration-tests.sh --skip-build

      - name: Hub-spoke sync tests
        timeout-minutes: 10
        run: tests/run-sync-test.sh --skip-build

  scan:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - target: final
            tag: ghcr.io/oivindoh/misp-container:scan
            scope: misp
          - target: caddy
            tag: ghcr.io/oivindoh/misp-container-caddy:scan
            scope: caddy
          - target: sync
            tag: ghcr.io/oivindoh/misp-container-sync:scan
            scope: sync
          - target: metrics
            tag: ghcr.io/oivindoh/misp-container-metrics:scan
            scope: metrics
          - target: modules
            tag: ghcr.io/oivindoh/misp-container-modules:scan
            scope: modules
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build ${{ matrix.target }} image (from cache)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ matrix.tag }}
          cache-from: |
            type=gha,scope=misp
            type=gha,scope=${{ matrix.scope }}

      - name: Trivy vulnerability scan (${{ matrix.target }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@7c1e4cf0b20d7c1872b26569c00ba908797a59bf # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: ${{ matrix.target }}

  release:
    needs: [test, scan]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Extract version info
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MISP_VERSION=$(grep '^ARG CORE_TAG=' Dockerfile | cut -d= -f2)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "misp_version=${MISP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Git tag: ${TAG}, MISP version: ${MISP_VERSION}"

      - name: Check tag immutability
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if docker manifest inspect "${{ env.IMAGE_MISP }}:${TAG}" >/dev/null 2>&1; then
            echo "ERROR: Image tag ${TAG} already exists in GHCR. Tags are immutable."
            echo "For hotfixes, use ${TAG}-r1, ${TAG}-r2, etc."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tags
        id: tags
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "misp_tags=${{ env.IMAGE_MISP }}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "caddy_tags=${{ env.IMAGE_CADDY }}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "sync_tags=${{ env.IMAGE_SYNC }}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "metrics_tags=${{ env.IMAGE_METRICS }}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "modules_tags=${{ env.IMAGE_MODULES }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push misp (from cache)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          target: final
          push: true
          tags: ${{ steps.tags.outputs.misp_tags }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=misp

      - name: Build and push caddy (from cache)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          target: caddy
          push: true
          tags: ${{ steps.tags.outputs.caddy_tags }}
          provenance: true
          sbom: true
          cache-from: |
            type=gha,scope=misp
            type=gha,scope=caddy

      - name: Build and push sync (from cache)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          target: sync
          push: true
          tags: ${{ steps.tags.outputs.sync_tags }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=sync

      - name: Build and push metrics (from cache)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          target: metrics
          push: true
          tags: ${{ steps.tags.outputs.metrics_tags }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=metrics

      - name: Build and push modules (from cache)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          target: modules
          push: true
          tags: ${{ steps.tags.outputs.modules_tags }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=modules

      - name: Create GitHub Release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          MISP="${{ steps.version.outputs.misp_version }}"
          VER="${{ steps.tags.outputs.version }}"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes "MISP ${MISP}

          Images:
          - \`${{ env.IMAGE_MISP }}:${VER}\`
          - \`${{ env.IMAGE_CADDY }}:${VER}\`
          - \`${{ env.IMAGE_SYNC }}:${VER}\`
          - \`${{ env.IMAGE_METRICS }}:${VER}\`
          - \`${{ env.IMAGE_MODULES }}:${VER}\`"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
