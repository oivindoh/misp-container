# Tests, scans and releases the images and the Helm chart: unit tests, the chart
# renders, the stack suites on k3s and Trivy; on a tag, pushes the images for
# amd64 and arm64 and the chart and creates the release (tests/README.md, CI).
name: CI

on:
  push:
    # Branch pushes: test + scan (no release).
    # Tag pushes: test + scan + release.
    # A release pushes master and its tag together, which starts two runs of one
    # commit: the gate stops the master run, and the tag run tests and releases.
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
    # A draft runs the unit tests only; marking it ready for review runs the rest
    types: [opened, synchronize, reopened, ready_for_review]

# Drop all permissions by default. Grant per-job.
permissions: {}

env:
  # The images are in docker, which also runs the suites' k3s
  CONTAINER_CMD: docker
  REGISTRY: ghcr.io
  IMAGE_MISP: ghcr.io/${{ github.repository }}
  IMAGE_CADDY: ghcr.io/${{ github.repository }}-caddy
  IMAGE_MODULES: ghcr.io/${{ github.repository }}-modules

jobs:
  # Decides what the run does:
  # - A master push whose commit carries a release tag does nothing: the run of
  #   the tag tests the same commit and releases it. When the lookup fails, both
  #   runs go ahead.
  # - A draft pull request runs the unit tests only, and ci-ok fails, so it
  #   cannot merge before a run of the pull request marked ready passed.
  # - A push to master that merges a pull request skips the unit tests and the
  #   stack suites: the ruleset requires them on the pull request and requires it
  #   to be up to date, so the merge commit has the tree they tested. When the
  #   lookup fails, they run.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      unit: ${{ steps.plan.outputs.unit }}
      stack: ${{ steps.plan.outputs.stack }}
      suites: ${{ steps.plan.outputs.suites }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Plan the run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          build=true unit=true stack=true publish=
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] &&
             git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" 'v*' 2>/dev/null | grep -q "^$GITHUB_SHA"; then
            echo "A release tag points at $GITHUB_SHA: its tag run tests and releases it."
            build=false unit=false stack=false
          elif [ "$DRAFT" = true ]; then
            echo "A draft runs the unit tests only: mark the pull request ready for review to run the rest."
            build=false stack=false
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/master ]; then
            PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq "[.[] | select(.merge_commit_sha == \"$GITHUB_SHA\")][0].number // empty" 2>/dev/null || true)
            if [ -n "$PR" ]; then
              echo "$GITHUB_SHA merges pull request #$PR, whose run passed the suites on this tree."
              unit=false stack=false
            fi
          fi
          if [ "$build" = true ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            publish=release
          fi
          # name is the check name; id names the report
          suites='[
            {"name": "integration", "id": "integration", "timeout": 15,
             "tests": "tests/e2e/test_upstream.py tests/e2e/test_integration.py"},
            {"name": "hub-spoke", "id": "sync", "timeout": 15, "tests": "tests/e2e/test_sync.py"},
            {"name": "migration", "id": "migration", "timeout": 20, "tests": "tests/e2e/test_migration.py"},
            {"name": "lifecycle", "id": "lifecycle", "timeout": 25, "tests": "tests/e2e/test_lifecycle.py"}]'
          {
            echo "build=$build"
            echo "unit=$unit"
            echo "stack=$stack"
            echo "publish=$publish"
            echo "suites=$(jq -c . <<<"$suites")"
          } >> "$GITHUB_OUTPUT"

  # Builds each image into its own layer cache scope, in parallel. The suite
  # jobs rebuild from those caches in seconds and run against the images they
  # loaded. The misp image's final stage never comes from the cache: its apt
  # layer takes the current Debian packages, security updates included, which
  # the suites, the scan and the release then all use.
  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: misp
            target: final
            image: ghcr.io/oivindoh/misp-container
            scope: misp
            no-cache-filters: final
          - name: caddy
            target: caddy
            image: ghcr.io/oivindoh/misp-container-caddy
            scope: caddy
          - name: modules
            target: modules
            image: ghcr.io/oivindoh/misp-container-modules
            scope: modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ matrix.image }}:ci
          no-cache-filters: ${{ matrix.no-cache-filters }}
          cache-from: |
            type=gha,scope=misp
            type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  unit:
    needs: gate
    if: needs.gate.outputs.unit == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The chart and doc tests render the chart with helm; test_chart_schema.py
      # lints it and validates every render with kubeconform
      - name: Install helm and kubeconform
        uses: ./.github/actions/install-helm
        with:
          kubeconform: "true"
      - name: Unit tests
        run: |
          pip install --quiet uv
          uv sync
          PYTHONPATH=files .venv/bin/python -m pytest tests/ -v --ignore=tests/e2e

  # The stack suites, one job each, in parallel, each on a k3s cluster in
  # docker, against the images from build. The gate lists them; the upload
  # keeps the JUnit report and, after a failure, the cluster's logs.
  suite:
    name: ${{ matrix.name }}
    needs: [gate, build]
    if: needs.gate.outputs.stack == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.suites) }}
    env:
      MISP_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load the images
        uses: ./.github/actions/load-images
        with:
          misp: ${{ env.IMAGE_MISP }}
          caddy: ${{ env.IMAGE_CADDY }}
          modules: ${{ env.IMAGE_MODULES }}

      - name: Install helm and kubectl
        uses: ./.github/actions/install-helm
        with:
          kubectl: "true"

      - name: Run the suite
        timeout-minutes: ${{ matrix.timeout }}
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          pip install --quiet uv
          uv sync
          .venv/bin/python -m pytest ${{ matrix.tests }} --skip-build -v --durations=5 \
            --junitxml="$RUNNER_TEMP/${{ matrix.id }}-junit.xml"

      - name: Upload the test report and the cluster logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.id }}-report
          path: |
            ${{ runner.temp }}/${{ matrix.id }}-junit.xml
            ${{ runner.temp }}/*-cluster-logs.txt
          if-no-files-found: ignore

  scan:
    needs: [gate, build]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - target: final
            tag: ghcr.io/oivindoh/misp-container:scan
            scope: misp
          - target: caddy
            tag: ghcr.io/oivindoh/misp-container-caddy:scan
            scope: caddy
          - target: modules
            tag: ghcr.io/oivindoh/misp-container-modules:scan
            scope: modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.target }} image (from cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ matrix.tag }}
          cache-from: |
            type=gha,scope=misp
            type=gha,scope=${{ matrix.scope }}

      # CRITICAL and HIGH findings with a fix, for the Security tab and for the
      # check below; one scan, so one download of Trivy's database
      - name: Trivy vulnerability scan (${{ matrix.target }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: ${{ matrix.target }}

      # The report above never fails the job; this check does, on a CRITICAL
      # finding with a fix, so publish, which needs this job, is gated
      - name: Fail on a fixable CRITICAL finding (${{ matrix.target }})
        run: |
          set -euo pipefail
          found=$(jq -r '.runs[0] as $run
            | [$run.tool.driver.rules[] | select(.properties.tags | index("CRITICAL")) | .id] as $critical
            | $run.results[] | select(.ruleId as $id | $critical | index($id))
            | "\(.ruleId): \(.message.text | split("\n")[0])"' trivy-results.sarif)
          if [ -n "$found" ]; then
            echo "CRITICAL findings with a fix:"
            echo "$found"
            exit 1
          fi
          echo "No CRITICAL finding with a fix."

  # The one required check: it fails on any failed or cancelled job, and on a
  # draft, whose run skips the stack suites. Every other skip is the gate's.
  ci-ok:
    needs: [gate, build, unit, suite, scan]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the jobs
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$FAILED" = true ]; then
            echo "A job failed or was cancelled."
            exit 1
          elif [ "$DRAFT" = true ]; then
            echo "A draft runs the unit tests only: mark the pull request ready for review."
            exit 1
          fi
          echo "Every job passed, or the gate skipped it."

  # Publishes a tag after every other job: the images under the tag without its
  # v, the chart at the version of Chart.yaml, and a GitHub Release that names
  # the MISP commit. The unit tests and the suites may be skipped only where the
  # gate skipped them.
  # The arm64 images of a release, on an arm64 runner and without the layer
  # cache: the cache holds 10 GB per repository, and the amd64 layers fill it.
  # They go to GHCR by digest; publish tags them with the amd64 images.
  publish-arm64:
    needs: [gate, build, unit, suite, scan]
    if: >-
      always() && needs.gate.outputs.publish != '' &&
      needs.build.result == 'success' && needs.scan.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (needs.gate.outputs.unit != 'true' || needs.unit.result == 'success') &&
      (needs.gate.outputs.stack != 'true' || needs.suite.result == 'success')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      misp: ${{ steps.misp.outputs.digest }}
      caddy: ${{ steps.caddy.outputs.digest }}
      modules: ${{ steps.modules.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push misp for arm64
        id: misp
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: final
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE_MISP }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
      - name: Build and push caddy for arm64
        id: caddy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: caddy
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE_CADDY }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
      - name: Build and push modules for arm64
        id: modules
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: modules
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE_MODULES }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true

  publish:
    needs: [gate, build, unit, suite, scan, publish-arm64]
    if: >-
      always() && needs.gate.outputs.publish != '' &&
      needs.build.result == 'success' && needs.scan.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (needs.gate.outputs.unit != 'true' || needs.unit.result == 'success') &&
      (needs.gate.outputs.stack != 'true' || needs.suite.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install helm
        uses: ./.github/actions/install-helm

      # appVersion is the image tag; the chart version is its own SemVer and, like
      # an image tag, is never pushed twice. A lookup that fails for another
      # reason than "not there" (a timeout, a rate limit, a token without read
      # scope) must not pass as "not there": helm push overwrites an OCI tag.
      - name: Plan the publication
        id: plan
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAG="${GITHUB_REF#refs/tags/v}"
          APP=$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' deploy/chart/Chart.yaml)
          CHART=$(awk '$1 == "version:" {print $2}' deploy/chart/Chart.yaml)
          if [ "$APP" != "$TAG" ]; then
            echo "ERROR: deploy/chart/Chart.yaml has appVersion ${APP}, the tag is ${TAG}: mise run release sets it."
            exit 1
          fi
          if out=$(helm show chart "oci://ghcr.io/${{ github.repository_owner }}/charts/misp" --version "$CHART" 2>&1); then
            echo "ERROR: chart version ${CHART} exists in GHCR. Chart versions are immutable: mise run release raises it."
            exit 1
          elif ! grep -qiE "not found|manifest unknown|name unknown|denied" <<<"$out"; then
            echo "ERROR: cannot tell whether chart version ${CHART} exists in GHCR:"
            echo "$out"
            exit 1
          fi
          MISP=$(grep '^ARG CORE_TAG=' Dockerfile | cut -d= -f2)
          COMMIT=$(grep '^ARG CORE_COMMIT=' Dockerfile | cut -d= -f2)
          echo "misp_version=${MISP}${COMMIT:+ at ${COMMIT}}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "chart=${CHART}" >> "$GITHUB_OUTPUT"
          echo "Images: ${TAG}; chart ${CHART}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release image tag is never pushed twice: a re-pushed git tag must not
      # overwrite one, and a lookup that fails for another reason than "not
      # there" must not pass either
      - name: Check tag immutability
        run: |
          set -euo pipefail
          TAG="${{ steps.plan.outputs.tag }}"
          for image in "${{ env.IMAGE_MISP }}" "${{ env.IMAGE_CADDY }}" "${{ env.IMAGE_MODULES }}"; do
            if out=$(docker manifest inspect "${image}:${TAG}" 2>&1); then
              echo "ERROR: ${image}:${TAG} exists in GHCR. Tags are immutable: mise run release makes the next tag."
              exit 1
            elif ! grep -qiE "not found|manifest unknown|name unknown|no such manifest|denied" <<<"$out"; then
              echo "ERROR: cannot tell whether ${image}:${TAG} exists in GHCR:"
              echo "$out"
              exit 1
            fi
          done

      - name: Build and push misp for amd64 (from cache)
        id: misp
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: final
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE_MISP }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=misp

      - name: Build and push caddy for amd64 (from cache)
        id: caddy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: caddy
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE_CADDY }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: |
            type=gha,scope=misp
            type=gha,scope=caddy

      - name: Build and push modules for amd64 (from cache)
        id: modules
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: modules
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE_MODULES }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=modules

      # One tag per image over both architectures
      - name: Tag the images for amd64 and arm64
        run: |
          set -euo pipefail
          TAG="${{ steps.plan.outputs.tag }}"
          docker buildx imagetools create -t "${{ env.IMAGE_MISP }}:${TAG}" \
            "${{ env.IMAGE_MISP }}@${{ steps.misp.outputs.digest }}" "${{ env.IMAGE_MISP }}@${{ needs.publish-arm64.outputs.misp }}"
          docker buildx imagetools create -t "${{ env.IMAGE_CADDY }}:${TAG}" \
            "${{ env.IMAGE_CADDY }}@${{ steps.caddy.outputs.digest }}" "${{ env.IMAGE_CADDY }}@${{ needs.publish-arm64.outputs.caddy }}"
          docker buildx imagetools create -t "${{ env.IMAGE_MODULES }}:${TAG}" \
            "${{ env.IMAGE_MODULES }}@${{ steps.modules.outputs.digest }}" "${{ env.IMAGE_MODULES }}@${{ needs.publish-arm64.outputs.modules }}"

      - name: Push the chart
        run: |
          set -euo pipefail
          helm package deploy/chart --version "${{ steps.plan.outputs.chart }}" \
            --app-version "${{ steps.plan.outputs.tag }}" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/misp-${{ steps.plan.outputs.chart }}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Create GitHub Release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${{ steps.plan.outputs.tag }}"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes "MISP ${{ steps.plan.outputs.misp_version }}

          Images:
          - \`${{ env.IMAGE_MISP }}:${VER}\`
          - \`${{ env.IMAGE_CADDY }}:${VER}\`
          - \`${{ env.IMAGE_MODULES }}:${VER}\`

          Helm chart: \`oci://ghcr.io/${{ github.repository_owner }}/charts/misp\`, version \`${{ steps.plan.outputs.chart }}\`"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
