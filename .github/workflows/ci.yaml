# Tests, scans and releases the images and the Helm chart: unit tests, the chart
# renders, the stack suites in Compose, the chart on kind and Trivy; on a tag,
# pushes the images and the chart and creates the release (tests/README.md, CI).
name: CI

on:
  push:
    # Branch pushes: test + scan (no release).
    # Tag pushes: test + scan + release.
    # A release pushes master and its tag together, which starts two runs of one
    # commit: the gate job stops the master run, and the tag run tests and releases.
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

# Drop all permissions by default. Grant per-job.
permissions: {}

env:
  # Images are built with buildx, so the test scripts must use docker compose here
  COMPOSE_CMD: docker compose
  CONTAINER_CMD: docker
  REGISTRY: ghcr.io
  IMAGE_MISP: ghcr.io/${{ github.repository }}
  IMAGE_CADDY: ghcr.io/${{ github.repository }}-caddy
  IMAGE_MODULES: ghcr.io/${{ github.repository }}-modules

jobs:
  # Stops a master run whose commit carries a release tag: the run of the tag
  # tests the same commit and releases it. build and unit wait for it, and every
  # other job waits for them. When the lookup fails, both runs go ahead.
  gate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_commit: ${{ steps.tag.outputs.release_commit }}
    steps:
      - name: Look for a release tag on the commit
        id: tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] &&
             git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" 'v*' 2>/dev/null | grep -q "^$GITHUB_SHA"; then
            echo "release_commit=true" >> "$GITHUB_OUTPUT"
            echo "A release tag points at $GITHUB_SHA: its tag run tests and releases it."
          fi

  # Builds each image into its own layer cache scope, in parallel. The suite
  # jobs rebuild from those caches in seconds and run against the images they
  # loaded.
  build:
    needs: gate
    if: needs.gate.outputs.release_commit != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: misp
            target: final
            image: ghcr.io/oivindoh/misp-container
            scope: misp
          - name: caddy
            target: caddy
            image: ghcr.io/oivindoh/misp-container-caddy
            scope: caddy
          - name: modules
            target: modules
            image: ghcr.io/oivindoh/misp-container-modules
            scope: modules
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: |
            type=gha,scope=misp
            type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  unit:
    needs: gate
    if: needs.gate.outputs.release_commit != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # The chart and doc tests render the chart with helm; test_chart_schema.py
      # lints it and validates every render with kubeconform
      - name: Install helm and kubeconform
        uses: ./.github/actions/install-helm
        with:
          kubeconform: "true"
      - name: Unit tests
        run: |
          pip install --quiet uv
          uv sync
          PYTHONPATH=files .venv/bin/python -m pytest tests/ -v --ignore=tests/e2e

  integration:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISP_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Load the images
        uses: ./.github/actions/load-images
        with:
          misp: ${{ env.IMAGE_MISP }}
          caddy: ${{ env.IMAGE_CADDY }}
          modules: ${{ env.IMAGE_MODULES }}

      - name: Integration tests
        timeout-minutes: 15
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          pip install --quiet uv
          uv sync
          .venv/bin/python -m pytest tests/e2e/test_upstream.py tests/e2e/test_integration.py --skip-build -v --durations=5 \
            --junitxml="$RUNNER_TEMP/integration-junit.xml"

      - name: Upload the test report and the compose logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-report
          path: |
            ${{ runner.temp }}/integration-junit.xml
            ${{ runner.temp }}/*-compose-logs.txt
          if-no-files-found: ignore

  integration-postgres:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISP_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Load the images
        uses: ./.github/actions/load-images
        with:
          misp: ${{ env.IMAGE_MISP }}
          caddy: ${{ env.IMAGE_CADDY }}
          modules: ${{ env.IMAGE_MODULES }}

      - name: Integration tests on PostgreSQL
        timeout-minutes: 15
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          pip install --quiet uv
          uv sync
          .venv/bin/python -m pytest tests/e2e/test_integration.py --skip-build --db-engine postgres -v --durations=5 \
            --junitxml="$RUNNER_TEMP/integration-postgres-junit.xml"

      - name: Upload the test report and the compose logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-postgres-report
          path: |
            ${{ runner.temp }}/integration-postgres-junit.xml
            ${{ runner.temp }}/*-compose-logs.txt
          if-no-files-found: ignore

  hub-spoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISP_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Load the images
        uses: ./.github/actions/load-images
        with:
          misp: ${{ env.IMAGE_MISP }}
          caddy: ${{ env.IMAGE_CADDY }}
          modules: ${{ env.IMAGE_MODULES }}

      - name: Hub-spoke sync tests
        timeout-minutes: 15
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          pip install --quiet uv
          uv sync
          .venv/bin/python -m pytest tests/e2e/test_sync.py --skip-build -v --durations=5 \
            --junitxml="$RUNNER_TEMP/sync-junit.xml"

      - name: Upload the test report and the compose logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-report
          path: |
            ${{ runner.temp }}/sync-junit.xml
            ${{ runner.temp }}/*-compose-logs.txt
          if-no-files-found: ignore

  migration:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISP_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Load the images
        uses: ./.github/actions/load-images
        with:
          misp: ${{ env.IMAGE_MISP }}
          caddy: ${{ env.IMAGE_CADDY }}
          modules: ${{ env.IMAGE_MODULES }}

      - name: Migration tests
        timeout-minutes: 20
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          pip install --quiet uv
          uv sync
          .venv/bin/python -m pytest tests/e2e/test_migration.py --skip-build -v --durations=5 \
            --junitxml="$RUNNER_TEMP/migration-junit.xml"

      - name: Upload the test report and the compose logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-report
          path: |
            ${{ runner.temp }}/migration-junit.xml
            ${{ runner.temp }}/*-compose-logs.txt
          if-no-files-found: ignore

  # Installs the Helm chart with the mariadb and redis components on a kind
  # cluster, runs the smoke test, upgrades the release and runs it again
  kind:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        database: [mariadb, postgres]
    env:
      MISP_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Load the images
        uses: ./.github/actions/load-images
        with:
          misp: ${{ env.IMAGE_MISP }}
          caddy: ${{ env.IMAGE_CADDY }}
          modules: ${{ env.IMAGE_MODULES }}

      - name: Install kind and helm
        uses: ./.github/actions/install-helm
        with:
          kind: "true"

      - name: Python for the smoke test
        run: |
          pip install --quiet uv
          uv sync

      - name: Kubernetes test on kind (${{ matrix.database }})
        timeout-minutes: 25
        run: tests/run-kind-test.sh ${{ matrix.database == 'postgres' && '--postgres' || '' }}

  scan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        include:
          - target: final
            tag: ghcr.io/oivindoh/misp-container:scan
            scope: misp
          - target: caddy
            tag: ghcr.io/oivindoh/misp-container-caddy:scan
            scope: caddy
          - target: modules
            tag: ghcr.io/oivindoh/misp-container-modules:scan
            scope: modules
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build ${{ matrix.target }} image (from cache)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ matrix.tag }}
          cache-from: |
            type=gha,scope=misp
            type=gha,scope=${{ matrix.scope }}

      - name: Trivy vulnerability scan (${{ matrix.target }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: ${{ matrix.target }}

      # The report above never fails the job; this run does, on a CRITICAL
      # finding with a fix, so the release job that needs this one is gated
      - name: Fail on a fixable CRITICAL finding (${{ matrix.target }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  release:
    needs: [unit, integration, integration-postgres, hub-spoke, migration, kind, scan]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Extract version info
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MISP_VERSION=$(grep '^ARG CORE_TAG=' Dockerfile | cut -d= -f2)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "misp_version=${MISP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Git tag: ${TAG}, MISP version: ${MISP_VERSION}"

      - name: Install helm
        uses: ./.github/actions/install-helm

      # appVersion is the image tag; the chart version is its own SemVer and, like an
      # image tag, is never pushed twice
      - name: Check the chart version
        id: chart
        run: |
          set -euo pipefail
          VER="${GITHUB_REF#refs/tags/v}"
          APP=$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' deploy/chart/Chart.yaml)
          CHART=$(awk '$1 == "version:" {print $2}' deploy/chart/Chart.yaml)
          if [ "$APP" != "$VER" ]; then
            echo "ERROR: deploy/chart/Chart.yaml has appVersion ${APP}, the tag is ${VER}: mise run release sets it."
            exit 1
          fi
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          # A lookup that fails for another reason than "not there" (a timeout, a
          # rate limit, a token without read scope) must not pass as "not there":
          # helm push overwrites an OCI tag
          if out=$(helm show chart "oci://ghcr.io/${{ github.repository_owner }}/charts/misp" --version "$CHART" 2>&1); then
            echo "ERROR: chart version ${CHART} exists in GHCR. Chart versions are immutable: mise run release raises it."
            exit 1
          elif ! grep -qiE "not found|manifest unknown|name unknown|denied" <<<"$out"; then
            echo "ERROR: cannot tell whether chart version ${CHART} exists in GHCR:"
            echo "$out"
            exit 1
          fi
          echo "version=${CHART}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The images carry the tag without its v; a re-pushed git tag must not
      # overwrite them, and a lookup that fails for another reason than "not
      # there" must not pass either
      - name: Check tag immutability
        run: |
          set -euo pipefail
          VER="${GITHUB_REF#refs/tags/v}"
          for image in "${{ env.IMAGE_MISP }}" "${{ env.IMAGE_CADDY }}" "${{ env.IMAGE_MODULES }}"; do
            if out=$(docker manifest inspect "${image}:${VER}" 2>&1); then
              echo "ERROR: ${image}:${VER} exists in GHCR. Tags are immutable: mise run release hotfix makes ${VER}-r1."
              exit 1
            elif ! grep -qiE "not found|manifest unknown|name unknown|no such manifest|denied" <<<"$out"; then
              echo "ERROR: cannot tell whether ${image}:${VER} exists in GHCR:"
              echo "$out"
              exit 1
            fi
          done

      - name: Docker tags
        id: tags
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "misp_tags=${{ env.IMAGE_MISP }}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "caddy_tags=${{ env.IMAGE_CADDY }}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "modules_tags=${{ env.IMAGE_MODULES }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push misp (from cache)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: final
          push: true
          tags: ${{ steps.tags.outputs.misp_tags }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=misp

      - name: Build and push caddy (from cache)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: caddy
          push: true
          tags: ${{ steps.tags.outputs.caddy_tags }}
          provenance: true
          sbom: true
          cache-from: |
            type=gha,scope=misp
            type=gha,scope=caddy

      - name: Build and push modules (from cache)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: modules
          push: true
          tags: ${{ steps.tags.outputs.modules_tags }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=modules

      - name: Push the chart
        run: |
          set -euo pipefail
          helm package deploy/chart --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/misp-${{ steps.chart.outputs.version }}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Create GitHub Release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          MISP="${{ steps.version.outputs.misp_version }}"
          VER="${{ steps.tags.outputs.version }}"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes "MISP ${MISP}

          Images:
          - \`${{ env.IMAGE_MISP }}:${VER}\`
          - \`${{ env.IMAGE_CADDY }}:${VER}\`
          - \`${{ env.IMAGE_MODULES }}:${VER}\`

          Helm chart: \`oci://ghcr.io/${{ github.repository_owner }}/charts/misp\`, version \`${{ steps.chart.outputs.version }}\`"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
