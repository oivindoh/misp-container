# Deletes a pull request's Actions caches when it closes: nothing reads them again,
# and at the repository's 10 GB limit GitHub evicts the least recently used entries,
# master's layers among them.
name: Cache cleanup

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the pull request's caches
        env:
          GH_TOKEN: ${{ github.token }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$REF" --limit 1000 --json id --jq '.[].id' |
            while read -r id; do gh cache delete --repo "$GITHUB_REPOSITORY" "$id"; done
