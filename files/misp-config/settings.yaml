# MISP container settings configuration.
#
# Format:
#   settings:
#     <group>:
#       <MISP.setting.name>:
#         value: <default value>
#         force: true          # optional: pass -f to cake
#         blank_protection: true  # optional: skip if env var is empty
#         since: v2.5.40       # optional: re-apply on image upgrade past this version
#
# Env var override convention:
#   Any setting can be overridden by an env var derived from the setting name:
#     MISP.redis_host   -> MISP_REDIS_HOST
#     Plugin.S3_bucket_name -> PLUGIN_S3_BUCKET_NAME
#   If the env var exists and is non-empty, the setting is enforced every startup.
#   If no env var, the default is applied once (then user owns it via the UI).
#
# Groups are applied in order:
#   minimum_config -> db_enable -> initialisation -> critical -> optional -> gpg -> s3 -> proxy -> kafka -> linotp

