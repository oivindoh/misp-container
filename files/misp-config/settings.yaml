      value: "http://127.0.0.1:27051"

    # Module timeouts
    Plugin.Action_timeout:
      description: "Set a timeout for the action services"
      value: 10
    Plugin.Import_timeout:
      description: "Set a timeout for the import services"
      value: 10
    Plugin.Export_timeout:
      description: "Set a timeout for the export services"
      value: 10

    # Sightings
    Plugin.Sightings_policy:
      description: "This setting defines who will have access to seeing the reported sightings. The default setting is the event owner or..."
      value: 2
    Plugin.Sightings_range:
      description: "Set the range in which sightings will be taken into account when generating graphs. For example a sighting with a sig..."
      value: 365
    Plugin.Sightings_anonymise_as:
      description: "When pushing sightings to another server, report all sightings from this instance as this organisation. This effectiv..."
      value: 0

    # Benchmarking
    Plugin.Benchmarking_slow_log_threshold:
      description: "The duration of a query to be considered a slow query. Default: 5000 (=5s)"
      value: 5000
    Plugin.Benchmarking_slow_query_retention:
      description: "The retention of slow query log entries in seconds. Default: 259200 (=3 days)"
      value: 259200

    # External lookups
    Plugin.CyCat_url:
      description: "URL to use for CyCat lookups, if enabled"
