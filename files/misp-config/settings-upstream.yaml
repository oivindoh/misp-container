# Generated by scripts/update-settings.sh from a live MISP: every setting MISP
# defines that settings.yaml does not name, with MISP's own default, description,
# type and level (0 critical, 1 recommended, 2 optional). file_only marks
# settings MISP reads from config.php only. Entries are track_only: the image never applies
# these values; they document the setting and enable its env override
# (MISP.foo -> MISP_FOO). To give a setting a default of this image, move it
# into settings.yaml.
settings:
  GnuPG.bodyonlyencrypted:
    value: ''
    description: Allow (false) the body of unencrypted e-mails to contain details about the event.
    type: boolean
    level: 2
    track_only: true
  GnuPG.key_fetching_disabled:
    value: false
    description: When disabled, user could not fetch his PGP key from CIRCL key server. Key fetching requires internet connection.
    type: boolean
    level: 2
    track_only: true
  GnuPG.obscure_subject:
    value: false
    description: When enabled, the subject in signed and encrypted e-mails will not be sent in unencrypted form.
    type: boolean
    level: 2
    track_only: true
  GnuPG.restrict_server_signing_to_host_org:
    value: false
    description: Restrict server signing via /encryptionKeys/serverSign to host org only users, even for users that otherwise meet role requirements. This setting defaults to false. Site admins are exempt from this requirement, even when the setting is enabled.
    type: boolean
    level: 1
    track_only: true
  LinOTPAuth.mixedauth:
    value: false
    description: Set to true to enforce OTP usage
    type: boolean
    level: 2
    track_only: true
  MISP.allow_disabling_correlation:
    value: false
    description: '*WARNING* This setting will give event creators the possibility to disable the correlation of individual events / attributes that they have created.'
    type: boolean
    level: 0
    track_only: true
  MISP.allow_users_override_locked_field_when_importing_events:
    value: false
    description: Allows users to override the state of the `locked` field of an event uploaded via the "Import from MISP Export File" functionality. This allows unlocking manually imported event. Updates to these Events coming from synchronisation might be rejected since it will appear as these Events were originally created on this instance.
    type: boolean
    level: 2
    track_only: true
  MISP.attachment_scan_hash_only:
    value: false
    description: Send to attachment scan module just file hash. This can be useful if module sends attachment to remote service and you don't want to leak real data.
    type: boolean
    level: 2
    track_only: true
  MISP.attachment_scan_module:
    value: ''
    description: Name of enrichment module that will be used for attachment malware scanning. This module must return av-signature or sb-signature object.
    type: string
    level: 2
    track_only: true
  MISP.attachments_bucketed:
    value: false
    description: By default, MISP stores attachments in a flat structure. Enabling this setting will store attachments in a bucketed structure based on event IDs. This can help improve performance on filesystems that struggle with large numbers of subdirectories in a single directory.
    type: boolean
    level: 2
    track_only: true
  MISP.attribute_filters_block_only:
    value: false
    description: This is a performance tweak to change the behaviour of restSearch to use attribute filters solely for blocking. This means that a lookup on the event scope with for example the type field set will be ignored unless it's used to strip unwanted attributes from the results. If left disabled, passing [ip-src, ip-dst] for example will return any event with at least one ip-src or ip-dst attribute. This is generally not considered to be too useful and is a heavy burden on the database.
    type: boolean
    level: 1
    track_only: true
  MISP.block_event_alert:
    value: false
    description: Enable this setting to start blocking alert e-mails for events with a certain tag. Define the tag in MISP.block_event_alert_tag.
    type: boolean
    level: 1
    track_only: true
  MISP.block_old_event_alert:
    value: false
    description: Enable this setting to start blocking alert e-mails for old events. The exact timing of what constitutes an old event is defined by MISP.block_old_event_alert_age.
    type: boolean
    level: 1
    track_only: true
  MISP.block_old_event_alert_age:
    value: false
    description: 'If the MISP.block_old_event_alert setting is set, this setting will control how old an event can be for it to be alerted on. The "timestamp" field of the event is used. Expected format: integer, in days'
    type: numeric
    level: 1
    track_only: true
  MISP.block_old_event_alert_by_date:
    value: false
    description: 'If the MISP.block_old_event_alert setting is set, this setting will control the threshold for the event.date field, indicating how old an event can be for it to be alerted on. The "date" field of the event is used. Expected format: integer, in days'
    type: numeric
    level: 1
    track_only: true
  MISP.block_publishing_for_same_creator:
    value: false
    description: Enabling this setting will make MISP block event publishing in the case of the publisher being the same user as the event creator.
    type: boolean
    level: 2
    track_only: true
  MISP.collapse_attribute_in_object:
    value: false
    description: When enabled, all Attributes contained inside an object will be automatically collapsed when viewing an Event.
    type: boolean
    level: 1
    track_only: true
  MISP.completely_disable_correlation:
    value: false
    description: '*WARNING* This setting will completely disable the correlation on this instance and remove any existing saved correlations. Enabling this will trigger a full recorrelation of all data which is an extremely long and costly procedure. Only enable this if you know what you''re doing.'
    type: boolean
    level: 0
    track_only: true
  MISP.correlation_engine:
    value: default
    description: Choose which correlation engine to use. MISP defaults to the default engine, maintaining all data in the database whilst enforcing ACL rules on any non site-admin user. This is recommended for any MISP instance with multiple organisations. If you are an endpoint MISP, consider switching to the much leaner and faster No ACL engine.
    type: string
    level: 0
    track_only: true
  MISP.custom_css:
    value: ''
    description: If you would like to customise the CSS, simply drop a css file in the /var/www/MISP/app/webroot/css directory and enter the name here.
    type: string
    level: 2
    track_only: true
  MISP.deadlock_avoidance:
    value: false
    description: Only enable this if you have some tools using MISP with extreme high concurrency. General performance will be lower as normal as certain transactional queries are avoided in favour of shorter table locks.
    type: boolean
    level: 1
    track_only: true
  MISP.default_restsearch_limit:
    value: 0
    description: Default number of attributes returned for the given restSearch API. For the Event and Object scopes, a divisor is used to further limit the given value (dividing by 10 and 3 respectively). Can be overriden via the role configurations. Leave empty(0) to set it as unlimited.
    type: numeric
    level: 1
    track_only: true
  MISP.default_theme:
    value: false
    description: Set a default theme for the instance. This is mostly used for developer purposes for now, but will be more interesting in the future.
    type: string
    level: 2
    track_only: true
  MISP.disableUserSelfManagement:
    value: false
    description: When enabled only Org and Site admins can edit a user's profile.
    type: boolean
    level: 1
    track_only: true
  MISP.disable_auto_logout:
    value: false
    description: In some cases, a heavily used MISP instance can generate unwanted blackhole errors due to a high number of requests hitting the server. Disable the auto logout functionality to ease the burden on the system.
    type: boolean
    level: 1
    track_only: true
  MISP.disable_baseurl_coercion:
    value: false
    description: Disable the automatic coercion of the baseurl for the framework. This is generally recommended against as it solves some potential redirect issues, but has been reported to help when running MISP in a subdirectory.
    type: boolean
    level: 2
    track_only: true
  MISP.disable_event_locks:
    value: false
    description: Disable the event locks that are executed periodically when a user browses an event view. It can be useful to leave event locks enabled to warn users that someone else is editing the same event, but generally it's extremely verbose and can cause issues in certain setups, so it's recommended to disable this.
    type: boolean
    level: 1
    track_only: true
  MISP.disable_seen_ips_authkeys:
    value: false
    description: Disable the storing of IP addresses used to make API calls with an AuthKey against this AuthKey in the database.
    type: boolean
    level: 1
    track_only: true
  MISP.disable_sighting_loading:
    value: false
    description: If an instance has an extremely high number of sightings, including the sightings in the search algorithms can bring an instance to a grinding halt. Enable this setting to temporarily disable the search until the issue is remedied. This setting will also disable sightings from being attached via /events/view API calls.
    type: boolean
    level: 1
    track_only: true
  MISP.disable_taxonomy_consistency_checks:
    value: false
    description: '*WARNING* This will disable taxonomy tags conflict checks when browsing attributes and objects, does not impact checks when adding tags. It can dramatically increase the performance when loading events with lots of tagged attributes or objects.'
    type: boolean
    level: 0
    track_only: true
  MISP.disable_threat_level:
    value: false
    description: Disable displaying / modifications to the threat level altogether on the instance (deprecated field).
    type: boolean
    level: 1
    track_only: true
  MISP.disable_user_add:
    value: false
    description: When enabled, Org Admins could not add new users. This should be enabled if you manage users by external system.
    type: boolean
    level: 1
    track_only: true
  MISP.disable_user_password_change:
    value: false
    description: When enabled only Site admins can change user password. This should be enabled if you manage user passwords by external system.
    type: boolean
    level: 1
    file_only: true
    sensitive: true
    track_only: true
  MISP.discussion_disable:
    value: false
    description: Completely disable ability for user to add discussion to events.
    type: boolean
    level: 1
    track_only: true
  MISP.email_from_name:
    value: ''
    description: Notification e-mail sender name.
    type: string
    level: 2
    track_only: true
  MISP.email_reply_to:
    value: ''
    description: Reply to e-mail address for e-mails send from MISP instance.
    type: string
    level: 2
    track_only: true
  MISP.enableEventReportImageParsingRule:
    value: false
    description: When enabled, Image parsing rule will be enabled and picture will be displayed in the rendered markdown. Even though the Content Security Policy directive might block pictures from outside, be carefull with that setting.
    type: boolean
    level: 1
    track_only: true
  MISP.enable_advanced_correlations:
    value: false
    description: Enable some performance heavy correlations (currently CIDR correlation)
    type: boolean
    level: 0
    track_only: true
  MISP.enable_automatic_garbage_collection:
    value: false
    description: Enable to execute an automatic garbage collection of temporary data such as export files. When enabled, on average every 100th query will check whether to garbage collect. Garbage collection can run at maximum once an hour.
    type: boolean
    level: 1
    track_only: true
  MISP.enable_clusters_mirroring_from_attributes_to_event:
    value: false
    description: Add a checkbox when attaching a cluster to an Attribute which, when checked, will also create the same clusters on the attribute's event.
    type: boolean
    level: 2
    track_only: true
  MISP.enable_synchronisation_filtering_on_type:
    value: false
    description: 'Allows server synchronisation connections to be filtered on Attribute type or Object name. Warning: This feature can potentially cause your synchronisation partners to receive incomplete versions of the events you are propagating on behalf of others. This means that even if they would be receiving the unfiltered version through another instance, your filtered version might be the one they receive on a first-come-first-serve basis.'
    type: boolean
    level: 2
    track_only: true
  MISP.event_alert_metadata_only:
    value: false
    description: Send just event metadata (attributes and objects will be omitted) for event alert.
    type: boolean
    level: 2
    track_only: true
  MISP.event_index_pull_chunk_size:
    value: 10000
    description: When pulling from a remote server, the list of remote events is fetched and filtered down to the actual pull targets in pages of this many events rather than all at once. This bounds the memory used during the negotiation phase of a pull. Lower it to reduce memory usage on low-spec instances. Raising it reduces the number of requests, but increases the peak memory burden on BOTH this instance and the remote server being pulled from (which has to build a larger page in one shot) - be considerate when pulling from a shared or central hub instance and avoid setting this higher than needed. Defaults to 10000.
    type: numeric
    level: 1
    track_only: true
  MISP.extended_alert_subject:
    value: false
    description: Enabling this flag will allow the event description to be transmitted in the alert e-mail's subject. Be aware that this is not encrypted by GnuPG, so only enable it if you accept that part of the event description will be sent out in clear-text.
    type: boolean
    level: 1
    track_only: true
  MISP.fetchAttributeLegacyStrategy:
    value: false
    description: Enabling this setting flip the attribute fetcher into using single joined queries rather than subqueries. This should be a performance downgrade for most, but could improve performance on older mysql versions.
    type: boolean
    level: 2
    track_only: true
  MISP.footer_logo:
    value: ''
    description: If set, this setting allows you to display a logo on the right side of the footer. Upload it as a custom image in the file management tool.
    type: string
    level: 2
    track_only: true
  MISP.footermidleft:
    value: ''
    description: Footer text prepending the "Powered by MISP" text.
    type: string
    level: 2
    track_only: true
  MISP.footermidright:
    value: ''
    description: Footer text following the "Powered by MISP" text.
    type: string
    level: 2
    track_only: true
  MISP.forceHTTPSforPreLoginRequestedURL:
    value: false
    description: If enabled, any requested URL before login will have their HTTP part replaced by HTTPS. This can be useful if MISP is running behind a reverse proxy responsible for SSL and communicating unencrypted with MISP.
    type: boolean
    level: 2
    track_only: true
  MISP.forgotPasswordText:
    value: 'Dear MISP user,\n\nyou have requested a password reset on the MISP instance at $misp. Click the link below to change your password.\n\n\$reset_link\n\nThe link above is only valid for 10 minutes, feel free to request a new one if it has expired.\n\nIf you haven''t requested a password reset, reach out to your admin team and let them know that someone has attempted it in your stead.\n\nMake sure you keep the contents of this e-mail confidential, do NOT ever forward it as it contains a reset token that is equivalent of a password if acted upon. The IP used to trigger the request was: $ip\n\nBest regards,\nYour MISP admin team'
    description: 'The message sent to the users when when they trigger a password reset. The following variables can be used in the message: $misp (misp baseurl), $ip (requestor IP), $reset_link (the link including the reset token for the user to carry out the reset).'
    type: string
    level: 1
    sensitive: true
    track_only: true
  MISP.forgotPasswordTextNoEnc:
    value: 'Dear MISP user,\n\nyou have requested a password reset on the MISP instance at $misp, however, no valid encryption key was found for your user and thus we cannot deliver your reset token. Please get in touch with your org admin / with an instance site admin to ask for a reset.\n\nThe IP used to trigger the request was: $ip\n\nBest regards,\nYour MISP admin team'
    description: 'The message sent to the users when when they trigger a password reset and no suitable encryption key is found for the user. The following variables can be used in the message: $misp (misp baseurl), $ip (requestor IP). By default no reset_link is sent when the message cannot be encrypted, but you can override this behaviour by also adding the following variable to the message: $reset_link (the link including the reset token for the user to carry out the reset).'
    type: string
    level: 1
    sensitive: true
    track_only: true
  MISP.home_logo:
    value: ''
    description: If set, this setting allows you to display a logo as the home icon. Upload it as a custom image in the file management tool.
    type: string
    level: 2
    track_only: true
  MISP.log_errors_ndjson:
    value: false
    description: Log errors in ndjson format additionally to error.log.)
    type: boolean
    level: 1
    track_only: true
  MISP.log_new_audit_compress:
    value: false
    description: Compress log changes by brotli algorithm. This will reduce log database size.
    type: boolean
    level: 2
    track_only: true
  MISP.log_paranoid:
    value: false
    description: If this functionality is enabled all page requests will be logged. Keep in mind this is extremely verbose and will become a burden to your database.
    type: boolean
    level: 0
    track_only: true
  MISP.log_paranoid_api:
    value: false
    description: If this functionality is enabled all API requests will be logged.
    type: boolean
    level: 0
    track_only: true
  MISP.log_paranoid_include_post_body:
    value: false
    description: If paranoid logging is enabled, include the POST body in the entries.
    type: boolean
    level: 0
    track_only: true
  MISP.log_paranoid_include_sql_queries:
    value: false
    description: If paranoid logging is enabled, include the SQL queries in the entries.
    type: boolean
    level: 0
    track_only: true
  MISP.log_paranoid_skip_db:
    value: false
    description: You can decide to skip the logging of the paranoid logs to the database. Logs will be just published to ZMQ or Kafka.
    type: boolean
    level: 0
    track_only: true
  MISP.log_skip_access_logs_in_application_logs:
    value: false
    description: Skip adding the access log entries to the /logs/ application logs. This is **HIGHLY** recommended as your instance will be logging these entries twice otherwise, however, for compatibility reasons for auditing we maintain this behaviour until confirmed otherwise.
    type: boolean
    level: 0
    track_only: true
  MISP.log_skip_db_logs_completely:
    value: false
    description: This functionality allows you to completely disable any logs from being saved in your SQL backend. This is HIGHLY advised against, you lose all the functionalities provided by the audit log subsystem along with the event history (as these are built based on the logs on the fly). Only enable this if you understand and accept the associated risks.
    type: boolean
    level: 0
    track_only: true
  MISP.main_logo:
    value: ''
    description: If set, the image specified here will replace the main MISP logo on the login screen. Upload it as a custom image in the file management tool.
    type: string
    level: 2
    track_only: true
  MISP.maintenance_message:
    value: Great things are happening! MISP is undergoing maintenance, but will return shortly. You can contact the administration at $email.
    description: The message that users will see if the instance is not live.
    type: string
    level: 2
    track_only: true
  MISP.newUserText:
    value: 'Dear new MISP user,\n\nWe would hereby like to welcome you to the $org MISP community.\n\n Use the credentials below to log into MISP at $misp, where you will be prompted to manually change your password to something of your own choice.\n\nUsername: $username\nPassword: $password\n\nIf you have any questions, don''t hesitate to contact us at: $contact.\n\nBest regards,\nYour $org MISP support team'
    description: 'The message sent to the user after account creation (has to be sent manually from the administration interface). Use \n for line-breaks. The following variables will be automatically replaced in the text: $password = a new temporary password that MISP generates, $username = the user''s e-mail address, $misp = the url of this instance, $org = the organisation that the instance belongs to, as set in MISP.org, $contact = the e-mail address used to contact the support team, as set in MISP.contact. For example, "the password for $username is $password" would appear to a user with the e-mail address user@misp.org as "the password for user@misp.org is hNamJae81".'
    type: string
    level: 1
    track_only: true
  MISP.object_fetch_hard_limit:
    value: 0
    description: This value controls the maximum number of objects that can be fetched in one shot via /objects/restSearch. If a query would exceed the given limit, it will iterate internally to build the result-set, so it will only effect the internals, however, it can resolve object restSearch failures due to high memory allocation to php.ini. Setting this to 0 will disable the cap altogether and revert to the old behaviour. Defaults to 0 (disabled).
    type: numeric
    level: 1
    track_only: true
  MISP.org:
    value: ''
    description: The organisation tag of the hosting organisation. This is used in the e-mail subjects.
    type: string
    level: 1
    track_only: true
  MISP.org_alert_threshold:
    value: 0
    description: Set a value to limit the number of email alerts that events can generate per creator organisation (for example, if an organisation pushes out 2000 events in one shot, only alert on the first 20).
    type: numeric
    level: 1
    track_only: true
  MISP.passwordResetText:
    value: 'Dear MISP user,\n\nA password reset has been triggered for your account. Use the below provided temporary password to log into MISP at $misp, where you will be prompted to manually change your password to something of your own choice.\n\nUsername: $username\nYour temporary password: $password\n\nIf you have any questions, don''t hesitate to contact us at: $contact.\n\nBest regards,\nYour $org MISP support team'
    description: 'The message sent to the users when a password reset is triggered. Use \n for line-breaks. The following variables will be automatically replaced in the text: $password = a new temporary password that MISP generates, $username = the user''s e-mail address, $misp = the url of this instance, $contact = the e-mail address used to contact the support team, as set in MISP.contact. For example, "the password for $username is $password" would appear to a user with the e-mail address user@misp.org as "the password for user@misp.org is hNamJae81".'
    type: string
    level: 1
    file_only: true
    sensitive: true
    track_only: true
  MISP.publish_alerts_summary_only:
    value: false
    description: This setting is deprecated. Please use `MISP.event_alert_metadata_only` instead.
    type: boolean
    level: 1
    track_only: true
  MISP.showDiscussionsCountOnIndex:
    value: false
    description: When enabled, the aggregate number of discussion posts for the event becomes visible to the currently logged in user on the event index UI.
    type: boolean
    level: 1
    track_only: true
  MISP.showEventReportCountOnIndex:
    value: false
    description: When enabled, the aggregate number of event reports for the event becomes visible to the currently logged in user on the event index UI.
    type: boolean
    level: 1
    track_only: true
  MISP.showProposalsCountOnIndex:
    value: false
    description: When enabled, the number of proposals for the events are shown on the index.
    type: boolean
    level: 1
    track_only: true
  MISP.showSightingsCountOnIndex:
    value: false
    description: When enabled, the aggregate number of attribute sightings within the event becomes visible to the currently logged in user on the event index UI.
    type: boolean
    level: 1
    track_only: true
  MISP.show_server_correlations_for_all_users:
    value: false
    description: This setting will reveal correlations from other remote servers visible to all users.
    type: boolean
    level: 1
    track_only: true
  MISP.terms_file:
    value: ''
    description: The filename of the terms and conditions file. Make sure that the file is located in your MISP/app/files/terms directory
    type: string
    level: 2
    track_only: true
  MISP.thumbnail_in_redis:
    value: false
    description: Store image thumbnails in Redis instead of file system.
    type: boolean
    level: 2
    track_only: true
  MISP.use_uuids_in_urls:
    value: false
    description: Changes the urls on the event index to /UUID instead of /ID.
    type: boolean
    level: 1
    track_only: true
  MISP.warning_for_all:
    value: false
    description: Enable warning list triggers regardless of the IDS flag value.
    type: boolean
    level: 1
    track_only: true
  MISP.welcome_logo:
    value: ''
    description: Used on the login page, to the left of the MISP logo, upload it as a custom image in the file management tool.
    type: string
    level: 2
    track_only: true
  MISP.welcome_logo2:
    value: ''
    description: Used on the login page, to the right of the MISP logo, upload it as a custom image in the file management tool.
    type: string
    level: 2
    track_only: true
  Plugin.AI_api_key:
    value: ''
    description: API key for the LLM endpoint, if it requires one. Passed to the module with every request and never shown once set.
    type: string
    level: 2
    file_only: true
    sensitive: true
    track_only: true
  Plugin.AI_min_confidence:
    value: 0.9
    description: Indicators the AI module extracts from event reports with a confidence below this value (0 to 1) are dropped. Fewer, certain indicators beat many doubtful ones.
    type: float
    level: 2
    track_only: true
  Plugin.AI_model_id:
    value: gemma4:12b
    description: Identifier of the model to use at the LLM endpoint, for example gemma4:12b.
    type: string
    level: 1
    track_only: true
  Plugin.AI_openai_api_base:
    value: http://127.0.0.1:11434/v1
    description: Base URL of the OpenAI-compatible LLM endpoint the AI module talks to (Ollama, vLLM, OpenAI, ...). Passed to the module with every request.
    type: string
    level: 1
    track_only: true
  Plugin.AI_request_timeout:
    value: 120
    description: Timeout in seconds the AI module applies to each call it makes to the LLM endpoint.
    type: numeric
    level: 2
    track_only: true
  Plugin.AI_services_enable:
    value: false
    description: Enable/disable the AI services (the ai_connector misp-module). While disabled, no AI action is offered anywhere in the UI.
    type: boolean
    level: 0
    track_only: true
  Plugin.AI_services_port:
    value: '6666'
    description: The port used to access the AI services. By default, it is accessible at 127.0.0.1:6666
    type: numeric
    level: 1
    track_only: true
  Plugin.AI_services_url:
    value: http://127.0.0.1
    description: The url used to access the AI services. By default, it is accessible at http://127.0.0.1:6666
    type: string
    level: 1
    track_only: true
  Plugin.AI_ssl_allow_self_signed:
    value: false
    description: Set to true to accept a self-signed certificate from the AI services. This requires AI_ssl_verify_peer to be enabled.
    type: boolean
    level: 1
    track_only: true
  Plugin.AI_ssl_cafile:
    value: ''
    description: Set to the absolute path of the Certificate Authority file that you wish to use for verifying the SSL certificate of the AI services.
    type: string
    level: 1
    track_only: true
  Plugin.AI_ssl_verify_host:
    value: true
    description: Set to false if you wish to ignore hostname match errors when validating the certificate of the AI services.
    type: boolean
    level: 1
    track_only: true
  Plugin.AI_ssl_verify_peer:
    value: true
    description: Set to false to disable SSL verification when reaching the AI services. This is not recommended.
    type: boolean
    level: 1
    track_only: true
  Plugin.AI_suggest_limit:
