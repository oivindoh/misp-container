  SMIME.email:
    value: ''
    description: The e-mail address that the instance's S/MIME key is tied to.
    type: string
    level: 2
    track_only: true
  Security.advanced_authkeys_validity:
    value: ''
    description: Maximal key lifetime in days. Use can limit that validity even more. Just newly created keys will be affected. When not set, key validity is not limited.
    type: numeric
    level: 2
    track_only: true
  Security.allow_cors:
    value: false
    description: Allow cross-origin requests to this instance, matching origins given in Security.cors_origins. Set to false to totally disable
    type: boolean
    level: 1
    track_only: true
  Security.allow_password_forgotten:
    value: false
    description: Enabling this setting will allow users to request automated password reset tokens via mail and initiate a reset themselves. Users with no encryption keys will not be able to use this feature.
    type: boolean
    level: 1
    file_only: true
    sensitive: true
    track_only: true
  Security.allow_self_registration:
    value: false
    description: Enabling this setting will allow users to have access to the pre-auth registration form. This will create an inbox entry for administrators to review.
    type: boolean
    level: 1
    track_only: true
  Security.allow_unsafe_apikey_named_param:
    value: false
    description: Allows passing the API key via the named url parameter "apikey" - highly recommended not to enable this, but if you have some dodgy legacy tools that cannot pass the authorization header it can work as a workaround. Again, only use this as a last resort.
    type: boolean
    level: 0
    track_only: true
  Security.allow_unsafe_cleartext_apikey_logging:
    value: false
    description: Allows logging the API key (auth key) in clear text - highly recommended not to enable this.
    type: boolean
    level: 0
    track_only: true
  Security.api_key_quick_lookup:
    value: false
    description: Allow for the temporary storing of hashed API keys in redis for a short period of time, to allow for faster authentication of consecutive API requests. This is a massive speed-up for tools unable to continue the session, querying fast endpoints of MISP in rapid succession, at the cost of storing HMAC hashed api keys in redis.
    type: boolean
    level: 0
    track_only: true
  Security.auth_enforced:
    value: false
    description: This optionally can be enabled if an external auth provider is used. When set to true, it will disable the default form authentication.
    type: boolean
    level: 2
    track_only: true
  Security.authkey_keep_session:
    value: false
    description: When enabled, session is kept between API requests.
    type: boolean
    level: 2
    track_only: true
  Security.cors_origins:
    value: ''
    description: Set the origins from which MISP will allow cross-origin requests. Useful for external integration. Comma separate if you need more than one.
    type: string
    level: 1
    track_only: true
  Security.disclose_user_emails:
    value: false
    description: Enable this setting to allow for the user e-mail addresses to be shown to non site-admin users. Keep in mind that in broad communities this can be abused.
    type: boolean
    level: 0
    track_only: true
  Security.email_otp_enabled:
    value: false
    description: 'Enable two step authentication with a OTP sent by email. Requires e-mailing to be enabled. Warning: You cannot use it in combination with external authentication plugins.'
    type: boolean
    level: 2
    track_only: true
  Security.email_otp_exceptions:
    value: ''
    description: A comma separated list of emails for which the OTP is disabled. Note that if you remove someone from this list, the OTP will only be asked at next login.
    type: string
    level: 2
    track_only: true
  Security.email_otp_text:
    value: 'Dear MISP user,\n\nYou have attempted to login to MISP ($misp) from $ip with username $username.\n\n Use the following OTP to log into MISP: $otp\n This code is valid for the next $validity minutes.\n\nIf you have any questions, don''t hesitate to contact us at: $contact.\n\nBest regards,\nYour $org MISP support team'
    description: 'The message sent to the user when a new OTP is requested. Use \n for line-breaks. The following variables will be automatically replaced in the text: $otp = the new OTP generated by MISP, $username = the user''s e-mail address, $org the Organisation managing the instance, $misp = the url of this instance, $contact = the e-mail address used to contact the support team (as set in MISP.contact), $ip the IP used to complete the first step of the login and $validity the validity time in minutes.'
    type: string
    level: 2
    track_only: true
  Security.enable_svg_logos:
    value: false
    description: When enabled, SVG images are accepted as organisation logos and as event report pictures. SVG files are served with a sandboxing Content-Security-Policy so any script they carry cannot run in the browser; they still remain XML documents rather than bitmaps, so leave this disabled unless you need it.
    type: boolean
    level: 2
    track_only: true
  Security.eventreport_enable_arbitrary_urls:
    value: false
    description: 'Enable this setting if you wish for users to be able to query any arbitrary URL via event report import from URL feature. Keep in mind that queries are executed by the MISP server or, for HTML imports, by the misp-modules host, so any internal IP reachable from either - including loopback and cloud metadata endpoints - becomes reachable by the requesting user. This is NOT limited to site admins: the import action requires only perm_add, which the default user role carries. Enable this only where every user holding perm_add is trusted with that network position.'
    type: boolean
    level: 0
    track_only: true
  Security.eventreport_max_fetch_size:
    value: 26214400
    description: Maximum size, in bytes, of a document fetched by the event report URL import. The document is held in memory and base64 encoded before being passed to the module, so the peak cost is roughly 2.5x this value. Set to 0 for no limit, which is not recommended - an unbounded read is reachable from a request of a couple of hundred bytes.
    type: numeric
    level: 1
    track_only: true
  Security.force_https:
    value: false
    description: If enabled, MISP server will consider all requests as secure. This is usually useful when you run MISP behind reverse proxy that terminates HTTPS.
    type: boolean
    level: 2
    track_only: true
  Security.hide_organisation_index_from_users:
    value: false
    description: Enabling this setting will block the organisation index from being visible to anyone besides site administrators on the current instance. Keep in mind that users can still see organisations that produce data via events, proposals, event history log entries, etc.
    type: boolean
    level: 1
    track_only: true
  Security.hide_organisations_in_sharing_groups:
    value: false
    description: Enabling this setting will block the organisation list from being visible in sharing group besides user with sharing group permission.
    type: boolean
    level: 1
    track_only: true
  Security.limit_site_admins_to_host_org:
    value: false
    description: If enabled, it will only be possible to assign site admin roles to users belonging to the instance's host org.
    type: boolean
    level: 1
    track_only: true
  Security.mandate_ip_allowlist_advanced_authkeys:
    value: false
    description: If enabled, setting an ip allowlist will be mandatory when adding or editing an advanced authkey.
    type: boolean
    level: 2
    track_only: true
  Security.min_tls_version:
    value: ''
    description: Minimal required TLS version when connecting to external resources.
    type: string
    level: 2
    track_only: true
  Security.otp_disabled:
    value: false
    description: Disable TOTP on this instance.
    type: boolean
    level: 2
    track_only: true
  Security.otp_issuer:
    value: false
    description: If OTP is enabled, set the issuer string to an arbitrary value. Otherwise, MISP will default to "[MISP.org] MISP".
    type: string
    level: 2
    track_only: true
  Security.otp_required:
    value: false
    description: Require authentication with OTP. Users that do not have (T/H)OTP configured will be forced to create a token at first login.
    type: boolean
    level: 2
    track_only: true
  Security.pre_auth_flood_filter_enable:
    value: false
    description: Cap the number of requests a single source address may make before it has authenticated. Every pre-auth surface does durable work before it knows who is calling - the password reset form writes an audit entry and queues a job, self-registration writes an inbox entry, and a REST call with no API key writes an authentication failure - so an anonymous flood costs storage on every request. Authenticated callers are never affected, including API keys and synchronisation. Leave this off unless the instance is exposed to the public internet; a shared egress address may need the threshold raised.
    type: boolean
    level: 1
    track_only: true
  Security.pre_auth_flood_filter_threshold:
    value: 100
    description: The number of requests one source address may make in any 15 minute window before it has authenticated. Further requests are refused with a 429 until the window ends. Only used when Security.pre_auth_flood_filter_enable is on.
    type: numeric
    level: 1
    track_only: true
  Security.sanitise_attribute_on_delete:
    value: false
    description: Enabling this setting will sanitise the contents of an attribute on a soft delete
    type: boolean
    level: 1
    track_only: true
  Security.self_registration_message:
    value: If you would like to send us a registration request, please fill out the form below. Make sure you fill out as much information as possible in order to ease the task of the administrators.
    description: The message sent shown to anyone trying to self-register.
    type: string
    level: 1
    track_only: true
  Security.sync_audit:
    value: false
    description: Enable this setting to create verbose logs of synced event data for debugging reasons. Logs are saved in your MISP directory's app/files/scripts/tmp/ directory.
    type: boolean
    level: 1
    track_only: true
  Security.syslog:
    value: false
    description: Enable this setting to pass all audit log entries directly to syslog. Keep in mind, this is verbose and will include user, organisation, event data.
    type: boolean
    level: 0
    track_only: true
  Security.syslog_ident:
    value: ''
    description: Syslog message identifier.
    type: string
    level: 2
    track_only: true
  Security.syslog_json_format:
    value: false
    description: If enabled, syslog messages will be formatted in JSON rather than the custom format used by MISP historically.
    type: boolean
    level: 2
    track_only: true
  Security.user_monitoring_enabled:
    value: false
    description: Enables the functionality to monitor users - thereby enabling all logging functionalities for a single user. This functionality is intrusive and potentially heavy on the system - use it with care.
    type: boolean
    level: 1
    track_only: true
  Security.user_org_uuid_in_response_header:
    value: false
    description: When enabled, logged in user's organisation uuid will be included in X-UserOrgUUID HTTP response header.
    type: boolean
    level: 2
    track_only: true
  Security.workflow_enable_arbitrary_urls:
    value: false
    description: Enable this setting if you wish for users to be able to query any arbitrary URL via workflows. Keep in mind that queries are executed by the MISP server, so internal IPs in your MISP's network may be reachable. Only a compromised site-admin account could cause damage.
    type: boolean
    level: 0
    track_only: true
  Session.autoRegenerate:
    value: false
    description: Set to true to automatically regenerate sessions after x number of requests. This might lead to the user getting de-authenticated and is frustrating in general, so only enable it if you really need to regenerate sessions. (Not recommended)
    type: boolean
    level: 0
    track_only: true
  Session.checkAgent:
    value: false
    description: Set to true to check for the user agent string in each request. This can lead to occasional logouts (not recommended).
    type: boolean
    level: 0
    track_only: true
  site_admin_debug:
    value: ''
    description: The debug level of the instance for site admins. This feature allows site admins to run debug mode on a live instance without exposing it to other users. The most verbose option of debug and site_admin_debug is used for site admins.
    type: boolean
    level: 0
    track_only: true
