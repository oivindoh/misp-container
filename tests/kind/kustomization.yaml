# Test overlay for tests/run-kind-test.sh: the base with the mariadb and redis
# components in namespace misp, test secrets, the images under the tag "kind",
# and a ReadWriteOnce attachments claim, because kind's local-path storage
# offers no ReadWriteMany.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: misp

resources:
  - namespace.yaml
  - ../../deploy/base

components:
  - ../../deploy/components/mariadb
  - ../../deploy/components/redis

secretGenerator:
  - name: misp-db
    behavior: merge
    literals:
      - DB_PASSWORD=kind-db-3f9a71c2
      - MYSQL_ROOT_PASSWORD=kind-root-8c1d5e07
  - name: misp-app
    behavior: merge
    literals:
      - MISP_REDIS_PASSWORD=kind-redis-5e2b9a44
      - GNUPG_PASSWORD=kind-gpg-7a4c0d93
      - SECURITY_SALT=0f3a9c2e7b5d18466a1c3e5f7092b4d6e8f0a1c3e5b7d9f2a4c6e8b0d2f4a6c8
  - name: misp-admin
    behavior: merge
    literals:
      - ADMIN_PASSWORD=Kind-Str0ng!Pass#2026-x
      - ADMIN_KEY=kindTESTkey0123456789abcdefghijklmnopqrs

configMapGenerator:
  - name: misp-env
    behavior: merge
    literals:
      - MISP_BASEURL=http://localhost:38080
      - MISP_UUID=5b0c7a3e-2f1d-4c8b-9e6a-7d3f1b2c4e5a

images:
  - name: ghcr.io/oivindoh/misp-container
    newTag: kind
  - name: ghcr.io/oivindoh/misp-container-caddy
    newTag: kind
  - name: ghcr.io/oivindoh/misp-container-modules
    newTag: kind

patches:
  - target:
      kind: PersistentVolumeClaim
      name: attachments
    patch: |-
      - op: replace
        path: /spec/accessModes/0
        value: ReadWriteOnce
