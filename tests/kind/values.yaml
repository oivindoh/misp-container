# Values for tests/run-kind-test.sh: the mariadb, redis, cronjobs and
# housekeeping components, test secrets, the images under the tag kind, and a
# ReadWriteOnce attachments claim, because kind's local-path storage offers no
# ReadWriteMany.
image:
  tag: kind
mariadb:
  enabled: true
redis:
  enabled: true
cronjobs:
  enabled: true
housekeeping:
  enabled: true
attachments:
  accessMode: ReadWriteOnce
env:
  MISP_BASEURL: http://localhost:38080
  MISP_UUID: 5b0c7a3e-2f1d-4c8b-9e6a-7d3f1b2c4e5a
secrets:
  db:
    DB_PASSWORD: kind-db-3f9a71c2
    MYSQL_ROOT_PASSWORD: kind-root-8c1d5e07
  app:
    MISP_REDIS_PASSWORD: kind-redis-5e2b9a44
    GNUPG_PASSWORD: kind-gpg-7a4c0d93
    SECURITY_SALT: 0f3a9c2e7b5d18466a1c3e5f7092b4d6e8f0a1c3e5b7d9f2a4c6e8b0d2f4a6c8
  admin:
    ADMIN_PASSWORD: Kind-Str0ng!Pass#2026-x
    ADMIN_KEY: kindTESTkey0123456789abcdefghijklmnopqrs
