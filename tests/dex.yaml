# dex as the OIDC provider for the integration suite: one static client (MISP)
# and one static user. The issuer must be reachable under the same name from
# MISP (token exchange) and from the test client, so the login flow runs
# inside the compose network.
issuer: http://dex:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
staticClients:
  - id: misp
    secret: misp-oidc-test-secret
    name: MISP
    redirectURIs:
      - http://caddy:8080/users/login
enablePasswordDB: true
staticPasswords:
  # password: oidc-test-password
  - email: oidc@example.com
    hash: "$2b$10$PQTrQkefCD/m9CEyFRCsfuBiNgav0zkpSbN49DiH2G8X.Ie.v.UT2"
    username: oidc
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
