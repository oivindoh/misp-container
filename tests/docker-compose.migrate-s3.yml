# Points every MISP container at the cross-engine migration target: the
# postgres service (tests/postgres.env) with attachments in S3
# (tests/migrate-target-s3.env), after the copy.
x-target-env: &target-env
  env_file:
    - chart/files/base.env
    - chart/files/secrets-db.env
    - chart/files/secrets-app.env
    - compose.env
    - compose-secrets.env
    - ../tests/test-compose.env
    - ../tests/test-compose-secrets.env
    - ../tests/postgres.env
    - ../tests/migrate-target-s3.env

# configure and sync act as the admin: the same plus secrets-admin.env
x-target-env-admin: &target-env-admin
  env_file:
    - chart/files/base.env
    - chart/files/secrets-db.env
    - chart/files/secrets-app.env
    - chart/files/secrets-admin.env
    - compose.env
    - compose-secrets.env
    - ../tests/test-compose.env
    - ../tests/test-compose-secrets.env
    - ../tests/postgres.env
    - ../tests/migrate-target-s3.env

services:
  configure:
    <<: *target-env-admin
    depends_on:
      postgres:
        condition: service_healthy
  web:
    <<: *target-env
  worker:
    <<: *target-env
  sync:
    <<: *target-env-admin
  metrics:
    <<: *target-env
