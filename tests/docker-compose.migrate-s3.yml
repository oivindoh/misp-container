# Points every MISP container at the cross-engine migration target: the
# postgres service (tests/postgres.env) with attachments in S3
# (tests/migrate-target-s3.env), after the copy.
x-target-env: &target-env
  env_file:
    - base/base.env
    - base/secrets-db.env
    - base/secrets-app.env
    - base/secrets-admin.env
    - compose.env
    - compose-secrets.env
    - ../tests/test-compose.env
    - ../tests/test-compose-secrets.env
    - ../tests/postgres.env
    - ../tests/migrate-target-s3.env

services:
  configure:
    <<: *target-env
    depends_on:
      postgres:
        condition: service_healthy
  web:
    <<: *target-env
  worker:
    <<: *target-env
  sync:
    <<: *target-env
  metrics:
    <<: *target-env
