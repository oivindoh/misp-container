# Test overlay -- overrides deploy/docker-compose.yml with test-specific values.
# Used by tests/e2e/test_integration.py

# Every env_file list here repeats the list it overrides, then adds the test
# files. podman-compose appends an override list and docker compose merges it
# and drops repeats; only a repeated prefix gives both runners the same settings
# (tests/test_compose_files.py).
x-test-env: &test-env
  env_file:
    - chart/files/base.env
    - chart/files/secrets-db.env
    - chart/files/secrets-app.env
    - compose.env
    - compose-secrets.env
    - ../tests/test-compose.env
    - ../tests/test-compose-secrets.env

# configure and sync act as the admin: the same plus secrets-admin.env
x-test-env-admin: &test-env-admin
  env_file:
    - chart/files/base.env
    - chart/files/secrets-db.env
    - chart/files/secrets-app.env
    - chart/files/secrets-admin.env
    - compose.env
    - compose-secrets.env
    - ../tests/test-compose.env
    - ../tests/test-compose-secrets.env

services:
  # read_only on all our containers to catch filesystem write issues
  # before they hit Kubernetes (readOnlyRootFilesystem: true)
  configure:
    <<: *test-env-admin
    read_only: true
  web:
    <<: *test-env
    # Not read_only: version-gate tests patch /etc/misp-docker/settings.yaml.
    # In K8s, readOnlyRootFilesystem is set and settings.yaml is mounted read-only.
  worker:
    <<: *test-env
    read_only: true

  caddy:
    read_only: true
    ports:
      - "28080:8080"

  sync:
    <<: *test-env-admin
    read_only: true

  metrics:
    <<: *test-env
    read_only: true
    ports:
      - "19191:9191"

  modules:
    read_only: true
    ports:
      - "16666:6666"

  mysql:
    env_file:
      - chart/files/secrets-db.env
      - compose-secrets.env
      - ../tests/test-compose-secrets.env
    environment:
      MARIADB_DATABASE: misp

  # command and healthcheck come from the base file; repeating a list here
  # makes podman-compose concatenate it
  redis:
    env_file:
      - compose-secrets.env
      - ../tests/test-compose-secrets.env

  # PostgreSQL for the second run of the suite (tests/e2e/test_integration.py --db-engine postgres)
  postgres:
    env_file:
      - chart/files/secrets-db.env
      - compose-secrets.env
      - ../tests/test-compose-secrets.env

  # OIDC provider for the login test (tests/dex.yaml)
  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ../tests/dex.yaml:/etc/dex/config.yaml:ro
    ports:
      - "15556:5556"

  # S3-compatible storage for attachment testing
  garage:
    image: dxflrs/garage:v2.4.1
    ports:
      - "3900:3900"
      - "3903:3903"
    volumes:
      - ../tests/garage.toml:/etc/garage.toml:ro
      - garage-data:/tmp/garage
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml

volumes:
  garage-data:
