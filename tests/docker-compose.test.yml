# Test overlay -- overrides deploy/docker-compose.yml with test-specific values.
# Used by tests/e2e/test_integration.py

# Every env_file list here repeats the list it overrides, then adds the test
# files. podman-compose appends an override list and docker compose merges it
# and drops repeats; only a repeated prefix gives both runners the same settings
# (tests/test_compose_files.py). MISP_TEST_ENV names one more env file, layered
# last: a suite points the MISP containers at another database or bucket with it.
x-test-env: &test-env
  env_file:
    - chart/files/base.env
    - chart/files/secrets-db.env
    - chart/files/secrets-app.env
    - compose.env
    - compose-secrets.env
    - ../tests/test-compose.env
    - ../tests/test-compose-secrets.env
    - ${MISP_TEST_ENV:-../tests/none.env}

# configure and sync act as the admin: the same plus secrets-admin.env
x-test-env-admin: &test-env-admin
  env_file:
    - chart/files/base.env
    - chart/files/secrets-db.env
    - chart/files/secrets-app.env
    - chart/files/secrets-admin.env
    - compose.env
    - compose-secrets.env
    - ../tests/test-compose.env
    - ../tests/test-compose-secrets.env
    - ${MISP_TEST_ENV:-../tests/none.env}

services:
  # read_only on all our containers to catch filesystem write issues
  # before they hit Kubernetes (readOnlyRootFilesystem: true)
  configure:
    <<: *test-env-admin
    read_only: true
  web:
    <<: *test-env
    read_only: true
  worker:
    <<: *test-env
    read_only: true

  caddy:
    read_only: true
    ports:
      - "28080:8080"

  sync:
    <<: *test-env-admin
    read_only: true

  metrics:
    <<: *test-env
    read_only: true
    ports:
      - "19191:9191"

  modules:
    read_only: true
    ports:
      - "16666:6666"

  # command and healthcheck come from the base file; repeating a list here
  # makes podman-compose concatenate it
  redis:
    env_file:
      - compose-secrets.env
      - ../tests/test-compose-secrets.env

  postgres:
    env_file:
      - chart/files/secrets-db.env
      - compose-secrets.env
      - ../tests/test-compose-secrets.env

  # OIDC provider for the login test: Keycloak with the realm of tests/keycloak-realm.json.
  # MISP (token exchange) and the test client reach it under the same name, so the
  # issuer matches and the login flow runs inside the compose network
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../tests/keycloak-realm.json:/opt/keycloak/data/import/misp-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 20

  # S3-compatible storage for attachment testing
  garage:
    image: dxflrs/garage:v2.4.1
    ports:
      - "3900:3900"
      - "3903:3903"
    volumes:
      - ../tests/garage.toml:/etc/garage.toml:ro
      - garage-data:/tmp/garage
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml

volumes:
  garage-data:
