# MISP 2.5.50 from the MISP project's images (github.com/MISP/misp-docker): the
# hub-spoke suite's partner C, on the MariaDB of tests/k3s/mariadb.yaml and a Redis
# of its own. The suite puts the settings, in the names of those images, in the
# ConfigMap misp-25-env. A rebuild moves a tag, so the digests pin the images. No pod
# gets service links: misp-docker reads REDIS_PORT, which a link sets to tcp://<address>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: docker.io/library/redis:8.10.2-trixie@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
          args: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--save", ""]
          envFrom:
            - configMapRef:
                name: misp-25-env
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core
    spec:
      enableServiceLinks: false
      containers:
        - name: core
          image: ghcr.io/misp/misp-docker/misp-core:v2.5.50@sha256:1bf559bf280021da2adead9e715a8c84786e378b107e34e8b834d518596fcab7
          envFrom:
            - configMapRef:
                name: misp-25-env
---
apiVersion: v1
kind: Service
metadata:
  name: core
spec:
  selector:
    app.kubernetes.io/name: core
  ports:
    - name: fpm
      port: 9002
    - name: status
      port: 9003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
    spec:
      enableServiceLinks: false
      containers:
        - name: nginx
          image: ghcr.io/misp/misp-docker/misp-nginx:v2.5.50@sha256:0ddc6730db7433220b821d6aa640cb3205ec59166364daf50272090bf4d066cd
          env:
            - name: FASTCGI_LISTEN
              value: core:9002
            - name: FASTCGI_LISTEN_STATUS
              value: core:9003
          envFrom:
            - configMapRef:
                name: misp-25-env
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - name: http
      port: 8080
