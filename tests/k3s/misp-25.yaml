# MISP 2.5.50 from the MISP project's images (github.com/MISP/misp-docker): the
# hub-spoke suite's partner C, on the MariaDB of tests/k3s/mariadb.yaml and a Redis
# of its own. The suite puts the settings, in the names of those images, in the
# ConfigMap misp-25-env. A rebuild moves a tag, so the digests pin the images. No pod
# gets service links: misp-docker reads REDIS_PORT, which a link sets to tcp://<address>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: docker.io/library/redis:8.10.3-trixie@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
          args: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--save", ""]
          envFrom:
            - configMapRef:
                name: misp-25-env
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core
    spec:
      enableServiceLinks: false
      containers:
        - name: core
          image: ghcr.io/misp/misp-docker/misp-core:v2.5.51@sha256:4b43b036962a1996ec23ba2ce619f88c8ad64a48729867348ae8dcf0dd9061db
          envFrom:
            - configMapRef:
                name: misp-25-env
---
apiVersion: v1
kind: Service
metadata:
  name: core
spec:
  selector:
    app.kubernetes.io/name: core
  ports:
    - name: fpm
      port: 9002
    - name: status
      port: 9003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
    spec:
      enableServiceLinks: false
      containers:
        - name: nginx
          image: ghcr.io/misp/misp-docker/misp-nginx:v2.5.51@sha256:84bc3a6587eec76bc8d5285bf7b60a46cc89281367de0675dc97b87913b24c4f
          env:
            - name: FASTCGI_LISTEN
              value: core:9002
            - name: FASTCGI_LISTEN_STATUS
              value: core:9003
          envFrom:
            - configMapRef:
                name: misp-25-env
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - name: http
      port: 8080
