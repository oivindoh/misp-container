apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: misp
  labels:
    app.kubernetes.io/name: web
spec:
  parentRefs:
    # The Gateway this route attaches to: patch it in the overlay
    - name: gateway
      namespace: gateway-system
  hostnames:
    - misp.example.com
  rules:
    - backendRefs:
        - name: web
          port: 8080
