apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Periodic MISP tasks through the API: feed caching and fetching, server pull
# and push, galaxy, taxonomy, warninglist and noticelist updates.
# ADMIN_KEY must be set in misp-admin.
resources:
  - cronjobs.yaml
# The task image tag follows the base's images transformer only inside the
# base; pin it here to the same release.
images:
  - name: ghcr.io/oivindoh/misp-container
    newTag: 2.5.37
