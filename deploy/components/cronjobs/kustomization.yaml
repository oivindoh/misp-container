apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Periodic MISP tasks: feed caching and fetching, server caching, pull and
# push, TAXII push, sharing group blueprints, galaxy, taxonomy, warninglist,
# noticelist and object template updates through the API, and the periodic
# summaries through MISP's console. ADMIN_KEY must be set in misp-admin.
resources:
  - cronjobs.yaml
# The task image tag follows the base's images transformer only inside the
# base; pin it here to the same release.
images:
  - name: ghcr.io/oivindoh/misp-container
    newTag: 2.5.37
