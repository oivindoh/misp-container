# MISP periodic tasks, run by the task runner in the main image:
#   python3 -m misp_container.task <task>
# API tasks (app.kubernetes.io/component: misp-task) call the MISP API.
# ADMIN_KEY must be set in misp-admin; the runner exits 1 with a clear
# message when it is empty. A run dispatches nothing while the queue holds
# TASK_MAX_QUEUED jobs or more (read from the metrics exporter).
# Console tasks (misp-console-task) have no API: the pod renders app/Config
# and runs MISP's console, with the configure Job's volumes and Secrets.
# -- Cache all configured feeds --
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cache-feeds
  labels:
    app.kubernetes.io/name: cache-feeds
    app.kubernetes.io/component: misp-task
spec:
  schedule: "20 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cache-feeds
            app.kubernetes.io/component: misp-task
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: task
              image: ghcr.io/oivindoh/misp-container:2.5.37
              command: ["/usr/bin/tini", "--", "python3", "-m", "misp_container.task", "cache-feeds"]
              env:
                - name: SYNC_BASE_URL
                  value: http://web:8080
                - name: TASK_METRICS_URL
                  value: http://metrics:9191/metrics
                - name: TASK_MAX_QUEUED
                  value: "200"
                - name: ADMIN_KEY
                  valueFrom:
                    secretKeyRef:
                      name: misp-admin
                      key: ADMIN_KEY
                      optional: true
              resources:
                requests:
                  cpu: 5m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
---
