# MISP periodic tasks through the API, run by the task runner in the main image:
#   python3 -m misp_container.task <task>
# ADMIN_KEY must be set in misp-secrets; the runner exits 1 with a clear
# message when it is empty.
# -- Cache all configured feeds --
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cache-feeds
  labels:
    app.kubernetes.io/name: cache-feeds
spec:
  schedule: "20 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cache-feeds
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: task
              image: ghcr.io/oivindoh/misp-container
              command: ["/usr/bin/tini", "--", "python3", "-m", "misp_container.task", "cache-feeds"]
              env:
                - name: SYNC_BASE_URL
                  value: http://web:8080
                - name: ADMIN_KEY
                  valueFrom:
                    secretKeyRef:
                      name: misp-secrets
                      key: ADMIN_KEY
                      optional: true
              resources:
                requests:
                  cpu: 5m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
---
