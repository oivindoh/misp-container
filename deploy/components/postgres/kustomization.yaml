apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Single-node PostgreSQL on a PVC, as the alternative to the mariadb component.
# The overlay also sets DB_ENGINE=postgres, DB_HOST=postgres and DB_PORT=5432
# in misp-env. Leave this component out to use an external PostgreSQL
# (StackGres and the like).
resources:
  - postgres.yaml
images:
  - name: docker.io/library/postgres
    newTag: "17"
