apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: misp
  labels:
    app.kubernetes.io/name: web
  annotations:
    # HAProxy would append to an X-Forwarded-For the client sent; this replaces
    # the header with the address HAProxy sees, so only that address reaches caddy
    # (docs/kubernetes.md, Client addresses). Behind another load balancer, that is
    # the balancer's address unless it speaks the PROXY protocol to HAProxy.
    haproxy.org/request-set-header: "X-Forwarded-For %[src]"
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - misp.example.com
      secretName: misp-tls
  rules:
    - host: misp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
