apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Nightly deletes of old rows in jobs, logs and audit_logs, on MariaDB or
# PostgreSQL. Retention: HOUSEKEEPING_JOBS_DAYS, HOUSEKEEPING_LOGS_DAYS,
# HOUSEKEEPING_AUDIT_LOGS_DAYS in misp-env (defaults 2, 30, 90).
resources:
  - housekeeping-cronjobs.yaml
# The image carries this release's tag; an images entry in the overlay overrides it,
# and this component rewrites no other image.
