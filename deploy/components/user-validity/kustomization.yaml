apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Daily check of every MISP account against the OIDC or LDAP identity
# provider, through MISP's console. Needs the oidc or ldap group enabled.
resources:
  - cronjob.yaml
# The task image tag follows the base's images transformer only inside the
# base; pin it here to the same release.
images:
  - name: ghcr.io/oivindoh/misp-container
    newTag: 2.5.37
