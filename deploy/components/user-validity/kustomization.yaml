apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Daily check of every MISP account against the OIDC or LDAP identity
# provider, through MISP's console. Needs the oidc or ldap group enabled.
resources:
  - cronjob.yaml
# The image carries this release's tag; an images entry in the overlay overrides it,
# and this component rewrites no other image.
