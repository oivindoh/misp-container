# Encrypt with: sops -e -i secrets.sops.yaml
# PLACEHOLDER -- replace values and encrypt before committing. The configure
# step refuses to run with these placeholder values.
apiVersion: v1
kind: Secret
metadata:
  name: misp-db
  annotations:
    kustomize.config.k8s.io/behavior: replace
type: Opaque
stringData:
  MYSQL_USER: misp
  MYSQL_PASSWORD: REPLACE-WITH-REAL-PASSWORD
  MYSQL_ROOT_PASSWORD: REPLACE-WITH-REAL-PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: misp-app
  annotations:
    kustomize.config.k8s.io/behavior: replace
type: Opaque
stringData:
  MISP_REDIS_PASSWORD: REPLACE-WITH-REAL-PASSWORD
  GNUPG_PASSWORD: REPLACE-WITH-REAL-PASSWORD
  SECURITY_ENCRYPTION_KEY: REPLACE-WITH-REAL-KEY
  SECURITY_SALT: REPLACE-WITH-64-HEX-CHARS-FROM-secrets.token_hex(32)
---
apiVersion: v1
kind: Secret
metadata:
  name: misp-admin
  annotations:
    kustomize.config.k8s.io/behavior: replace
type: Opaque
stringData:
  ADMIN_PASSWORD: REPLACE-WITH-REAL-PASSWORD
  ADMIN_KEY: REPLACE-WITH-A-40-CHAR-KEY
