# change that breaks existing values.
version: 1.0.0
# The image tag of the release: the MISP version, with -rN for a hotfix. The
# images default to it.
appVersion: "2.5.37"
home: https://github.com/oivindoh/misp-container
sources:
  - https://github.com/oivindoh/misp-container
  - https://github.com/MISP/MISP
keywords:
  - misp
  - threat-intelligence
