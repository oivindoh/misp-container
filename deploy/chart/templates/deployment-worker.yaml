# Scalable job workers -- safe to run multiple replicas. MISP's own scheduler
# never runs: periodic tasks are Kubernetes CronJobs (the cronjobs component).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "misp.labels" (dict "root" . "name" "worker") | nindent 4 }}
  annotations:
    # After the configure Job (wave 1)
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
      annotations:
        {{- include "misp.checksums" . | nindent 8 }}
    spec:
      # supervisord lets a running job finish for WORKER_STOP_GRACE seconds (default
      # 300, files/entrypoint-worker.py); the kubelet must wait longer than that
      terminationGracePeriodSeconds: {{ add 30 (int (default 300 (index .Values.env "WORKER_STOP_GRACE"))) }}
      {{- include "misp.podSecurityContext" . | nindent 6 }}
      {{- include "misp.podScheduling" . | nindent 6 }}
      containers:
        - name: worker
          {{- include "misp.image" . | nindent 10 }}
          command: ["/usr/bin/tini", "--", "python3", "/entrypoint-worker.py"]
          envFrom:
            - configMapRef:
                name: misp-env
            - secretRef:
                name: misp-db
            - secretRef:
                name: misp-app
          volumeMounts:
            {{- include "misp.appVolumeMounts" . | nindent 12 }}
            - name: attachments
              mountPath: /var/www/MISP/app/attachments
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          # The web pods reach supervisord through the TCP proxy on 9001, so that
          # port is what the probes test. The entrypoint exits when supervisord
          # does, which restarts the pod.
          startupProbe:
            tcpSocket:
              port: 9001
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 9001
            periodSeconds: 30
          livenessProbe:
            tcpSocket:
              port: 9001
            periodSeconds: 60
          {{- include "misp.containerSecurityContext" . | nindent 10 }}

      volumes:
        {{- include "misp.appVolumes" . | nindent 8 }}
        {{- include "misp.attachmentsVolume" . | nindent 8 }}
