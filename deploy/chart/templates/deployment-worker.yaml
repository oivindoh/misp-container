# Scalable job workers -- safe to run multiple replicas. MISP's own scheduler
# never runs: periodic tasks are Kubernetes CronJobs (the cronjobs component).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "misp.labels" (dict "root" . "name" "worker") | nindent 4 }}
    app: worker
  annotations:
    # After the configure Job (wave 1)
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: worker
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app: worker
        app.kubernetes.io/name: worker
      annotations:
        {{- include "misp.checksums" . | nindent 8 }}
    spec:
      # Long enough for supervisord to let a running job finish (WORKER_STOP_GRACE)
      terminationGracePeriodSeconds: 330
      {{- include "misp.podSecurityContext" . | nindent 6 }}
      {{- include "misp.podScheduling" . | nindent 6 }}
      containers:
        - name: worker
          {{- include "misp.image" . | nindent 10 }}
          command: ["/usr/bin/tini", "--", "python3", "/entrypoint-worker.py"]
          envFrom:
            - configMapRef:
                name: misp-env
            - secretRef:
                name: misp-db
            - secretRef:
                name: misp-app
          volumeMounts:
            {{- include "misp.appVolumeMounts" . | nindent 12 }}
            - name: attachments
              mountPath: /var/www/MISP/app/attachments
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["test", "-S", "/tmp/supervisor.sock"]
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["test", "-S", "/tmp/supervisor.sock"]
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["test", "-S", "/tmp/supervisor.sock"]
            periodSeconds: 60
          {{- include "misp.containerSecurityContext" . | nindent 10 }}

      volumes:
        {{- include "misp.appVolumes" . | nindent 8 }}
        {{- include "misp.attachmentsVolume" . | nindent 8 }}
