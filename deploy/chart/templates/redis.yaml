# The redis component: a single Redis without persistence, so sessions and
# queued jobs do not survive a restart. The password is MISP_REDIS_PASSWORD.
{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "misp.labels" (dict "root" . "name" "redis") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
      {{- if .Values.secrets.create }}
      annotations:
        checksum/secrets: {{ printf "%s%s" (.Files.Get "files/secrets-app.env") (toJson .Values.secrets.app) | sha256sum }}
      {{- end }}
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- include "misp.podScheduling" . | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command:
            - redis-server
            - --requirepass
            - $(MISP_REDIS_PASSWORD)
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - noeviction
            - --save
            - ""
            - --appendonly
            - "no"
          env:
            - name: MISP_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: misp-app
                  key: MISP_REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          # Redis answers on the port as soon as it serves. An exec probe cannot
          # authenticate: the kubelet expands $(VAR) from static env values only,
          # never from a secretKeyRef, and redis-cli exits 0 on an error reply.
          startupProbe:
            tcpSocket:
              port: 6379
            failureThreshold: 10
            periodSeconds: 3
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 30
          {{- include "misp.containerSecurityContext" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "misp.labels" (dict "root" . "name" "redis") | nindent 4 }}
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
{{- end }}
