# The mariadb component: single-node MariaDB on a ReadWriteOnce claim, the
# database misp owned by DB_USER. The official image runs mysqld as its mysql
# user (999) when started as that user; fsGroup makes the claim writable for it.
{{- if .Values.mariadb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    {{- include "misp.labels" (dict "root" . "name" "mysql") | nindent 4 }}
spec:
  replicas: 1
  serviceName: mysql
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- include "misp.podScheduling" . | nindent 6 }}
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image }}
          args:
            {{- toYaml .Values.mariadb.args | nindent 12 }}
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: misp-db
                  key: MYSQL_ROOT_PASSWORD
            - name: MARIADB_DATABASE
              value: misp
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  {{- include "misp.dbSecretKeyRef" (list . "user") | nindent 18 }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "misp.dbSecretKeyRef" (list . "password") | nindent 18 }}
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.mariadb.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mariadb.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    {{- include "misp.labels" (dict "root" . "name" "mysql") | nindent 4 }}
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
{{- end }}
