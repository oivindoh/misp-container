# supervisord in the worker pods, port 9001: the web pods list, start and stop
# the background workers here (SimpleBackgroundJobs.supervisor_host).
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels:
    {{- include "misp.labels" (dict "root" . "name" "worker") | nindent 4 }}
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app.kubernetes.io/name: worker
  ports:
    - name: supervisor
      port: 9001
      targetPort: 9001
      protocol: TCP
