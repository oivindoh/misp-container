# -- Housekeeping cronjobs --
# Egress to MariaDB and DNS only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: housekeeping
  labels:
    {{- include "misp.labels" (dict "root" $ "name" "housekeeping") | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: misp-housekeeping
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mysql
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
