      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
            - port: "465"
              protocol: TCP
            - port: "587"
              protocol: TCP
    # Outbound HTTPS: the OIDC provider, external LDAP over TLS
    - toCIDRSet:
