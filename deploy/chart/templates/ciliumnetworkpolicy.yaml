            app.kubernetes.io/name: web
        - matchLabels:
            app.kubernetes.io/name: worker
        - matchLabels:
            app.kubernetes.io/component: misp-console-task
        - matchLabels:
            app.kubernetes.io/name: configure
        - matchLabels:
            app.kubernetes.io/name: org-sync
        - matchLabels:
            app.kubernetes.io/component: misp-housekeeping
        - matchLabels:
            app.kubernetes.io/name: metrics
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  egress:
    # DNS only
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# -- Redis --
# Accepts connections from web, worker, configure, metrics and console task pods.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cache
  labels:
    {{- include "misp.labels" (dict "root" $ "name" "cache") | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  ingress:
