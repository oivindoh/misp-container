# The housekeeping component: nightly batched deletes of old rows in jobs, logs
# and audit_logs (python3 -m misp_container.housekeeping). Autovacuum reclaims
# the space. Retention is a policy choice: HOUSEKEEPING_<TABLE>_DAYS in env.
{{- if .Values.housekeeping.enabled }}
{{- range $table, $schedule := .Values.housekeeping.schedules }}
---
{{ include "misp.taskCronJob" (dict "root" $ "name" (printf "housekeeping-%s" ($table | replace "_" "-")) "module" "housekeeping" "task" $table "args" list "schedule" $schedule) }}
{{- end }}
{{- end }}
