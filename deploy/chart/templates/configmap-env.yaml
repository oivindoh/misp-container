# misp-env: files/base.env, then the env value. Every MISP pod reads it; its
# checksum rolls the Deployments.
{{- $env := include "misp.envFile" (list . "files/base.env") | fromJson }}
{{- range $key, $value := .Values.env }}
{{- $_ := set $env $key (toString $value) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: misp-env
  labels:
    {{- include "misp.labels" (dict "root" . "name" "misp-env") | nindent 4 }}
data:
  {{- range $key := keys $env | sortAlpha }}
  {{ $key }}: {{ index $env $key | quote }}
  {{- end }}
