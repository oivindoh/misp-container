# misp-env: files/base.env, then the env value (misp.envValues). Every MISP pod reads it;
# its checksum rolls the Deployments. With databaseCA, DB_SSLROOTCERT names the
# certificate's mount.
{{- $env := include "misp.envValues" . | fromJson }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: misp-env
  labels:
    {{- include "misp.labels" (dict "root" . "name" "misp-env") | nindent 4 }}
data:
  {{- range $key := keys $env | sortAlpha }}
  {{ $key }}: {{ index $env $key | quote }}
  {{- end }}
