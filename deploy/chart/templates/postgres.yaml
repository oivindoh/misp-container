# The postgres component: single-node PostgreSQL on a ReadWriteOnce claim, the
# database misp owned by DB_USER, UTF8. It sets DB_ENGINE, DB_HOST and DB_PORT
# in misp-env (configmap-env.yaml).
{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "misp.labels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  replicas: 1
  serviceName: postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- include "misp.podScheduling" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args:
            {{- toYaml .Values.postgres.args | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: misp
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: misp-db
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: misp-db
                  key: DB_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "misp", "-d", "misp"]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "misp", "-d", "misp"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "misp", "-d", "misp"]
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "misp.labels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
{{- end }}
