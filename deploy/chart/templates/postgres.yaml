# The postgres component: single-node PostgreSQL on a ReadWriteOnce claim, the
# database misp owned by DB_USER, UTF8, behind the Service postgres that DB_HOST
# names by default.
{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "misp.labels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  replicas: 1
  serviceName: postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        {{- include "misp.podLabels" (dict "root" . "name" "postgres") | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- include "misp.podScheduling" . | nindent 6 }}
      initContainers:
        # A claim from chart 1.x holds its cluster in pgdata/, where the image does not
        # look for older data: without this check a new, empty cluster starts beside it.
        - name: check-data
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - |
              if [ -s /var/lib/postgresql/pgdata/PG_VERSION ]; then
                echo "A chart 1.x database (MISP 2.5, PostgreSQL $(cat /var/lib/postgresql/pgdata/PG_VERSION)) is in /var/lib/postgresql/pgdata: MISP 3.0 cannot use a MISP 2.5 database on PostgreSQL. Install on a new claim (docs/migration.md)" >&2
                exit 1
              fi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args:
            {{- toYaml .Values.postgres.args | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: misp-env
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  {{- include "misp.secretKeyRef" (list . "DB_USER") | nindent 18 }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "misp.secretKeyRef" (list . "DB_PASSWORD") | nindent 18 }}
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "misp.labels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
{{- end }}
