# Prometheus exporter on port 9191: MISP's database, the job queues in Redis and
# the sync partners (docs/metrics.md). It reads MISP's data and never changes it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics
  labels:
    {{- include "misp.labels" (dict "root" . "name" "metrics") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics
  template:
    metadata:
      labels:
        {{- include "misp.podLabels" (dict "root" . "name" "metrics") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9191"
        prometheus.io/path: "/metrics"
        {{- include "misp.checksums" . | nindent 8 }}
        {{- include "misp.podAnnotations" . | nindent 8 }}
    spec:
      {{- include "misp.podSecurityContext" . | nindent 6 }}
      {{- include "misp.podScheduling" . | nindent 6 }}
      containers:
        - name: metrics
          {{- include "misp.image" . | nindent 10 }}
          args: ["python3", "-m", "misp_container.metrics"]
          ports:
            - name: metrics
              containerPort: 9191
              protocol: TCP
          envFrom:
            - configMapRef:
                name: misp-env
            # The job backend's Redis, and the settings the repository carries
            - configMapRef:
                name: misp-settings
          # The database credentials, the Redis password and the proxy password only:
          # the exporter never needs the admin secrets or the other application secrets
          env:
            {{- with include "misp.connectionEnv" (list . "misp-env") }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  {{- include "misp.secretKeyRef" (list . "DB_USER") | nindent 18 }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "misp.secretKeyRef" (list . "DB_PASSWORD") | nindent 18 }}
            - name: MISP_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "misp.secretKeyRef" (list . "MISP_REDIS_PASSWORD") | nindent 18 }}
            {{- with (include "misp.settings" . | fromJson).MISP_SETTING_Proxy__password }}
            {{- with .secretKeyRef }}
            # The partner checks go through MISP's proxy
            - name: MISP_SETTING_Proxy__password
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
                  optional: true
            {{- end }}
            {{- end }}
          volumeMounts:
            # The sync servers' pinned and client certificates, for the partner checks
            - name: certs
              mountPath: /etc/misp-docker/certs
              readOnly: true
            {{- with include "misp.caVolumeMounts" . }}
            {{- . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.metrics.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: 9191
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 9191
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9191
            periodSeconds: 60
          {{- include "misp.containerSecurityContext" . | nindent 10 }}
      volumes:
        - name: certs
          secret:
            secretName: misp-certs
            optional: true
        {{- with include "misp.caVolumes" . }}
        {{- . | nindent 8 }}
        {{- end }}
