# The Secrets follow their consumers: web and worker pods get misp-db and
# misp-app, never misp-admin; metrics gets two keys of misp-db and one of
# misp-app. Each is its file in files/ with the secrets value on top; with
# secrets.create: false the release supplies them.
{{- if .Values.secrets.create }}
{{- $secrets := list (list "misp-db" "files/secrets-db.env" .Values.secrets.db) (list "misp-app" "files/secrets-app.env" .Values.secrets.app) (list "misp-admin" "files/secrets-admin.env" .Values.secrets.admin) }}
{{- if .Values.migrate.enabled }}
{{- $secrets = append $secrets (list "misp-migrate" "files/secrets-migrate.env" .Values.migrate.secret) }}
{{- end }}
{{- range $secrets }}
{{- $name := index . 0 }}
{{- $data := include "misp.envFile" (list $ (index . 1)) | fromJson }}
{{- range $key, $value := index . 2 }}
{{- $_ := set $data $key (toString $value) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "misp.labels" (dict "root" $ "name" $name) | nindent 4 }}
type: Opaque
stringData:
  {{- range $key := keys $data | sortAlpha }}
  {{ $key }}: {{ index $data $key | quote }}
  {{- end }}
{{- end }}
{{- end }}
