# The Secrets follow their consumers: web and worker pods get misp-db and
# misp-app, never misp-admin; metrics gets two keys of misp-db, and of
# misp-app the Redis and proxy passwords. Each holds its map of the secrets
# value; with secrets.create: false the release supplies them.
{{- if .Values.secrets.create }}
{{- $secrets := list (list "misp-db" .Values.secrets.db) (list "misp-app" .Values.secrets.app) (list "misp-admin" .Values.secrets.admin) }}
{{- if .Values.migrate.enabled }}
{{- $secrets = append $secrets (list "misp-migrate" .Values.migrate.secret) }}
{{- end }}
{{- range $secrets }}
{{- $name := index . 0 }}
{{- $data := dict }}
{{- range $key, $value := index . 1 }}
{{- if not (kindIs "invalid" $value) }}
{{- $_ := set $data $key (toString $value) }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "misp.labels" (dict "root" $ "name" $name) | nindent 4 }}
type: Opaque
stringData:
  {{- range $key := keys $data | sortAlpha }}
  {{ $key }}: {{ index $data $key | quote }}
  {{- end }}
{{- end }}
{{- end }}
