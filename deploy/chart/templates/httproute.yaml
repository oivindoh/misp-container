# The httpRoute component: an HTTPRoute for a Gateway API implementation, in
# place of the ingress. caddy takes the client address from X-Forwarded-For,
# right to left, past TRUSTED_PROXY_CIDR: set that in env to the Gateway's
# proxy pods.
{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: misp
  labels:
    {{- include "misp.labels" (dict "root" . "name" "web") | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - backendRefs:
        - name: web
          port: 8080
{{- end }}
