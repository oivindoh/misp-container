# MISP's web tier: PHP-FPM (port 9002) and a caddy sidecar that serves the static
# files and passes the rest to PHP-FPM over FastCGI (port 8080). Replicas scale
# freely: each pod renders its own app/Config and waits for the configure Job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "misp.labels" (dict "root" . "name" "web") | nindent 4 }}
  annotations:
    # After the configure Job (wave 1)
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
      annotations:
        {{- include "misp.checksums" . | nindent 8 }}
    spec:
      {{- include "misp.podSecurityContext" . | nindent 6 }}
      {{- include "misp.podScheduling" . | nindent 6 }}
      containers:
        # caddy sidecar - lightweight scratch image with static webroot files
        - name: caddy
          image: {{ .Values.image.caddy }}:{{ include "misp.tag" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # The ingress or Gateway proxies whose X-Forwarded-For caddy follows; unset,
            # every private range
            - name: TRUSTED_PROXY_CIDR
              valueFrom:
                configMapKeyRef:
                  name: misp-env
                  key: TRUSTED_PROXY_CIDR
                  optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.web.resources.caddy | nindent 12 }}
          # Startup proves the application serves once. Readiness hits PHP-FPM's
          # ping through caddy, with no database round trip, so a database outage
          # takes no pod out of the Service. Liveness checks caddy alone: the
          # php-fpm container checks PHP-FPM, so a hung PHP-FPM restarts itself.
          startupProbe:
            httpGet:
              path: /users/login
              port: 8080
            failureThreshold: 150
            periodSeconds: 4
          readinessProbe:
            httpGet:
              path: /fpm-ping
              port: 8080
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
          {{- include "misp.containerSecurityContext" . | nindent 10 }}

        # PHP-FPM - the MISP application
        - name: php-fpm
          {{- include "misp.image" . | nindent 10 }}
          args: ["python3", "-m", "misp_container.web"]
          ports:
            - name: php-fpm
              containerPort: 9002
              protocol: TCP
          {{- include "misp.appEnv" (list . "misp-db" "misp-app") | nindent 10 }}
          volumeMounts:
            {{- include "misp.appVolumeMounts" . | nindent 12 }}
            - name: attachments
              mountPath: /var/www/MISP/app/attachments
          resources:
            {{- toYaml .Values.web.resources.phpFpm | nindent 12 }}
          # PHP-FPM only listens after the configure Job has set MISP.live=true;
          # the startup budget covers a first install where the Job imports the
          # schema and applies every setting. Liveness asks PHP-FPM itself for
          # its ping, through caddy in the same pod: an open port does not show
          # a hung PHP-FPM. caddy's readiness probe covers the pod's readiness.
          startupProbe:
            tcpSocket:
              port: 9002
            failureThreshold: 150
            periodSeconds: 4
          livenessProbe:
            httpGet:
              path: /fpm-ping
              port: 8080
            periodSeconds: 30
          {{- include "misp.containerSecurityContext" . | nindent 10 }}

      volumes:
        {{- include "misp.appVolumes" . | nindent 8 }}
        {{- include "misp.attachmentsVolume" . | nindent 8 }}
