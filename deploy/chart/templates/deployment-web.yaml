# MISP's web tier: PHP-FPM (port 9002) and a caddy sidecar that serves the static
# files and passes the rest to PHP-FPM over FastCGI (port 8080). Replicas scale
# freely: each pod renders its own app/Config and waits for the configure Job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "misp.labels" (dict "root" . "name" "web") | nindent 4 }}
    app: web
  annotations:
    # After the configure Job (wave 1)
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/name: web
      annotations:
        {{- include "misp.checksums" . | nindent 8 }}
    spec:
      {{- include "misp.podSecurityContext" . | nindent 6 }}
      {{- include "misp.podScheduling" . | nindent 6 }}
      containers:
        # caddy sidecar - lightweight scratch image with static webroot files
        - name: caddy
          image: {{ .Values.image.caddy }}:{{ include "misp.tag" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # The ingress or Gateway proxies whose X-Forwarded-For caddy follows; unset,
            # every private range
            - name: TRUSTED_PROXY_CIDR
              valueFrom:
                configMapKeyRef:
                  name: misp-env
                  key: TRUSTED_PROXY_CIDR
                  optional: true
          command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: attachments
              mountPath: /var/www/MISP/app/webroot/img/orgs
              subPath: img/orgs
              readOnly: true
            - name: attachments
              mountPath: /var/www/MISP/app/webroot/img/custom
              subPath: img/custom
              readOnly: true
          resources:
            {{- toYaml .Values.web.resources.caddy | nindent 12 }}
          # Startup proves the application serves once. Readiness and liveness
          # hit PHP-FPM's ping through caddy: no database round trip, so a
          # database outage does not restart the pod.
          startupProbe:
            httpGet:
              path: /users/login
              port: 8080
            failureThreshold: 150
            periodSeconds: 4
          readinessProbe:
            httpGet:
              path: /fpm-ping
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /fpm-ping
              port: 8080
            periodSeconds: 30
          {{- include "misp.containerSecurityContext" . | nindent 10 }}

        # PHP-FPM - the MISP application
        - name: php-fpm
          {{- include "misp.image" . | nindent 10 }}
          command: ["/usr/bin/tini", "--", "python3", "/entrypoint-web.py"]
          ports:
            - name: php-fpm
              containerPort: 9002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: misp-env
            - secretRef:
                name: misp-db
            - secretRef:
                name: misp-app
          volumeMounts:
            {{- include "misp.appVolumeMounts" . | nindent 12 }}
            - name: attachments
              mountPath: /var/www/MISP/app/attachments
            # Org logos and custom images live on the shared attachments claim, so
            # every replica and caddy see the same files
            - name: attachments
              mountPath: /var/www/MISP/app/webroot/img/orgs
              subPath: img/orgs
            - name: attachments
              mountPath: /var/www/MISP/app/webroot/img/custom
              subPath: img/custom
            - name: php-run
              mountPath: /run/php
          resources:
            {{- toYaml .Values.web.resources.phpFpm | nindent 12 }}
          # PHP-FPM only listens after the configure Job has set MISP.live=true,
          # so a TCP probe is enough. The startup budget covers a first install
          # where the Job imports the schema and applies every setting.
          startupProbe:
            tcpSocket:
              port: 9002
            failureThreshold: 150
            periodSeconds: 4
          readinessProbe:
            tcpSocket:
              port: 9002
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9002
            periodSeconds: 30
          {{- include "misp.containerSecurityContext" . | nindent 10 }}

      volumes:
        {{- include "misp.appVolumes" . | nindent 8 }}
        {{- include "misp.attachmentsVolume" . | nindent 8 }}
        - name: php-run
          emptyDir:
            sizeLimit: 5Mi
