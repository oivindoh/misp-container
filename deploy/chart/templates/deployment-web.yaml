# MISP's web tier: PHP-FPM (127.0.0.1:9002) and a caddy sidecar that serves the static
# files and passes the rest to PHP-FPM over FastCGI (port 8080). Replicas scale
# freely: each pod renders its own app/Config and waits for the configure Job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "misp.labels" (dict "root" . "name" "web") | nindent 4 }}
  annotations:
    # After the configure Job (wave 1)
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        {{- include "misp.podLabels" (dict "root" . "name" "web") | nindent 8 }}
      annotations:
        {{- include "misp.checksums" . | nindent 8 }}
        {{- include "misp.podAnnotations" . | nindent 8 }}
    spec:
      # The preStop hooks, then PHP_REQUEST_TIMEOUT for the running requests
      terminationGracePeriodSeconds: {{ add 15 (int (default 330 (index .Values.env "PHP_REQUEST_TIMEOUT"))) }}
      {{- include "misp.podSecurityContext" . | nindent 6 }}
      {{- include "misp.podScheduling" . | nindent 6 }}
      {{- with .Values.web.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # caddy, from the main image: the static files of its webroot, the rest over
        # FastCGI to PHP-FPM on the pod's loopback
        - name: caddy
          {{- include "misp.image" . | nindent 10 }}
          args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
          env:
            # The Gateway's proxies whose X-Forwarded-For caddy follows; unset,
            # every private range
            - name: TRUSTED_PROXY_CIDR
              valueFrom:
                configMapKeyRef:
                  name: misp-env
                  key: TRUSTED_PROXY_CIDR
                  optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.web.resources.caddy | nindent 12 }}
          # The kubelet sends SIGTERM after the hook: by then the endpoint is gone from the
          # proxies, and caddy finishes its open requests before it exits
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # Startup proves the application serves once. Readiness hits PHP-FPM's
          # ping through caddy, with no database round trip, so a database outage
          # takes no pod out of the Service. The ping has a pool of its own, so busy
          # request workers do not delay it. Liveness checks caddy alone: the
          # php-fpm container checks PHP-FPM, so a hung PHP-FPM restarts itself.
          startupProbe:
            httpGet:
              path: /users/login
              port: 8080
            failureThreshold: 150
            periodSeconds: 4
          readinessProbe:
            httpGet:
              path: /fpm-ping
              port: 8080
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
          {{- include "misp.containerSecurityContext" . | nindent 10 }}

        # PHP-FPM - the MISP application
        - name: php-fpm
          {{- include "misp.image" . | nindent 10 }}
          args: ["python3", "-m", "misp_container.web"]
          {{- include "misp.appEnv" (list . "misp-db" "misp-app") | nindent 10 }}
          volumeMounts:
            {{- include "misp.appVolumeMounts" . | nindent 12 }}
            - name: attachments
              mountPath: /var/www/MISP/app/attachments
          resources:
            {{- toYaml .Values.web.resources.phpFpm | nindent 12 }}
          # SIGTERM ends PHP-FPM's running requests at once; SIGQUIT lets them finish. The
          # hook waits for the proxies to drop the endpoint, sends SIGQUIT through tini (PID
          # 1), and waits for PHP-FPM to exit
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5; kill -QUIT 1; while kill -0 1 2>/dev/null; do sleep 1; done"]
          # PHP-FPM listens on the loopback only after the configure run of this
          # pod's image and configuration, so the kubelet reaches it through caddy;
          # the startup budget covers a first install where the Job imports the
          # schema. Liveness asks PHP-FPM itself for its ping: an
          # open port does not show a hung PHP-FPM. caddy's readiness probe covers
          # the pod's readiness.
          startupProbe:
            httpGet:
              path: /fpm-ping
              port: 8080
            failureThreshold: 150
            periodSeconds: 4
          livenessProbe:
            httpGet:
              path: /fpm-ping
              port: 8080
            periodSeconds: 30
          {{- include "misp.containerSecurityContext" . | nindent 10 }}

      volumes:
        {{- include "misp.appVolumes" . | nindent 8 }}
        {{- include "misp.attachmentsVolume" . | nindent 8 }}
