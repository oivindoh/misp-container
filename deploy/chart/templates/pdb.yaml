# One voluntary disruption at a time for web and worker. maxUnavailable, not
# minAvailable, so a single replica never blocks a node drain.
{{- range list "web" "worker" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ . }}
  labels:
    {{- include "misp.labels" (dict "root" $ "name" .) | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ . }}
{{- end }}
