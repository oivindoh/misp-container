# MISP over HTTP: caddy in the web pods, port 8080. The ingress or HTTPRoute
# routes here.
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "misp.labels" (dict "root" . "name" "web") | nindent 4 }}
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
