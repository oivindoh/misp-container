# helm test: checks a release from inside the cluster. It loads the login page
# through the web Service and, with ADMIN_KEY in misp-admin, calls the API as
# the admin and reads MISP.live. The pod carries the API task label, so the
# networkPolicy component lets it reach web.
apiVersion: v1
kind: Pod
metadata:
  name: misp-test
  labels:
    {{- include "misp.labels" (dict "root" . "name" "misp-test") | nindent 4 }}
    app.kubernetes.io/component: misp-task
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- include "misp.podSecurityContext" . | nindent 2 }}
  {{- include "misp.podScheduling" . | nindent 2 }}
  containers:
    - name: test
      {{- include "misp.image" . | nindent 6 }}
      command:
        - python3
        - -c
        - |
          import json, os, urllib.error, urllib.request

          def get(path, key=""):
              # MISP answers a JSON request without a key with 403, the login page included
              headers = {"Accept": "application/json", "Authorization": key} if key else {}
              request = urllib.request.Request("http://web:8080" + path, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.read()
              except urllib.error.URLError as e:
                  raise SystemExit(f"failed: GET {path}: {e}")

          get("/users/login")
          print("ok: the login page answers")
          key = os.environ.get("ADMIN_KEY", "")
          if not key:
              print("skipped: ADMIN_KEY is empty in misp-admin, so the API checks do not run")
              raise SystemExit(0)
          version = json.loads(get("/servers/getVersion", key))["version"]
          print(f"ok: the API answers as the admin, MISP {version}")
          live = json.loads(get("/servers/getSetting/MISP.live", key)).get("value")
          assert live in (True, 1, "1", "true"), f"MISP.live is {live!r}"
          print("ok: MISP.live is true")
      env:
        {{- include "misp.logEnv" . | nindent 8 }}
        - name: ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: misp-admin
              key: ADMIN_KEY
              optional: true
      resources:
        {{- toYaml .Values.cronjobs.resources.api | nindent 8 }}
      {{- include "misp.containerSecurityContext" . | nindent 6 }}
