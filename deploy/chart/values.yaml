# Values of the misp chart. The comment above each top-level key describes it;
# docs/kubernetes.md and AGENTS.md take their tables from these comments. A key
# with enabled: false is a component: an optional part that a release switches on.

# The two images, with one tag. An empty tag is the chart's appVersion. The web
# pod's caddy container runs the misp image.
image:
  misp: ghcr.io/oivindoh/misp-container
  modules: ghcr.io/oivindoh/misp-container-modules
  tag: ""
  pullPolicy: IfNotPresent

# Secrets with the registry credentials for the images, by name.
imagePullSecrets: []

# Node selection for every pod of the release.
nodeSelector: {}

# Tolerations for every pod of the release.
tolerations: []

# Affinity for every pod of the release.
affinity: {}

# The misp-env ConfigMap, which every MISP pod reads. A release sets an entry to change it, or
# null to drop it. The settings of MISP itself are in files/settings.yaml.
env:
  # -- Instance
  # MISP_EXTERNAL_BASEURL and SECURITY_REST_CLIENT_BASEURL take MISP_BASEURL unless set
  MISP_BASEURL: "https://misp.example.com"
  TZ: "UTC"
  # -- Instance identity
  # MISP_EMAIL takes ADMIN_EMAIL, and MISP_CONTACT and GNUPG_EMAIL take MISP_EMAIL, unless set
  MISP_UUID: ""
  # -- Admin
  ADMIN_EMAIL: "admin@admin.test"
  ADMIN_ORG: "ORGNAME"
  # The admin organisation's UUID, as sync partners know it; unset, the organisation of the
  # first user keeps the UUID MISP gave it. Either way it is MISP's host organisation
  # ADMIN_ORG_UUID: ""
  # -- Database: PostgreSQL; DB_HOST postgres is the Service of the postgres component
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "misp"
  # TLS in libpq's terms: disable, prefer, require, verify-ca or verify-full
  DB_SSLMODE: "prefer"
  # -- Redis
  MISP_REDIS_HOST: "redis"
  MISP_REDIS_PORT: "6379"
  # -- Email: the relay MISP sends through. SMTP_TLS true sends STARTTLS; a relay that speaks
  # TLS from the first byte (port 465) takes SMTP_FQDN ssl://<host>. With SMTP_USERNAME, MISP
  # logs in with SMTP_PASSWORD from secrets.app
  SMTP_FQDN: "mail"
  SMTP_PORT: "25"
  SMTP_TLS: "false"
  SMTP_USERNAME: ""
  # -- Client addresses: the ingress or Gateway proxy pods, whose X-Forwarded-For caddy follows
  # (docs/kubernetes.md, Client addresses). Unset, caddy trusts every private range, and a
  # client with a private address is logged as the proxy.
  # TRUSTED_PROXY_CIDR: "10.244.0.0/16"
  # -- Logging. json: one JSON object per line, for a log collector; text: for a terminal
  LOG_FORMAT: "json"
  # -- Auth plugins: true turns one on. Their settings are the groups oidc and ldap of
  # files/settings.yaml, rendered into config.php (docs/configuration.md)
  OIDC_ENABLE: "false"
  LDAPAUTH_ENABLE: "false"
  # -- Org sync
  ORG_CONFIG_FILE: "/etc/misp-docker/orgs.yaml"
  # -- PHP
  PHP_MEMORY_LIMIT: "2048M"
  PHP_MAX_EXECUTION_TIME: "300"
  # A web request's wall-clock limit in seconds: PHP_MAX_EXECUTION_TIME counts CPU time only.
  # PHP-FPM ends a request past it, also one that MISP lets run longer (a role's limit, a
  # download). A stopping web pod lets its running requests finish within it.
  PHP_REQUEST_TIMEOUT: "330"
  PHP_UPLOAD_MAX_FILESIZE: "50M"
  PHP_POST_MAX_SIZE: "50M"
  PHP_MAX_INPUT_TIME: "300"
  PHP_MAX_FILE_UPLOADS: "50"
  # -- PHP-FPM pool
  PHP_FCGI_CHILDREN: "5"
  PHP_FCGI_START_SERVERS: "2"
  PHP_FCGI_SPARE_SERVERS: "1"
  PHP_FCGI_MAX_REQUESTS: "0"
  # -- Workers
  NUM_WORKERS_DEFAULT: "5"
  NUM_WORKERS_PRIO: "5"
  NUM_WORKERS_EMAIL: "5"
  NUM_WORKERS_UPDATE: "1"
  NUM_WORKERS_CACHE: "5"
  # Per worker process; a job past it fails alone instead of the kubelet killing the pod
  # (docs/kubernetes.md, Sizing). Unset: PHP_MEMORY_LIMIT.
  # WORKER_MEMORY_LIMIT: "2048M"

# The misp-db, misp-app and misp-admin Secrets. The configure Job refuses their placeholders:
# a release sets every value marked change-me or override-me. With create: false the chart
# renders none of them: supply Secrets with the same names and keys (SOPS, External Secrets,
# Sealed Secrets).
secrets:
  create: true
  # misp-db: configure and its migrate container, web, worker, the task CronJobs, org-sync, the
  # postgres component, housekeeping; metrics gets both keys. connectionSecrets can map an
  # operator's Secret onto them instead.
  db:
    DB_USER: "misp"
    DB_PASSWORD: "change-me"
  # misp-app: configure and its migrate container, web, worker, the redis component, the task
  # CronJobs; metrics gets MISP_REDIS_PASSWORD and PROXY_PASSWORD. A key named after a setting
  # is that setting's value (Security.salt -> SECURITY_SALT): the chart passes it to MISP by
  # reference, so it never lands in a ConfigMap. Every secret setting of settings.yaml takes its
  # key here, or in the Secret of a release with create: false, also one this map does not
  # name (OIDC_CLIENT_SECRET, PROXY_PASSWORD, PLUGIN_S3_AWS_SECRET_KEY); so does SMTP_PASSWORD.
  app:
    MISP_REDIS_PASSWORD: "change-me"
    GNUPG_PASSWORD: "change-me"
    SECURITY_ENCRYPTION_KEY: ""
    # 32 characters or more, identical on every replica:
    # python3 -c "import secrets; print(secrets.token_hex(32))"
    SECURITY_SALT: "override-me-generate-a-real-64-char-hex-salt-with-python3-secret"
  # misp-admin: configure, org-sync, the helm test pod; web and worker pods never see it
  admin:
    ADMIN_PASSWORD: "change-me"
    # The admin's API key, 40 characters; the org sync and the helm test's API checks need it.
    # Empty: the admin keeps the key MISP made at its first start, which nobody reads.
    ADMIN_KEY: ""

# The connection to PostgreSQL and Redis from Secrets the release does not make, such as the
# ones a database operator keeps (docs/kubernetes.md, External PostgreSQL and Redis): each Secret
# by name, with the env var that each of its keys fills. They replace the same entries of
# misp-env, misp-db and misp-app in every pod, the postgres and redis components included.
connectionSecrets: []
  # - name: misp-pguser-misp
  #   keys: {DB_HOST: host, DB_PORT: port, DB_NAME: dbname, DB_USER: user, DB_PASSWORD: password}

# The CA certificate of the PostgreSQL server, from a Secret: a name and a key. Every pod that
# connects mounts it at DB_SSLROOTCERT, for DB_SSLMODE verify-ca or verify-full in env.
databaseCA: {}
  # databaseCA: {name: misp-cluster-cert, key: ca.crt}

# The configure Job: schema, MISP's updates, admin user and organisation, on every install and upgrade.
configure:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: 2000m, memory: 2Gi}

# MISP's web tier: PHP-FPM and the caddy sidecar in each pod. Replicas scale freely.
web:
  replicas: 1
  resources:
    phpFpm:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 2000m, memory: 4Gi}
    caddy:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 500m, memory: 128Mi}

# The background workers, which take their jobs from Redis. Replicas scale freely.
worker:
  replicas: 1
  resources:
    requests: {cpu: 10m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 2Gi}

# The Prometheus exporter (docs/metrics.md).
metrics:
  resources:
    requests: {cpu: 5m, memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}

# misp-modules: the enrichment, import, export and action modules.
modules:
  replicas: 1
  resources:
    requests: {cpu: 10m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 1Gi}

# The org-sync Job applies orgs, the content of orgs.yaml (deploy/orgs.yaml.example), through
# the API after each install and upgrade. It exits at once when ADMIN_KEY is empty.
orgSync:
  orgs:
    teams: []
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

# Attachments, org logos and custom images on the claim attachments. Web and worker pods on
# different nodes write there, so the storage class must offer ReadWriteMany. For attachments in
# S3, set PLUGIN_S3_BUCKET_NAME in env and claim: false; org logos and custom images then stay
# in each pod.
attachments:
  claim: true
  size: 20Gi
  accessMode: ReadWriteMany
  storageClass: ""

# Single-node PostgreSQL on a ReadWriteOnce claim. Leave it off for an external PostgreSQL
# (DB_HOST in env or connectionSecrets; CloudNativePG, StackGres, Percona and the like).
postgres:
  enabled: false
  image: docker.io/library/postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
  size: 20Gi
  storageClass: ""
  args: ["-c", "shared_buffers=512MB"]
  resources:
    requests: {cpu: 200m, memory: 1Gi}
    limits: {cpu: 4000m, memory: 4Gi}

# Single Redis without persistence: sessions and queued jobs do not survive a restart. Leave it
# off for an external Redis (MISP_REDIS_HOST in env or connectionSecrets). maxmemory caps the
# data, under the memory limit: past it Redis refuses writes, and MISP's API calls and logins
# fail, because MISP keeps the feed and server caches, sessions and key use counters there.
redis:
  enabled: false
  image: docker.io/library/redis:8.10.1-trixie@sha256:8a1efc5f479551822b47424ccae982026b633f28818eab0387348120a61e10e2
  maxmemory: 256mb
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {cpu: 1000m, memory: 384Mi}

# An Ingress to the web Service. The default annotation makes the haproxy ingress replace
# X-Forwarded-For with the address it sees (docs/kubernetes.md, Client addresses).
ingress:
  enabled: false
  className: haproxy
  host: misp.example.com
  tlsSecret: misp-tls
  annotations:
    haproxy.org/request-set-header: "X-Forwarded-For %[src]"

# An HTTPRoute for a Gateway API implementation, in place of the ingress. The Gateway must
# allow routes from this namespace; set TRUSTED_PROXY_CIDR in env to its proxy pods.
httpRoute:
  enabled: false
  parentRefs:
    - name: gateway
      namespace: gateway-system
  hostnames:
    - misp.example.com

# NetworkPolicies for the release's pods, for any CNI that enforces the NetworkPolicy API,
# Cilium included: ingress from the release's own pods, DNS, HTTPS out, SMTP and LDAP.
# ingressNamespace holds the ingress or Gateway proxies, monitoringNamespace Prometheus;
# egress adds rules for the MISP pods, by default an external PostgreSQL and Redis.
networkPolicy:
  enabled: false
  ingressNamespace: haproxy-controller
  monitoringNamespace: monitoring
  # Egress rules of the MISP pods, on top of the chart's. A rule names the port the server's
  # pods listen on.
  egress:
    - ports: [{port: 5432, protocol: TCP}, {port: 6379, protocol: TCP}]
    # - to: [{podSelector: {matchLabels: {cnpg.io/cluster: misp-pg}}}]
    #   ports: [{port: 5432, protocol: TCP}]

# The periodic tasks as CronJobs, each running MISP's console in its pod: tasks maps a task to
# its schedule, workflows a workflow ID to its schedule. The pod's PHP process has the workers'
# memory ceiling (WORKER_MEMORY_LIMIT, else PHP_MEMORY_LIMIT), which resources must hold.
cronjobs:
  enabled: false
  tasks:
    cache-feeds: "20 2 * * *"
    fetch-feeds: "30 2 * * *"
    cache-servers: "40 2 * * *"
    pull-servers: "*/5 * * * *"
    push-servers: "*/15 * * * *"
    update-galaxies: "0 3 * * *"
    update-taxonomies: "10 3 * * *"
    update-warninglists: "20 3 * * *"
    update-noticelists: "30 3 * * *"
    update-object-templates: "40 3 * * *"
    push-taxii: "7 * * * *"
    # MISP's console fails a run while no blueprint exists: give it a schedule once one does
    sharing-group-blueprints: ""
    periodic-summary: "0 6 * * *"
    # Need the oidc or ldap group: give check-user-validity a schedule, such as "30 5 * * *",
    # to report each account the provider no longer backs, or block-invalid-users to disable it
    check-user-validity: ""
    block-invalid-users: ""
  workflows: {}
  # A run past it gets SIGTERM, and the task logs the command it stopped. Pulls from many
  # partners, or a first full pull, can need more
  activeDeadlineSeconds: 3600
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 2560Mi}

# Nightly deletes of old rows in jobs, logs and audit_logs (HOUSEKEEPING_<TABLE>_DAYS in env,
# defaults 2, 30 and 90).
housekeeping:
  enabled: false
  schedules:
    jobs: "0 2 * * *"
    logs: "0 3 * * *"
    audit_logs: "10 3 * * *"
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

# A copy of an existing MySQL or MariaDB MISP into the database, before the configure Job runs
# (docs/migration.md). secret: the misp-migrate Secret. volumes and volumeMounts: the source's
# attachments directory.
migrate:
  enabled: false
  secret:
    # The source database; a read-only user is enough. MIGRATE_SOURCE_PORT defaults to 3306,
    # MIGRATE_SOURCE_NAME to misp; MIGRATE_SOURCE_TLS: "true" for a TLS connection.
    MIGRATE_SOURCE_HOST: "change-me.example.com"
    MIGRATE_SOURCE_USER: "misp"
    MIGRATE_SOURCE_PASSWORD: "change-me"
    # "true" drops a non-empty target database first. A copy this Job made stays unless
    # MIGRATE_REPLACE_COPY is "true" as well.
    MIGRATE_FORCE: "false"
    MIGRATE_REPLACE_COPY: "false"
    # The source's attachments, from one of two places. A mounted copy of its attachments
    # directory (volumes, docs/migration.md):
    MIGRATE_SOURCE_FILES: ""
    # Or its S3 bucket. The endpoint is for an AWS-compatible store; empty for AWS. The Job
    # signs with the access key. MIGRATE_SOURCE_S3_VALIDATE_CA defaults to true;
    # MIGRATE_SOURCE_S3_CA names a CA bundle.
    MIGRATE_SOURCE_S3_BUCKET: ""
    MIGRATE_SOURCE_S3_ENDPOINT: ""
    MIGRATE_SOURCE_S3_REGION: ""
    MIGRATE_SOURCE_S3_ACCESS_KEY: ""
    MIGRATE_SOURCE_S3_SECRET_KEY: ""
  volumes: []
  volumeMounts: []
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 2000m, memory: 1Gi}
