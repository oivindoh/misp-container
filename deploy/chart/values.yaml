# Values of the misp chart. The comment above each top-level key describes it;
# docs/kubernetes.md and AGENTS.md take their tables from these comments. A key
# with enabled: false is a component: an optional part that a release switches on.

# The two images, with one tag. An empty tag is the chart's appVersion. The web
# pod's caddy container runs the misp image.
image:
  misp: ghcr.io/oivindoh/misp-container
  modules: ghcr.io/oivindoh/misp-container-modules
  tag: ""
  pullPolicy: IfNotPresent

# Secrets with the registry credentials for the images, by name.
imagePullSecrets: []

# Node selection for every pod of the release.
nodeSelector: {}

# Tolerations for every pod of the release.
tolerations: []

# Affinity for every pod of the release.
affinity: {}

# The misp-env ConfigMap: these entries on top of files/base.env. Every MISP pod reads it.
env: {}
  # MISP_BASEURL: https://misp.example.com
  # ADMIN_EMAIL: admin@example.com

# The misp-db, misp-app and misp-admin Secrets: these entries on top of files/secrets-*.env,
# whose placeholders the configure Job refuses. With create: false the chart renders none of
# them: supply Secrets with the same names and keys (SOPS, External Secrets, Sealed Secrets).
secrets:
  create: true
  db: {}
  app: {}
  admin: {}

# The connection to PostgreSQL and Redis from Secrets the release does not make, such as the
# ones a database operator keeps (docs/kubernetes.md, External PostgreSQL and Redis): each Secret
# by name, with the env var that each of its keys fills. They replace the same entries of
# misp-env, misp-db and misp-app in every pod, the postgres and redis components included.
connectionSecrets: []
  # - name: misp-pguser-misp
  #   keys: {DB_HOST: host, DB_PORT: port, DB_NAME: dbname, DB_USER: user, DB_PASSWORD: password}

# The CA certificate of the PostgreSQL server, from a Secret: a name and a key. Every pod that
# connects mounts it at DB_SSLROOTCERT, for DB_SSLMODE verify-ca or verify-full in env.
databaseCA: {}
  # databaseCA: {name: misp-cluster-cert, key: ca.crt}

# The configure Job: schema, MISP's updates, admin user and organisation, on every install and upgrade.
configure:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: 2000m, memory: 2Gi}

# MISP's web tier: PHP-FPM and the caddy sidecar in each pod. Replicas scale freely.
web:
  replicas: 1
  resources:
    phpFpm:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 2000m, memory: 4Gi}
    caddy:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 500m, memory: 128Mi}

# The background workers, which take their jobs from Redis. Replicas scale freely.
worker:
  replicas: 1
  resources:
    requests: {cpu: 10m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 2Gi}

# The Prometheus exporter (docs/metrics.md).
metrics:
  resources:
    requests: {cpu: 5m, memory: 32Mi}
    limits: {cpu: 100m, memory: 128Mi}

# misp-modules: the enrichment, import, export and action modules.
modules:
  replicas: 1
  resources:
    requests: {cpu: 10m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 1Gi}

# The org-sync Job applies orgs, the content of orgs.yaml (deploy/orgs.yaml.example), through
# the API after each install and upgrade. It exits at once when ADMIN_KEY is empty.
orgSync:
  orgs:
    teams: []
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

# Attachments, org logos and custom images on the claim attachments. Web and worker pods on
# different nodes write there, so the storage class must offer ReadWriteMany. For attachments in
# S3, set PLUGIN_S3_BUCKET_NAME in env and claim: false; org logos and custom images then stay
# in each pod.
attachments:
  claim: true
  size: 20Gi
  accessMode: ReadWriteMany
  storageClass: ""

# Single-node PostgreSQL on a ReadWriteOnce claim. Leave it off for an external PostgreSQL
# (DB_HOST in env or connectionSecrets; CloudNativePG, StackGres, Percona and the like).
postgres:
  enabled: false
  image: docker.io/library/postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
  size: 20Gi
  storageClass: ""
  args: ["-c", "shared_buffers=512MB"]
  resources:
    requests: {cpu: 200m, memory: 1Gi}
    limits: {cpu: 4000m, memory: 4Gi}

# Single Redis without persistence: sessions and queued jobs do not survive a restart. Leave it
# off for an external Redis (MISP_REDIS_HOST in env or connectionSecrets). maxmemory caps the
# data, under the memory limit: past it Redis refuses writes, and MISP's API calls and logins
# fail, because MISP keeps the feed and server caches, sessions and key use counters there.
redis:
  enabled: false
  image: docker.io/library/redis:8.10.1-trixie@sha256:8a1efc5f479551822b47424ccae982026b633f28818eab0387348120a61e10e2
  maxmemory: 256mb
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {cpu: 1000m, memory: 384Mi}

# An Ingress to the web Service. The default annotation makes the haproxy ingress replace
# X-Forwarded-For with the address it sees (docs/kubernetes.md, Client addresses).
ingress:
  enabled: false
  className: haproxy
  host: misp.example.com
  tlsSecret: misp-tls
  annotations:
    haproxy.org/request-set-header: "X-Forwarded-For %[src]"

# An HTTPRoute for a Gateway API implementation, in place of the ingress. The Gateway must
# allow routes from this namespace; set TRUSTED_PROXY_CIDR in env to its proxy pods.
httpRoute:
  enabled: false
  parentRefs:
    - name: gateway
      namespace: gateway-system
  hostnames:
    - misp.example.com

# NetworkPolicies for the release's pods, for any CNI that enforces the NetworkPolicy API,
# Cilium included: ingress from the release's own pods, DNS, HTTPS out, SMTP and LDAP.
# ingressNamespace holds the ingress or Gateway proxies, monitoringNamespace Prometheus;
# egress adds rules for the MISP pods, by default an external PostgreSQL and Redis.
networkPolicy:
  enabled: false
  ingressNamespace: haproxy-controller
  monitoringNamespace: monitoring
  # Egress rules of the MISP pods, on top of the chart's. A rule names the port the server's
  # pods listen on.
  egress:
    - ports: [{port: 5432, protocol: TCP}, {port: 6379, protocol: TCP}]
    # - to: [{podSelector: {matchLabels: {cnpg.io/cluster: misp-pg}}}]
    #   ports: [{port: 5432, protocol: TCP}]

# The periodic tasks as CronJobs, each running MISP's console in its pod: tasks maps a task to
# its schedule, workflows a workflow ID to its schedule. The pod's PHP process has the workers'
# memory ceiling (WORKER_MEMORY_LIMIT, else PHP_MEMORY_LIMIT), which resources must hold.
cronjobs:
  enabled: false
  tasks:
    cache-feeds: "20 2 * * *"
    fetch-feeds: "30 2 * * *"
    cache-servers: "40 2 * * *"
    pull-servers: "*/5 * * * *"
    push-servers: "*/15 * * * *"
    update-galaxies: "0 3 * * *"
    update-taxonomies: "10 3 * * *"
    update-warninglists: "20 3 * * *"
    update-noticelists: "30 3 * * *"
    update-object-templates: "40 3 * * *"
    push-taxii: "7 * * * *"
    # MISP's console fails a run while no blueprint exists: give it a schedule once one does
    sharing-group-blueprints: ""
    periodic-summary: "0 6 * * *"
    # Need the oidc or ldap group: give check-user-validity a schedule, such as "30 5 * * *",
    # to report each account the provider no longer backs, or block-invalid-users to disable it
    check-user-validity: ""
    block-invalid-users: ""
  workflows: {}
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 2560Mi}

# Nightly deletes of old rows in jobs, logs and audit_logs (HOUSEKEEPING_<TABLE>_DAYS in env,
# defaults 2, 30 and 90).
housekeeping:
  enabled: false
  schedules:
    jobs: "0 2 * * *"
    logs: "0 3 * * *"
    audit_logs: "10 3 * * *"
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

# A copy of an existing MySQL or MariaDB MISP into the database, before the configure Job runs
# (docs/migration.md). secret: entries on top of files/secrets-migrate.env for the misp-migrate
# Secret. volumes and volumeMounts: the source's attachments directory.
migrate:
  enabled: false
  secret: {}
  volumes: []
  volumeMounts: []
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 2000m, memory: 1Gi}
