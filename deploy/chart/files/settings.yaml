      blank_protection: true
    Proxy.port:
      value: ""
      blank_protection: true
    Proxy.method:
      value: ""
      blank_protection: true
    Proxy.user:
      value: ""
      blank_protection: true
    Proxy.password:
      value: ""
      blank_protection: true

  # -- custom_auth: header authentication from a reverse proxy, no directory lookup
  # (CUSTOM_AUTH_ENABLE=true turns it on; the CUSTOM_AUTH_* names are aliases, below)
  custom_auth:

    Plugin.CustomAuth_enable:
      value: false
    Plugin.CustomAuth_header:
      value: "X_FORWARDED_EMAIL"
    Plugin.CustomAuth_use_header_namespace:
      value: true
    Plugin.CustomAuth_header_namespace:
      value: "HTTP_"
    Plugin.CustomAuth_required:
      value: false
    Plugin.CustomAuth_name:
      value: "External Authentication"
    Plugin.CustomAuth_disable_logout:
      value: false
    Plugin.CustomAuth_only_allow_source:
      value: ""
