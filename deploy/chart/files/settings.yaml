    LdapAuth.ldapCheckUserAccountControl:
      value: false
    LdapAuth.ldapEscape:
      value: true
    LdapAuth.ldapHeaderAuth:
      value: false
    LdapAuth.ldapHeaderAuthHeader:
      value: ""
      blank_protection: true
    LdapAuth.ldapHeaderAuthTrustedProxies:
      value: []
    LdapAuth.debug:
      value: false

# Env vars that take another's value unless set themselves, in this order: set MISP_BASEURL,
# ADMIN_ORG, ADMIN_EMAIL, MISP_REDIS_* and the module URL once
derived:
  - from: MISP_BASEURL
    to: [MISP_EXTERNAL_BASEURL, SECURITY_REST_CLIENT_BASEURL]
  # MISP.org names the hosting organisation in e-mail subjects and STIX 1 exports;
  # MISP 3.0 cannot frame a STIX 1 package for an empty one
  - from: ADMIN_ORG
    to: [MISP_ORG]
  - from: ADMIN_EMAIL
    to: [MISP_EMAIL]
  - from: MISP_EMAIL
    to: [MISP_CONTACT, GNUPG_EMAIL]
  - from: MISP_REDIS_HOST
    to: [SIMPLEBACKGROUNDJOBS_REDIS_HOST, PLUGIN_ZEROMQ_REDIS_HOST]
  - from: MISP_REDIS_PORT
    to: [SIMPLEBACKGROUNDJOBS_REDIS_PORT, PLUGIN_ZEROMQ_REDIS_PORT]
  - from: MISP_REDIS_PASSWORD
    to: [SIMPLEBACKGROUNDJOBS_REDIS_PASSWORD, PLUGIN_ZEROMQ_REDIS_PASSWORD]
  - from: PLUGIN_ENRICHMENT_SERVICES_URL
    to: [PLUGIN_IMPORT_SERVICES_URL, PLUGIN_EXPORT_SERVICES_URL, PLUGIN_ACTION_SERVICES_URL]

# Documented short names, mapped onto the env vars of the settings
# (OidcAuth.provider_url -> OIDCAUTH_PROVIDER_URL)
aliases:
  OIDC_PROVIDER_URL: OIDCAUTH_PROVIDER_URL
  OIDC_ISSUER: OIDCAUTH_ISSUER
  OIDC_CLIENT_ID: OIDCAUTH_CLIENT_ID
  OIDC_CLIENT_SECRET: OIDCAUTH_CLIENT_SECRET
  OIDC_ROLES_PROPERTY: OIDCAUTH_ROLES_PROPERTY
  OIDC_ROLES_MAPPING: OIDCAUTH_ROLE_MAPPER
  OIDC_DEFAULT_ORG: OIDCAUTH_DEFAULT_ORG
  OIDC_SCOPES: OIDCAUTH_SCOPES
  OIDC_CODE_CHALLENGE_METHOD: OIDCAUTH_CODE_CHALLENGE_METHOD
  OIDC_AUTH_METHOD: OIDCAUTH_AUTHENTICATION_METHOD
  OIDC_MIXEDAUTH: OIDCAUTH_MIXEDAUTH
  OIDC_DISABLE_REQUEST_OBJECT: OIDCAUTH_DISABLE_REQUEST_OBJECT
  OIDC_SKIP_PROXY: OIDCAUTH_SKIPPROXY
  # The logout redirect is one setting whichever plugin logs the user in
  OIDC_LOGOUT_URL: PLUGIN_CUSTOMAUTH_CUSTOM_LOGOUT
  # Header authentication (the custom_auth group)
  CUSTOM_AUTH_ENABLE: PLUGIN_CUSTOMAUTH_ENABLE
  CUSTOM_AUTH_HEADER: PLUGIN_CUSTOMAUTH_HEADER
  CUSTOM_AUTH_USE_HEADER_NAMESPACE: PLUGIN_CUSTOMAUTH_USE_HEADER_NAMESPACE
  CUSTOM_AUTH_REQUIRED: PLUGIN_CUSTOMAUTH_REQUIRED
  CUSTOM_AUTH_HEADER_NAMESPACE: PLUGIN_CUSTOMAUTH_HEADER_NAMESPACE
  CUSTOM_AUTH_NAME: PLUGIN_CUSTOMAUTH_NAME
  CUSTOM_AUTH_DISABLE_LOGOUT: PLUGIN_CUSTOMAUTH_DISABLE_LOGOUT
  CUSTOM_AUTH_ONLY_ALLOW_SOURCE: PLUGIN_CUSTOMAUTH_ONLY_ALLOW_SOURCE
  CUSTOM_AUTH_CUSTOM_PASSWORD_RESET: PLUGIN_CUSTOMAUTH_CUSTOM_PASSWORD_RESET
  CUSTOM_AUTH_CUSTOM_LOGOUT: PLUGIN_CUSTOMAUTH_CUSTOM_LOGOUT
