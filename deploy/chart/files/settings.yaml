    GnuPG.homedir:
      value: /var/www/MISP/.gnupg
    GnuPG.password:
      value: ""
    GnuPG.onlyencrypted:
      value: false
    GnuPG.sign:
      value: false
    SMIME.enabled:
      value: false
    SMIME.cert_public_sign:
      value: "/var/www/MISP/.smime/email@address.com.pem"
    SMIME.key_sign:
      value: "/var/www/MISP/.smime/email@address.com.key"
    SMIME.password:
      value: ""
      blank_protection: true

  # -- s3: S3 attachment storage (only while PLUGIN_S3_BUCKET_NAME is set, which also sets MISP.attachments_dir to s3://)
  s3:

    Plugin.S3_aws_compatible:
      value: true
    Plugin.S3_bucket_name:
      value: ""
    Plugin.S3_aws_endpoint:
      value: ""
    Plugin.S3_aws_access_key:
      value: ""
    Plugin.S3_aws_secret_key:
      value: ""
    Plugin.S3_region:
