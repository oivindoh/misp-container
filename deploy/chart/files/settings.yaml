    Plugin.Cortex_ssl_verify_host:
      value: true
    Plugin.Cortex_ssl_verify_peer:
      value: true
    Plugin.Workflow_enable:
      value: true
    Plugin.Workflow_debug_url:
      value: "http://127.0.0.1:27051"

    # Module timeouts
    Plugin.Action_timeout:
      value: 10
    Plugin.Import_timeout:
      value: 10
    Plugin.Export_timeout:
      value: 10

    # Sightings
    Plugin.Sightings_policy:
      value: 2
    Plugin.Sightings_range:
      value: 365
    Plugin.Sightings_anonymise_as:
      value: 0

    # Benchmarking
    Plugin.Benchmarking_slow_log_threshold:
