    Plugin.RPZ_email:
      value: "root.localhost"
    Plugin.RPZ_ttl:
      value: "1w"
    Plugin.RPZ_refresh:
      value: "2h"
    Plugin.RPZ_retry:
      value: "30m"
    Plugin.RPZ_expiry:
      value: "30d"
    Plugin.RPZ_minimum_ttl:
      value: "1h"
    Plugin.RPZ_serial:
