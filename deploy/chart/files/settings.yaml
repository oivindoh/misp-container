    OidcAuth.offline_access:
      value: false
    OidcAuth.check_user_validity:
      value: 0
    OidcAuth.update_user_role:
      value: true
    OidcAuth.allow_email_linking:
      value: false
    OidcAuth.require_email_verified:
      value: true
    OidcAuth.login_button_text:
      value: "Login with OIDC"

  # -- ldap: LdapAuth plugin, rendered into config.php when LDAPAUTH_ENABLE=true
  ldap:
    Security.auth:
      value: ["LdapAuth.Ldap"]
    LdapAuth.ldapServer:
      value: ""
      blank_protection: true
    LdapAuth.ldapDn:
      value: ""
      blank_protection: true
    LdapAuth.ldapReaderUser:
      value: ""
      blank_protection: true
    LdapAuth.ldapReaderPassword:
      value: ""
      blank_protection: true
    LdapAuth.ldapSearchFilter:
      value: ""
      blank_protection: true
    LdapAuth.ldapSearchAttribute:
      value: mail
    LdapAuth.ldapEmailField:
      value: mail
    LdapAuth.ldapDefaultOrgId:
      value: ""
      blank_protection: true
    LdapAuth.ldapDefaultRoleId:
      value: ""
      blank_protection: true
    LdapAuth.ldapRoleField:
      value: ""
      blank_protection: true
    LdapAuth.ldapOrgField:
      value: ""
      blank_protection: true
    LdapAuth.ldapOrgGroupMapping:
