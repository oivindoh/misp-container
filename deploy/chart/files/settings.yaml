# MISP's settings, as this repository defines them. Every one here wins over a change in
# MISP's UI or API: the state of MISP is defined in git (docs/configuration.md, Settings).
#
# Format:
#   settings:
#     <group>:
#       <Category.key>:
#         value: <the value>
#         blank_protection: true  # optional: an empty value leaves MISP's own default
#
# The env var of a setting is its name in upper case with dots as underscores
# (MISP.redis_host -> MISP_REDIS_HOST); set in the chart's env value, it replaces the
# value here. The chart passes every setting to MISP as MISP_SETTING_<Category>__<key>,
# MISP's own environment layer, which wins over config.php and the database and makes
# MISP refuse a change. minimum_config, db_enable and s3 (while PLUGIN_S3_BUCKET_NAME is
# set) also go into config.php, which MISP reads before that layer, and so do the auth
# plugin groups while their switch is true (oidc: OIDC_ENABLE, ldap: LDAPAUTH_ENABLE).
# A name without a category (debug) goes into config.php only.

settings:
#     <group>:
#       <MISP.setting.name>:
#         value: <default value>
#         force: true          # optional: pass -f to cake
#         blank_protection: true  # optional: skip if env var is empty
#
# Env var override convention:
#   Any setting can be overridden by an env var derived from the setting name:
#     MISP.redis_host   -> MISP_REDIS_HOST
#     Plugin.S3_bucket_name -> PLUGIN_S3_BUCKET_NAME
#   If the env var exists and is non-empty, the setting is enforced every startup.
#   If no env var, the default is applied once (then user owns it via the UI).
#
# Every pod renders minimum_config and db_enable into config.php, plus s3 while
# PLUGIN_S3_BUCKET_NAME is set and the auth plugin groups (oidc, ldap,
# apache_auth) while their switch is true. The configure step applies the other
# groups to the database, in this order: initialisation, critical, optional,
# upstream (the generated catalogue), gpg, then proxy, kafka, linotp and
# custom_auth while their switch is true (misp_container/configure.py).

settings:

  # -- minimum_config: also rendered into config.php, by every pod ----------
  # MISP never reads SystemSetting::BLOCKED_SETTINGS from the database (salt,
  # encryption key, password policy, python_bin, ca_path, tmpdir,
  # attachments_dir, self_update, online_version_check, system_setting_db,
  # GnuPG.binary, disable_local_feed_access), so those live here.
  minimum_config:

    # Redis connection
    MISP.redis_host:
      value: redis
    MISP.redis_port:
      value: 6379
    MISP.redis_password:
      value: ""
    MISP.redis_database:
      value: 13

    # Redis serializer
    MISP.redis_serializer:
      value: JSON

    # ZeroMQ Redis (mirrors MISP Redis by default)
    Plugin.ZeroMQ_redis_host:
      value: redis
    Plugin.ZeroMQ_redis_port:
      value: 6379
    Plugin.ZeroMQ_redis_password:
      value: ""
    Plugin.ZeroMQ_redis_database:
      value: 1
    Plugin.ZeroMQ_redis_namespace:
      value: mispq
    Plugin.ZeroMQ_enable:
      value: false
    Plugin.ZeroMQ_host:
      value: "127.0.0.1"
    Plugin.ZeroMQ_port:
      value: 50000
    Plugin.ZeroMQ_password:
      value: ""

    # Background jobs Redis
    SimpleBackgroundJobs.redis_host:
      value: redis
    SimpleBackgroundJobs.redis_port:
      value: 6379
    SimpleBackgroundJobs.redis_password:
      value: ""
    SimpleBackgroundJobs.redis_database:
      value: 1
    SimpleBackgroundJobs.redis_namespace:
      value: background_jobs
    SimpleBackgroundJobs.max_job_history_ttl:
      value: 86400
    SimpleBackgroundJobs.redis_serializer:
      value: JSON

    # Paths and binaries
    MISP.python_bin:
      value: /usr/bin/python3
    GnuPG.binary:
      value: /usr/bin/gpg
    MISP.tmpdir:
      value: /var/www/MISP/app/tmp
    MISP.attachments_dir:
      value: /var/www/MISP/app/attachments
    MISP.ca_path:
      value: /etc/ssl/certs/ca-certificates.crt

    # Instance identity
    MISP.osuser:
      value: misp

    # Security bootstrap (BLOCKED_SETTINGS: only config.php counts)
    Security.salt:
      value: ""
      blank_protection: true
    Security.encryption_key:
      value: ""
      blank_protection: true
    Security.password_policy_length:
      value: 12
    # 12-15 must be "complex" - after 16 characters anything goes
    Security.password_policy_complexity:
      value: '/^((?=.*\d)|(?=.*\W+))(?![\n])(?=.*[A-Z])(?=.*[a-z]).*$|.{16,}/'
    Security.rest_client_enable_arbitrary_urls:
      value: false
    Security.disable_local_feed_access:
      value: false
    Security.disable_instance_file_uploads:
      value: false

    # Feature toggles
    MISP.download_gpg_from_homedir:
      value: true
    MISP.background_jobs:
      value: true
    MISP.online_version_check:
      value: false
    MISP.self_update:
      value: false
    MISP.menu_custom_right_link:
      value: ""
    MISP.menu_custom_right_link_html:
      value: ""

  # -- db_enable: toggle system_setting_db -------------------------------------
  db_enable:

    MISP.system_setting_db:
      value: true

  # -- initialisation: core instance settings ----------------------------------
  initialisation:

    # Instance identity and contact
    debug:
      value: 0
    MISP.baseurl:
      value: https://localhost
    MISP.email:
      value: admin@admin.test
    MISP.contact:
      value: admin@admin.test
    # The hosting organisation in e-mail subjects and STIX 1 exports: ADMIN_ORG sets it
    MISP.org:
      value: ""
      blank_protection: true
    MISP.uuid:
      value: ""
      blank_protection: true
    MISP.language:
      value: eng

    # Security
    Security.advanced_authkeys:
      value: true
    Security.disable_browser_cache:
      value: true
    Security.check_sec_fetch_site_header:
      value: true
    Security.username_in_response_header:
