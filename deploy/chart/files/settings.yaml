  # -- optional: nice-to-have defaults ----------------------------------------
  optional:

    MISP.enable_themes:
      value: true
    MISP.welcome_text_top:
      value: ""
      blank_protection: true
    MISP.welcome_text_bottom:
      value: ""
      blank_protection: true
    MISP.log_client_ip:
      value: true
    MISP.log_user_ips:
      value: true
    MISP.log_user_ips_authkeys:
      value: true

    # Module service URLs (all point to modules by default)
    Plugin.Enrichment_services_url:
      value: http://modules
    Plugin.Enrichment_services_port:
      value: 6666
    Plugin.Enrichment_services_enable:
      value: true
    Plugin.Enrichment_timeout:
      value: 30
    Plugin.Enrichment_hover_timeout:
      value: 5
    Plugin.Import_services_url:
      value: http://modules
    Plugin.Import_services_port:
      value: 6666
    Plugin.Import_services_enable:
      value: true
    Plugin.Export_services_url:
      value: http://modules
    Plugin.Export_services_port:
      value: 6666
    Plugin.Export_services_enable:
      value: true
    Plugin.Action_services_url:
