# MISP's web tier: PHP-FPM (port 9002) and a caddy sidecar that serves the static
# files and passes the rest to PHP-FPM over FastCGI (port 8080). Replicas scale
# freely: each pod renders its own app/Config and waits for the configure Job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    app.kubernetes.io/name: web
  annotations:
    # After the configure Job (wave 1)
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/name: web
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        # caddy sidecar - lightweight scratch image with static webroot files
        - name: caddy
          image: ghcr.io/oivindoh/misp-container-caddy
          command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: attachments
              mountPath: /var/www/MISP/app/webroot/img/orgs
              subPath: img/orgs
              readOnly: true
            - name: attachments
              mountPath: /var/www/MISP/app/webroot/img/custom
              subPath: img/custom
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          # Startup proves the application serves once. Readiness and liveness
          # hit PHP-FPM's ping through caddy: no database round trip, so a
          # database outage does not restart the pod.
          startupProbe:
            httpGet:
              path: /users/login
              port: 8080
            failureThreshold: 150
            periodSeconds: 4
          readinessProbe:
            httpGet:
              path: /fpm-ping
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /fpm-ping
              port: 8080
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

        # PHP-FPM - the MISP application
        - name: php-fpm
          image: ghcr.io/oivindoh/misp-container
          command: ["/usr/bin/tini", "--", "python3", "/entrypoint-web.py"]
          ports:
            - name: php-fpm
              containerPort: 9002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: misp-env
            - secretRef:
                name: misp-db
            - secretRef:
                name: misp-app
          volumeMounts:
            - name: files-scripts-tmp
              mountPath: /var/www/MISP/app/files/scripts/tmp
            - name: files-certs
              mountPath: /var/www/MISP/app/files/certs
            - name: files-terms
              mountPath: /var/www/MISP/app/files/terms
            - name: files-img-orgs
              mountPath: /var/www/MISP/app/files/img/orgs
            - name: misp-config
              mountPath: /var/www/MISP/app/Config
            - name: misp-tmp
              mountPath: /var/www/MISP/app/tmp
            - name: misp-gnupg
              mountPath: /var/www/MISP/.gnupg
            - name: gnupg-key
              mountPath: /etc/misp-docker/gnupg
              readOnly: true
            - name: certs
              mountPath: /etc/misp-docker/certs
              readOnly: true
            - name: attachments
              mountPath: /var/www/MISP/app/attachments
            # Org logos and custom images live on the shared attachments claim, so
            # every replica and caddy see the same files
            - name: attachments
              mountPath: /var/www/MISP/app/webroot/img/orgs
              subPath: img/orgs
            - name: attachments
              mountPath: /var/www/MISP/app/webroot/img/custom
              subPath: img/custom
            - name: php-run
              mountPath: /run/php
            - name: php-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 4Gi
          # PHP-FPM only listens after the configure Job has set MISP.live=true,
          # so a TCP probe is enough. The startup budget covers a first install
          # where the Job imports the schema and applies every setting.
          startupProbe:
            tcpSocket:
              port: 9002
            failureThreshold: 150
            periodSeconds: 4
          readinessProbe:
            tcpSocket:
              port: 9002
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9002
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

      volumes:
        - name: files-scripts-tmp
          emptyDir:
            sizeLimit: 500Mi
        - name: files-certs
          emptyDir:
            sizeLimit: 10Mi
        - name: files-terms
          emptyDir:
            sizeLimit: 10Mi
        - name: files-img-orgs
          emptyDir:
            sizeLimit: 100Mi
        - name: misp-config
          emptyDir:
            sizeLimit: 10Mi
        - name: misp-tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: misp-gnupg
          emptyDir:
            sizeLimit: 10Mi
        - name: php-run
          emptyDir:
            sizeLimit: 5Mi
        - name: php-tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: gnupg-key
          secret:
            secretName: misp-gnupg
            optional: true
        - name: attachments
          persistentVolumeClaim:
            claimName: attachments
        - name: certs
          secret:
            secretName: misp-certs
            optional: true
