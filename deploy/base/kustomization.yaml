# MISP itself: configure Job, web, worker, scheduler, metrics, modules,
# org-sync Job, Services, config and the attachments claim. Database, cache,
# ingress, network policies, cronjobs and PDBs are components under
# deploy/components/ that an overlay opts into.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/instance: misp-base

resources:
  - job-configure.yaml
  - job-org-sync.yaml
  - deployment-web.yaml
  - deployment-worker.yaml
  - deployment-scheduler.yaml
  - deployment-metrics.yaml
  - deployment-modules.yaml
  - service-web.yaml
  - service-modules.yaml
  - service-metrics.yaml
  - service-worker.yaml
  - pvc-attachments.yaml

# Configuration from .env files. Overlays merge their own values on top.
# The three Secrets follow their consumers: web and worker pods get misp-db
# and misp-app, never misp-admin; metrics gets two keys of misp-db.
# Production overlays replace them through KSOPS (deploy/overlays/prod).
secretGenerator:
  - name: misp-db
    envs:
      - secrets-db.env
  - name: misp-app
    envs:
      - secrets-app.env
  - name: misp-admin
    envs:
      - secrets-admin.env

configMapGenerator:
  - name: misp-env
    envs:
      - base.env
  # Declarative org config for the org-sync Job. Overlays replace it:
  #   configMapGenerator:
  #     - name: misp-orgs
  #       behavior: replace
  #       files: [orgs.yaml=orgs.yaml]
  - name: misp-orgs
    files:
      - orgs.yaml

images:
  - name: ghcr.io/oivindoh/misp-container
    newTag: 2.5.37
  - name: ghcr.io/oivindoh/misp-container-caddy
    newTag: 2.5.37
  - name: ghcr.io/oivindoh/misp-container-modules
    newTag: 2.5.37
