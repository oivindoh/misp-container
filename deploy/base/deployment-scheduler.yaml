# Single-replica MISP scheduler_worker for MISP-internal scheduling (workflows).
# Must not be scaled past 1 -- duplicate schedulers cause double execution.
# Periodic tasks (feeds, sync, taxonomy updates) belong to the cronjobs
# component; do not enable the same tasks in the MISP UI (Administration >
# Scheduled tasks), or both run them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  labels:
    app: scheduler
    app.kubernetes.io/name: scheduler
  annotations:
    # After the configure Job (wave 1)
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scheduler
      app.kubernetes.io/name: scheduler
  template:
    metadata:
      labels:
        app: scheduler
        app.kubernetes.io/name: scheduler
    spec:
      # Long enough for supervisord to let a running job finish (WORKER_STOP_GRACE)
      terminationGracePeriodSeconds: 330
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: scheduler
          image: ghcr.io/oivindoh/misp-container
          command: ["/usr/bin/tini", "--", "python3", "/entrypoint-worker.py"]
          env:
            # Only run the scheduler, no job queue workers
            - name: NUM_WORKERS_DEFAULT
              value: "0"
            - name: NUM_WORKERS_PRIO
              value: "0"
            - name: NUM_WORKERS_EMAIL
              value: "0"
            - name: NUM_WORKERS_UPDATE
              value: "0"
            - name: NUM_WORKERS_CACHE
              value: "0"
            - name: ENABLE_SCHEDULER
              value: "true"
          envFrom:
            - configMapRef:
                name: misp-env
            - secretRef:
                name: misp-db
            - secretRef:
                name: misp-app
          volumeMounts:
            - name: files-scripts-tmp
              mountPath: /var/www/MISP/app/files/scripts/tmp
            - name: files-certs
              mountPath: /var/www/MISP/app/files/certs
            - name: files-terms
              mountPath: /var/www/MISP/app/files/terms
            - name: files-img-orgs
              mountPath: /var/www/MISP/app/files/img/orgs
            - name: misp-config
              mountPath: /var/www/MISP/app/Config
            - name: misp-tmp
              mountPath: /var/www/MISP/app/tmp
            - name: misp-gnupg
              mountPath: /var/www/MISP/.gnupg
            - name: gnupg-key
              mountPath: /etc/misp-docker/gnupg
              readOnly: true
            - name: certs
              mountPath: /etc/misp-docker/certs
              readOnly: true
            - name: attachments
              mountPath: /var/www/MISP/app/attachments
            - name: scheduler-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 5m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          startupProbe:
            exec:
              command: ["test", "-S", "/tmp/supervisor.sock"]
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["test", "-S", "/tmp/supervisor.sock"]
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["test", "-S", "/tmp/supervisor.sock"]
            periodSeconds: 60
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

      volumes:
        - name: files-scripts-tmp
          emptyDir:
            sizeLimit: 500Mi
        - name: files-certs
          emptyDir:
            sizeLimit: 10Mi
        - name: files-terms
          emptyDir:
            sizeLimit: 10Mi
        - name: files-img-orgs
          emptyDir:
            sizeLimit: 100Mi
        - name: misp-config
          emptyDir:
            sizeLimit: 10Mi
        - name: misp-tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: misp-gnupg
          emptyDir:
            sizeLimit: 10Mi
        - name: scheduler-tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: gnupg-key
          secret:
            secretName: misp-gnupg
            optional: true
        - name: attachments
          persistentVolumeClaim:
            claimName: attachments
        - name: certs
          secret:
            secretName: misp-certs
            optional: true
