---
# -- Pull from all sync servers (every 5 min) --
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pull-servers
  labels:
    app.kubernetes.io/name: pull-servers
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pull-servers
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: docker.io/curlimages/curl
              command: ["sh", "-c"]
              args:
                - |
                  if [ -z "$ADMIN_KEY" ]; then echo "ERROR: ADMIN_KEY not set in misp-secrets. Cronjobs need a valid API key." >&2; exit 1; fi
                  echo "GET /servers (listing sync servers)"
                  SERVERS=$(curl -sS --fail-with-body --max-time 30 \
                    -w "\nHTTP %{http_code} (%{time_total}s)\n" \
                    -H "Authorization: $ADMIN_KEY" -H "Accept: application/json" \
                    http://web:8080/servers)
                  echo "$SERVERS"
                  PULLED=0
                  for id in $(echo "$SERVERS" | grep -o '"id":"[0-9]*"' | grep -o '[0-9]*'); do
                    PULL=$(echo "$SERVERS" | grep -o "\"id\":\"${id}\"[^}]*\"pull\":[a-z]*" | grep -o '"pull":[a-z]*' | grep -o '[a-z]*$')
                    if [ "$PULL" = "true" ]; then
                      echo "pulling server $id"
                      curl -sS --fail-with-body --max-time 600 \
                        -w "\nHTTP %{http_code} (%{time_total}s)\n" \
                        -H "Authorization: $ADMIN_KEY" -H "Accept: application/json" \
                        "http://web:8080/servers/pull/$id"
                      PULLED=$((PULLED + 1))
                    fi
                  done
                  echo "pulled from $PULLED server(s)"
              env:
                - name: ADMIN_KEY
                  valueFrom:
                    secretKeyRef:
                      name: misp-secrets
                      key: ADMIN_KEY
                      optional: true
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
---
# -- Push to all sync servers (every 15 min) --
