# MISP maintenance cronjobs.
# All use curl to hit the MISP API via the web service.
# ADMIN_KEY must be set in the misp-secrets Secret for these to work.
# If unset, jobs exit with a clear error message.

# -- Feed caching: cache all configured feeds --
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cache-feeds
  labels:
    app.kubernetes.io/name: cache-feeds
spec:
  schedule: "20 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cache-feeds
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: docker.io/curlimages/curl
              command: ["sh", "-c"]
              args:
                - |
                  if [ -z "$ADMIN_KEY" ]; then echo "ERROR: ADMIN_KEY not set in misp-secrets. Cronjobs need a valid API key." >&2; exit 1; fi
                  echo "POST /feeds/cacheFeeds/all"
                  curl -sS --fail-with-body --max-time 600 \
                    -w "\nHTTP %{http_code} (%{time_total}s)\n" \
                    -X POST -H "Authorization: $ADMIN_KEY" -H "Accept: application/json" -H "Content-Type: application/json" \
                    http://web:8080/feeds/cacheFeeds/all
              env:
                - name: ADMIN_KEY
                  valueFrom:
                    secretKeyRef:
                      name: misp-secrets
                      key: ADMIN_KEY
                      optional: true
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
---
