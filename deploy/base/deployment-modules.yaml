apiVersion: apps/v1
kind: Deployment
metadata:
  name: modules
  labels:
    app: modules
    app.kubernetes.io/name: modules
spec:
  replicas: 1
  selector:
    matchLabels:
      app: modules
      app.kubernetes.io/name: modules
  template:
    metadata:
      labels:
        app: modules
        app.kubernetes.io/name: modules
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      # Modules call external APIs (VirusTotal, Shodan, etc.).
      # Lower ndots avoids 3+ wasted DNS expansions per external lookup
      # that would be dropped by Cilium L7 DNS policies.
      dnsConfig:
        options:
          - name: ndots
            value: "1"

      containers:
        - name: modules
          image: ghcr.io/oivindoh/misp-container-modules
          args: ["-l", "::"]
          ports:
            - name: http
              containerPort: 6666
              protocol: TCP
          env:
            - name: MPLCONFIGDIR
              value: /tmp/matplotlib
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 6666
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 6666
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 6666
            periodSeconds: 60
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
