# One-shot configuration: schema, settings, admin user, GPG, auth.
# Web and worker pods wait until this Job has set MISP.live=true and recorded
# their image version, so the order of the rollout does not depend on the
# tool that applies the manifests. The Job removes itself ten minutes after
# it finishes (ttlSecondsAfterFinished), so the next apply or reconcile
# creates it again; a run on a configured instance takes seconds.
#
# Argo CD: a Sync hook in wave 1 (the Deployments are wave 2), recreated on
# every sync. Other tools ignore these annotations.
apiVersion: batch/v1
kind: Job
metadata:
  name: configure
  labels:
    app: configure
    app.kubernetes.io/name: configure
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: configure
        app.kubernetes.io/name: configure
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: configure
          image: ghcr.io/oivindoh/misp-container
          command: ["/usr/bin/tini", "--", "python3", "/entrypoint-configure.py"]
          envFrom:
            - configMapRef:
                name: misp-env
            - secretRef:
                name: misp-db
            - secretRef:
                name: misp-app
            - secretRef:
                name: misp-admin
          volumeMounts:
            - name: files-scripts-tmp
              mountPath: /var/www/MISP/app/files/scripts/tmp
            - name: files-certs
              mountPath: /var/www/MISP/app/files/certs
            - name: files-terms
              mountPath: /var/www/MISP/app/files/terms
            - name: files-img-orgs
              mountPath: /var/www/MISP/app/files/img/orgs
            - name: misp-config
              mountPath: /var/www/MISP/app/Config
            - name: misp-tmp
              mountPath: /var/www/MISP/app/tmp
            - name: misp-gnupg
              mountPath: /var/www/MISP/.gnupg
            - name: gnupg-key
              mountPath: /etc/misp-docker/gnupg
              readOnly: true
            - name: certs
              mountPath: /etc/misp-docker/certs
              readOnly: true
            - name: configure-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

      volumes:
        - name: files-scripts-tmp
          emptyDir:
            sizeLimit: 500Mi
        - name: files-certs
          emptyDir:
            sizeLimit: 10Mi
        - name: files-terms
          emptyDir:
            sizeLimit: 10Mi
        - name: files-img-orgs
          emptyDir:
            sizeLimit: 100Mi
        - name: misp-config
          emptyDir:
            sizeLimit: 10Mi
        - name: misp-tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: misp-gnupg
          emptyDir:
            sizeLimit: 10Mi
        - name: configure-tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: gnupg-key
          secret:
            secretName: misp-gnupg
            optional: true
        - name: certs
          secret:
            secretName: misp-certs
            optional: true
