apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics
  labels:
    app: metrics
    app.kubernetes.io/name: metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics
      app.kubernetes.io/name: metrics
  template:
    metadata:
      labels:
        app: metrics
        app.kubernetes.io/name: metrics
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9191"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: metrics
          image: ghcr.io/oivindoh/misp-container
          command: ["/usr/bin/tini", "--", "python3", "/entrypoint-metrics.py"]
          ports:
            - name: metrics
              containerPort: 9191
              protocol: TCP
          envFrom:
            - configMapRef:
                name: misp-env
          # Database credentials only: the exporter never needs the admin or
          # application secrets
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: misp-secrets
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: misp-secrets
                  key: MYSQL_PASSWORD
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 9191
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 9191
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9191
            periodSeconds: 60
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
