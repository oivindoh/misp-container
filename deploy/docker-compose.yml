# Compose stack for running MISP with podman.
#
# Pull and run (no build required):
#   podman compose up -d
#
# Build from source and run:
#   podman compose build
#   podman compose up -d
#
# Default login: admin@admin.test / ChangeMe-Str0ng!Pass#2026
#
# MISP_IMAGE_TAG selects the image tag (default: the current release); CI sets
# it to the tag it built so the suites run the images from the checkout.

x-misp-image: &misp-image
  image: ghcr.io/oivindoh/misp-container:${MISP_IMAGE_TAG:-2.5.37}
  build:
    context: ..
    target: final

x-misp-caddy-image: &misp-caddy-image
  image: ghcr.io/oivindoh/misp-container-caddy:${MISP_IMAGE_TAG:-2.5.37}
  build:
    context: ..
    target: caddy

x-misp-modules-image: &misp-modules-image
  image: ghcr.io/oivindoh/misp-container-modules:${MISP_IMAGE_TAG:-2.5.37}
  build:
    context: ..
    target: modules

x-misp-common: &misp-common
  <<: *misp-image
  env_file:
    - base/base.env
    - base/secrets-db.env
    - base/secrets-app.env
    - base/secrets-admin.env
    - compose.env
    - compose-secrets.env
  user: "1000:1000"

services:
  # -- One-shot configure: schema, settings, admin, GPG, sets MISP.live -----
  configure:
    <<: *misp-common
    command: ["python3", "/entrypoint-configure.py"]
    volumes:
      - misp-files-scripts-tmp:/var/www/MISP/app/files/scripts/tmp
      - misp-files-certs:/var/www/MISP/app/files/certs
      - misp-files-terms:/var/www/MISP/app/files/terms
      - misp-files-img-orgs:/var/www/MISP/app/files/img/orgs
      - misp-config:/var/www/MISP/app/Config
      - misp-tmp:/var/www/MISP/app/tmp
      - misp-gnupg:/var/www/MISP/.gnupg
      - configure-tmp:/tmp
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -- PHP-FPM (scale freely: podman compose up -d --scale web=2) ------------
  web:
    <<: *misp-common
    command: ["python3", "/entrypoint-web.py"]
    volumes:
      - misp-files-scripts-tmp:/var/www/MISP/app/files/scripts/tmp
      - misp-files-certs:/var/www/MISP/app/files/certs
      - misp-files-terms:/var/www/MISP/app/files/terms
      - misp-files-img-orgs:/var/www/MISP/app/files/img/orgs
      - misp-attachments:/var/www/MISP/app/attachments
      - misp-config:/var/www/MISP/app/Config
      - misp-tmp:/var/www/MISP/app/tmp
      - misp-gnupg:/var/www/MISP/.gnupg
      - misp-img-orgs:/var/www/MISP/app/webroot/img/orgs
      - misp-img-custom:/var/www/MISP/app/webroot/img/custom
      - php-tmp:/tmp
    depends_on:
      configure:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -- Caddy (static files + FastCGI reverse proxy to PHP-FPM) -------------
  caddy:
    <<: *misp-caddy-image
    user: "1000:1000"
    environment:
      PHP_FPM_HOST: web
      # Set CADDY_ADDRESS to a domain (e.g. misp.example.com) for automatic HTTPS.
      # Leave unset for plain HTTP on :8080 (when behind a load balancer).
      # CADDY_ADDRESS: misp.example.com
    ports:
      - "8080:8080"
      # - "443:443"   # uncomment for HTTPS
      # - "80:80"     # uncomment for HTTP->HTTPS redirect
    volumes:
      - misp-img-orgs:/var/www/MISP/app/webroot/img/orgs:ro
      - misp-img-custom:/var/www/MISP/app/webroot/img/custom:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  # -- Background workers -------------------------------------------------
  worker:
    <<: *misp-common
    command: ["python3", "/entrypoint-worker.py"]
    volumes:
      - misp-files-scripts-tmp:/var/www/MISP/app/files/scripts/tmp
      - misp-files-certs:/var/www/MISP/app/files/certs
      - misp-files-terms:/var/www/MISP/app/files/terms
      - misp-files-img-orgs:/var/www/MISP/app/files/img/orgs
      - misp-attachments:/var/www/MISP/app/attachments
      - misp-config:/var/www/MISP/app/Config
      - worker-misp-tmp:/var/www/MISP/app/tmp
      - misp-gnupg:/var/www/MISP/.gnupg
      - worker-tmp:/tmp
    depends_on:
      configure:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -- Org sync (runs once after MISP is ready, then exits) ----------------
  sync:
    <<: *misp-common
    command: ["python3", "/entrypoint-sync.py"]
    environment:
      SYNC_BASE_URL: http://caddy:8080
    # volumes:
    #   - ./orgs.yaml:/etc/misp-docker/orgs.yaml:ro
    depends_on:
      - caddy

  # -- MISP modules (enrichment, import, export, actions) -------------------
  modules:
    <<: *misp-modules-image
    environment:
      MPLCONFIGDIR: /tmp/matplotlib
    tmpfs:
      - /tmp:size=100M
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6666/healthcheck')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -- Prometheus metrics exporter ------------------------------------------
  metrics:
    <<: *misp-common
    command: ["python3", "/entrypoint-metrics.py"]
    ports:
      - "9191:9191"
    depends_on:
      mysql:
        condition: service_healthy

  # -- Tools (podman compose --profile tools run --rm composer-lock) ---------
  composer-lock:
    profiles: [tools]
    build:
      context: ..
      target: composer-lock
    command: ["cat", "/tmp/composer.lock"]

  # -- MariaDB -------------------------------------------------------------
  mysql:
    image: docker.io/library/mariadb:11.8.6@sha256:78a5047d3ba33975f183f183c2464cc7f1eab13ec8667e57cc9a5821d6da7577
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=1G
    env_file:
      - base/secrets-db.env
      - compose-secrets.env
    environment:
      MARIADB_DATABASE: misp
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -- PostgreSQL (podman compose --profile postgres; set DB_ENGINE=postgres,
  #    DB_HOST=postgres, DB_PORT=5432 in compose.env) ----------------------------
  postgres:
    profiles: [postgres]
    image: docker.io/library/postgres:17
    env_file:
      - base/secrets-db.env
      - compose-secrets.env
    environment:
      POSTGRES_DB: misp
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d misp"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -- Redis ---------------------------------------------------------------
  redis:
    image: docker.io/library/redis:8.6.3-trixie@sha256:0c341492924cad6f5483f9133e43bd6c51ecdecbcadfac5b51657393b6a7936c
    env_file:
      - compose-secrets.env
    command: >
      sh -c 'redis-server
      --requirepass "$$MISP_REDIS_PASSWORD"
      --maxmemory 128mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$MISP_REDIS_PASSWORD --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  misp-files-scripts-tmp:
  misp-files-certs:
  misp-files-terms:
  misp-files-img-orgs:
  misp-attachments:
  misp-config:
  misp-tmp:
  misp-gnupg:
  misp-img-orgs:
  misp-img-custom:
  configure-tmp:
  php-tmp:
  worker-misp-tmp:
  worker-tmp:
  mysql-data:
  postgres-data:
  caddy-data:
  caddy-config:
